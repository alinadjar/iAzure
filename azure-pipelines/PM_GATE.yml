pool:
  name: "QA_FX"

parameters:
  - name: assembly
    displayName: 'Confirm Assembly for Public Access:'
    type: string
    default: '0.0.0.0'    
  
  - name: comments
    displayName: 'Additional Comments'
    type: string
    default: '-'

steps:
  - checkout: none

  - task: Bash@3
    displayName: 'PM Decision'
    env:
      ASSEMBLY: ${{ parameters.assembly }}
    inputs:
      targetType: 'inline'
      script: |
        #!/bin/bash
        
        set -e
        
        echo "===================================="
        echo "            PM PIPELINE             "
        echo "===================================="

        export REDISCLI_AUTH="$(REDIS_PASSWORD)"
        REDIS_PORT="6379"
        
        # Validate inputs
        if [ -z "$ASSEMBLY" ]; then
            echo "❌ Error: ASSEMBLY environment variable is required"
            echo "   Set this in your pipeline or pass as parameter"
            exit 1
        fi

        # MongoDB connection details
        MONGO_URI="$(MONGODB_URI)"
        MONGO_DB="${MONGODB_DB:-qa}"
        MONGO_COLLECTION="${MONGODB_COLLECTION:-releases}"
        ERP="FX"
        COMMENTS="${{ parameters.comments }}"
        
        echo "📋 Configuration:"
        echo "   Assembly: ${ASSEMBLY}"
        echo "   ERP: ${ERP}"
        echo "   Comments: ${COMMENTS:-None}"
        echo ""
        
        # Validate MongoDB connection
        if [ -z "$MONGO_URI" ]; then
            echo "❌ Error: MONGODB_URI environment variable is not set"
            exit 1
        fi
        
        echo "🔗 MongoDB URI: ${MONGO_URI//@*/@****}"  # Mask password
        echo ""
        
        # Get user information
        USER="${BUILD_REQUESTEDFOR}"
        if [ -z "$USER" ]; then
            USER="${BUILD_QUEUEDBY}"
        fi
        if [ -z "$USER" ]; then
            USER="${AGENT_NAME:-unknown-user}"
        fi
        # Clean up username
        USER=$(echo "$USER" | sed 's/.*\\//' | sed 's/@.*//' | sed 's/ .*//')
        
        # Timestamps
        CONFIRM_DT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        CURRENT_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        
        echo "👤 User: $USER"
        echo "📅 Confirm Date: $CONFIRM_DT"
        echo ""

        # Create MongoDB query script (READ ONLY)
        cat > /tmp/pm-decision.js << 'EOF'
        // MongoDB PM Decision Script - READ ONLY
        const uri = process.env.MONGO_URI;
        const dbName = process.env.MONGO_DB || 'qa';
        const collectionName = process.env.MONGO_COLLECTION || 'releases';
        const assembly = process.env.ASSEMBLY;
        const erp = process.env.ERP;

        // Connect to MongoDB
        const client = new Mongo(uri);
        const db = client.getDB(dbName);
        const collection = db.getCollection(collectionName);

        // Find the document
        const filter = { 
          erp: erp,
          assembly: assembly
        };

        print(`🔍 Fetching current record from MongoDB...`);
        const currentDoc = collection.findOne(filter);

        if (!currentDoc) {
          print(`❌ No record found for erp: ${erp}, assembly: ${assembly}`);
          print(`   The record may not have been created yet.`);
          client.close();
          process.exit(1);
        }

        print(`✅ Current record found:`);
        print(JSON.stringify(currentDoc, null, 2));
        print("");

        // Extract tag from current document
        const dockerTag = currentDoc.tag || null;
        const push_dt = currentDoc.push_dt || null;
        const qa_vote = currentDoc.qa_vote || null;
        const qa_voted_by = currentDoc.qa_voted_by || null;
        const qa_vote_dt = currentDoc.qa_vote_dt || null;
        const pass_rate = currentDoc.pass_rate || null;
        const is_published = currentDoc.is_published || false;

        print(`📦 Extracted Tag: ${dockerTag}`);
        print(`📅 Push Date: ${push_dt}`);
        print(`✅ QA Vote: ${qa_vote}`);
        print(`👤 QA Voted By: ${qa_voted_by}`);
        print(`📅 QA Vote Date: ${qa_vote_dt}`);
        print(`📊 Pass Rate: ${pass_rate}%`);
        print(`📌 Is Published: ${is_published}`);

        // Write results to a JSON file for the shell script
        const fs = require('fs');
        const resultData = {
          docker_tag: dockerTag,
          push_dt: push_dt,
          qa_vote: qa_vote,
          qa_voted_by: qa_voted_by,
          qa_vote_dt: qa_vote_dt,
          pass_rate: pass_rate,
          is_published: is_published
        };
        
        fs.writeFileSync('/tmp/pm-result.json', JSON.stringify(resultData));
        print(`📄 Results written to /tmp/pm-result.json`);

        client.close();
        EOF

        # Export variables for the mongosh script
        export MONGO_URI="$(MONGODB_URI)"
        export MONGO_DB="${MONGODB_DB:-qa}"
        export MONGO_COLLECTION="${MONGODB_COLLECTION:-releases}"
        export ASSEMBLY="$ASSEMBLY"
        export ERP="FX"

        # Run mongosh directly (no Docker) - READ ONLY
        echo "Running MongoDB PM decision (READ ONLY)..."
        mongosh "$MONGO_URI" --quiet /tmp/pm-decision.js

        # Capture the exit code
        MONGOSH_EXIT_CODE=$?
        
        if [ $MONGOSH_EXIT_CODE -ne 0 ]; then
            echo "❌ MongoDB script failed with exit code: $MONGOSH_EXIT_CODE"
            exit $MONGOSH_EXIT_CODE
        fi

        # Read the results from the JSON file
        echo "📊 Reading results from /tmp/pm-result.json..."
        if [ -f /tmp/pm-result.json ]; then
            DOCKER_TAG=$(jq -r '.docker_tag' /tmp/pm-result.json)
            PUSH_DT=$(jq -r '.push_dt' /tmp/pm-result.json)
            QA_VOTE=$(jq -r '.qa_vote' /tmp/pm-result.json)
            QA_VOTED_BY=$(jq -r '.qa_voted_by' /tmp/pm-result.json)
            QA_VOTE_DT=$(jq -r '.qa_vote_dt' /tmp/pm-result.json)
            PASS_RATE=$(jq -r '.pass_rate' /tmp/pm-result.json)
            IS_PUBLISHED=$(jq -r '.is_published' /tmp/pm-result.json)
            
            # Set Azure DevOps pipeline variables
            # echo "##vso[task.setvariable variable=DOCKER_TAG]${DOCKER_TAG}"
            # echo "##vso[task.setvariable variable=PUSH_DT]${PUSH_DT}"
            # echo "##vso[task.setvariable variable=QA_VOTE]${QA_VOTE}"
            # echo "##vso[task.setvariable variable=QA_VOTED_BY]${QA_VOTED_BY}"
            # echo "##vso[task.setvariable variable=QA_VOTE_DT]${QA_VOTE_DT}"
            # echo "##vso[task.setvariable variable=PASS_RATE]${PASS_RATE}"
            # echo "##vso[task.setvariable variable=IS_PUBLISHED]${IS_PUBLISHED}"
            
            # Also export to current shell for immediate use
            export DOCKER_TAG="$DOCKER_TAG"
            export PUSH_DT="$PUSH_DT"
            export QA_VOTE="$QA_VOTE"
            export QA_VOTED_BY="$QA_VOTED_BY"
            export QA_VOTE_DT="$QA_VOTE_DT"
            export PASS_RATE="$PASS_RATE"
            export IS_PUBLISHED="$IS_PUBLISHED"
            
            # Display extracted variables
            echo ""
            echo "================================================================="
            echo "📊 EXTRACTED VARIABLES FROM MONGODB:"
            echo "   DOCKER_TAG: ${DOCKER_TAG:-NOT SET}"
            echo "   PUSH_DT: ${PUSH_DT:-NOT SET}"
            echo "   QA_VOTE: ${QA_VOTE:-NOT SET}"
            echo "   QA_VOTED_BY: ${QA_VOTED_BY:-NOT SET}"
            echo "   QA_VOTE_DT: ${QA_VOTE_DT:-NOT SET}"
            echo "   PASS_RATE: ${PASS_RATE:-NOT SET}"
            echo "   IS_PUBLISHED: ${IS_PUBLISHED:-NOT SET}"
            echo "================================================================="


            redis-cli -h  "$(REDIS_HOST)" -p "$REDIS_PORT"   SET  fx:version "{\"tag\":\"${DOCKER_TAG}\",\"assembly\":\"${ASSEMBLY}\",\"last_updated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
            # redis-cli -h  "$(REDIS_HOST)" -p "$REDIS_PORT"   GET fx:version | jq .
            echo "curling https://get.sadgan.com/releases/fx:"
            curl -fsSL https://get.sadgan.com/releases/fx | jq .
            
            # Clean up
            rm -f /tmp/pm-result.json
        else
            echo "❌ Error: PM result file not found!"
            exit 1
        fi

        echo "✅ Tag extraction completed successfully"

        echo ""
        echo "================================================================="
        
        # Mattermost Notification
        dt="$(TZ='GMT-3:30' date '+%Y-%m-%d  **%a  %H:%M:%S**')"
        response=$(curl -k -w "\n%{http_code}" --location 'https://n8n.sadgan.int/webhook/3a91de48-0d38-4a13-9e7b-a9de00b4d783' \
          --header 'Content-Type: application/json' \
          --header 'Authorization: Bearer $(JWT_TOKEN_WFN8N___QA-Vote-Notif)' \
          --data '{
              "ERP": "FX",
              "tag": "'"$DOCKER_TAG"'",
              "assembly": "'"$ASSEMBLY"'",
              "user": "'"$USER"'",
              "confirm_dt": "'"$CONFIRM_DT"'",
              "pm_comments": "'"$COMMENTS"'",
              "pm_gate": "true",
              "qa_vote": "'"$QA_VOTE"'",
              "qa_voted_by": "'"$QA_VOTED_BY"'",
              "qa_vote_dt": "'"$QA_VOTE_DT"'",
              "pass_rate": "'"$PASS_RATE"'",
              "push_dt": "'"$PUSH_DT"'",
              "is_published": "'"$IS_PUBLISHED"'"
          }' 2>&1) || true

        # Extract HTTP status code (last line)
        http_code=$(echo "$response" | tail -n1)
        response_body=$(echo "$response" | sed '$d')
        
        # Log the result
        if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
          echo "✅ Notification sent successfully (HTTP $http_code)"
        else
          echo "⚠️ Failed to send notification (HTTP $http_code)"
          echo "Response: $response_body"
          echo "Continuing pipeline execution..."
        fi

        # Clean up temporary files
        rm -f /tmp/pm-decision.js

        echo ""
        echo "================================================================="
        echo "Pipeline execution completed"
        echo "================================================================="