pool:
  name: "QA_FX"

parameters:
  - name: assembly
    displayName: 'select version assembly:'
    type: string
    default: '0.0.0.0'
    
  - name: vote
    displayName: 'Vote Decision'
    type: string
    default: 'APPROVED'
    values:
      - APPROVED
      - REJECTED
  
  - name: pass_rate
    displayName: 'Overall Pass Rate (%)'
    type: number
    default: 0
  
  - name: comments
    displayName: 'Additional Comments'
    type: string
    default: '-'

steps:
  - checkout: none

  - task: Bash@3
    displayName: 'QA Decision'
    env:
      ASSEMBLY: ${{ parameters.assembly }}
    inputs:
      targetType: 'inline'
      script: |
        #!/bin/bash
        
        set -e
        
        echo "===================================="
        echo "    QA PIPELINE - REDIS PROCESSING   "
        echo "===================================="
        
        # Validate inputs
        if [ -z "$ASSEMBLY" ]; then
            echo "❌ Error: ASSEMBLY environment variable is required"
            echo "   Set this in your pipeline or pass as parameter"
            exit 1
        fi

        # MongoDB connection details
        MONGO_URI="$(MONGODB_URI)"
        MONGO_DB="${MONGODB_DB:-qa}"
        MONGO_COLLECTION="${MONGODB_COLLECTION:-releases}"
        ERP="FX"
        VOTE="${{ parameters.vote }}"
        PASS_RATE="${{ parameters.pass_rate }}"
        COMMENTS="${{ parameters.comments }}"
        
        echo "📋 Configuration:"
        echo "   Assembly: ${ASSEMBLY}"
        echo "   ERP: ${ERP}"
        echo "   MongoDB Database: ${MONGO_DB}"
        echo "   MongoDB Collection: ${MONGO_COLLECTION}"
        echo "   Vote: ${VOTE}"
        echo "   Pass Rate: ${PASS_RATE}%"
        echo "   Comments: ${COMMENTS:-None}"
        echo ""
        
        # Validate MongoDB connection
        if [ -z "$MONGO_URI" ]; then
            echo "❌ Error: MONGODB_URI environment variable is not set"
            exit 1
        fi
        
        echo "🔗 MongoDB URI: ${MONGO_URI//@*/@****}"  # Mask password
        echo ""
        
        # Get user information
        USER="${BUILD_REQUESTEDFOR}"
        if [ -z "$USER" ]; then
            USER="${BUILD_QUEUEDBY}"
        fi
        if [ -z "$USER" ]; then
            USER="${AGENT_NAME:-unknown-user}"
        fi
        # Clean up username
        USER=$(echo "$USER" | sed 's/.*\\//' | sed 's/@.*//' | sed 's/ .*//')
        
        # Timestamps
        CONFIRM_DT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        CURRENT_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        
        echo "👤 User: $USER"
        echo "📅 Confirm Date: $CONFIRM_DT"
        echo ""

        # Create MongoDB query script
        cat > /tmp/qa-decision.js << 'EOF'
        // MongoDB QA Decision Script
        const uri = process.env.MONGO_URI;
        const dbName = process.env.MONGO_DB || 'qa';
        const collectionName = process.env.MONGO_COLLECTION || 'releases';
        const assembly = process.env.ASSEMBLY;
        const erp = process.env.ERP;
        const user = process.env.USER;
        const vote = process.env.VOTE;
        const passRate = parseInt(process.env.PASS_RATE);
        const comments = process.env.COMMENTS || '-';
        const confirmDt = process.env.CONFIRM_DT;
        const currentTimestamp = process.env.CURRENT_TIMESTAMP;

        // Connect to MongoDB
        const client = new Mongo(uri);
        const db = client.getDB(dbName);
        const collection = db.getCollection(collectionName);

        // Find the document
        const filter = { 
          erp: erp,
          assembly: assembly
        };

        print(`🔍 Fetching current record from MongoDB...`);
        const currentDoc = collection.findOne(filter);

        if (!currentDoc) {
          print(`❌ No record found for erp: ${erp}, assembly: ${assembly}`);
          print(`   The record may not have been created yet.`);
          client.close();
          process.exit(1);
        }

        print(`✅ Current record found:`);
        print(JSON.stringify(currentDoc, null, 2));
        print("");

        // Extract push_dt from current document
        const push_dt = currentDoc.push_dt || null;
        const dockerTag = currentDoc.tag || null;

        let timeDiffSeconds = null;
        let timeDiffHuman = "unknown";

        if (push_dt) {
          print(`📅 Publish Date: ${push_dt}`);
          
          // Calculate time difference
          const publishEpoch = new Date(push_dt).getTime() / 1000;
          const confirmEpoch = new Date(confirmDt).getTime() / 1000;
          
          if (!isNaN(publishEpoch) && !isNaN(confirmEpoch)) {
            timeDiffSeconds = Math.abs(confirmEpoch - publishEpoch);
            
            // Format the time difference in human-readable format
            const days = Math.floor(timeDiffSeconds / 86400);
            const hours = Math.floor((timeDiffSeconds % 86400) / 3600);
            const minutes = Math.floor((timeDiffSeconds % 3600) / 60);
            const seconds = Math.floor(timeDiffSeconds % 60);
            
            if (days > 0) {
              timeDiffHuman = `${days}d ${hours}h ${minutes}m ${seconds}s`;
            } else if (hours > 0) {
              timeDiffHuman = `${hours}h ${minutes}m ${seconds}s`;
            } else if (minutes > 0) {
              timeDiffHuman = `${minutes}m ${seconds}s`;
            } else {
              timeDiffHuman = `${seconds}s`;
            }
            
            print(`⏱️  Time difference: ${timeDiffHuman} (${timeDiffSeconds} seconds)`);
          } else {
            print(`⚠️ Warning: Could not calculate time difference`);
          }
        } else {
          print(`⚠️ Warning: push_dt not found in current record`);
        }
        print("");

        // Validate vote
        if (vote !== "APPROVED" && vote !== "REJECTED") {
          print(`❌ Invalid vote: ${vote}. Must be APPROVED or REJECTED`);
          client.close();
          process.exit(1);
        }

        // Check if pass_rate is numeric
        if (isNaN(passRate)) {
          print(`❌ Pass rate must be a number: ${passRate}`);
          client.close();
          process.exit(1);
        }

        // Prepare update document
        print(`📝 Updating document with QA decision and time difference...`);
        
        const updateDoc = {
          $set: {
            qa_voted_by: user,
            qa_vote: vote,
            qa_vote_dt: confirmDt,
            pass_rate: passRate,
            qa_comments: comments,
            qa_links: [],
            updatedAt: currentTimestamp,
            qa_time_diff_seconds: timeDiffSeconds,
            qa_time_diff_human: timeDiffHuman
          }
        };

        // Perform the update
        const result = collection.updateOne(filter, updateDoc);

        print(`✅ Updated document:`);
        const updatedDoc = collection.findOne(filter);
        print(JSON.stringify(updatedDoc, null, 2));
        print("");

        // Write results to a JSON file that the shell script can read
        const fs = require('fs');
        const resultData = {
          qa_user: user,
          qa_vote: vote,
          qa_confirm_dt: confirmDt,
          qa_push_dt: push_dt,
          qa_pass_rate: passRate,
          qa_time_diff_seconds: timeDiffSeconds,
          qa_time_diff_human: timeDiffHuman,
          docker_tag: dockerTag,
          qa_passed: (vote === "APPROVED" && passRate >= 80)
        };
        
        fs.writeFileSync('/tmp/qa-result.json', JSON.stringify(resultData));
        print(`📄 Results written to /tmp/qa-result.json`);

        // Determine pipeline outcome
        if (vote === "APPROVED" && passRate >= 80) {
          print(`✅✅✅ QA APPROVED with ${passRate}% pass rate!`);
          print(`⏱️  Time from publish to approval: ${timeDiffHuman}`);
        } else {
          if (vote === "REJECTED") {
            print(`❌❌❌ QA REJECTED by ${user}!`);
            print(`⏱️  Time from publish to rejection: ${timeDiffHuman}`);
          } else {
            print(`⚠️ Pass rate ${passRate}% below threshold (80%)`);
          }
        }

        client.close();
        EOF

        # Export variables for the mongosh script
        export MONGO_URI="$(MONGODB_URI)"
        export MONGO_DB="${MONGODB_DB:-qa}"
        export MONGO_COLLECTION="${MONGODB_COLLECTION:-releases}"
        export ASSEMBLY="$ASSEMBLY"
        export ERP="FX"
        export USER="$USER"
        export VOTE="$VOTE"
        export PASS_RATE="$PASS_RATE"
        export COMMENTS="$COMMENTS"
        export CONFIRM_DT="$CONFIRM_DT"
        export CURRENT_TIMESTAMP="$CURRENT_TIMESTAMP"

        # Run mongosh directly (no Docker)
        echo "🐳 Running MongoDB QA decision..."
        mongosh "$MONGO_URI" --quiet /tmp/qa-decision.js

        # Capture the exit code
        MONGOSH_EXIT_CODE=$?
        
        if [ $MONGOSH_EXIT_CODE -ne 0 ]; then
            echo "❌ MongoDB script failed with exit code: $MONGOSH_EXIT_CODE"
            exit $MONGOSH_EXIT_CODE
        fi

        # Read the results from the JSON file
        echo "📊 Reading results from /tmp/qa-result.json..."
        if [ -f /tmp/qa-result.json ]; then
            QA_USER=$(jq -r '.qa_user' /tmp/qa-result.json)
            QA_VOTE=$(jq -r '.qa_vote' /tmp/qa-result.json)
            QA_CONFIRM_DT=$(jq -r '.qa_confirm_dt' /tmp/qa-result.json)
            QA_PUSH_DT=$(jq -r '.qa_push_dt' /tmp/qa-result.json)
            QA_PASS_RATE=$(jq -r '.qa_pass_rate' /tmp/qa-result.json)
            QA_TIME_DIFF_SECONDS=$(jq -r '.qa_time_diff_seconds' /tmp/qa-result.json)
            QA_TIME_DIFF_HUMAN=$(jq -r '.qa_time_diff_human' /tmp/qa-result.json)
            DOCKER_TAG=$(jq -r '.docker_tag' /tmp/qa-result.json)
            QA_PASSED=$(jq -r '.qa_passed' /tmp/qa-result.json)
            
            
            # Also export to current shell for immediate use
            export QA_USER="$QA_USER"
            export QA_VOTE="$QA_VOTE"
            export QA_CONFIRM_DT="$QA_CONFIRM_DT"
            export QA_PUSH_DT="$QA_PUSH_DT"
            export QA_PASS_RATE="$QA_PASS_RATE"
            export QA_TIME_DIFF_SECONDS="$QA_TIME_DIFF_SECONDS"
            export QA_TIME_DIFF_HUMAN="$QA_TIME_DIFF_HUMAN"
            export DOCKER_TAG="$DOCKER_TAG"
            export QA_PASSED="$QA_PASSED"
            
            # Display extracted variables
            echo ""
            echo "================================================================="
            echo "📊 EXTRACTED VARIABLES:"
            echo "   QA_VOTE: ${QA_VOTE:-NOT SET}"
            echo "   QA_USER: ${QA_USER:-NOT SET}"
            echo "   QA_CONFIRM_DT: ${QA_CONFIRM_DT:-NOT SET}"
            echo "   QA_PASS_RATE: ${QA_PASS_RATE:-NOT SET}"
            echo "   QA_PUSH_DT: ${QA_PUSH_DT:-NOT SET}"
            echo "   QA_TIME_DIFF_SECONDS: ${QA_TIME_DIFF_SECONDS:-NOT SET}"
            echo "   QA_TIME_DIFF_HUMAN: ${QA_TIME_DIFF_HUMAN:-NOT SET}"
            echo "   DOCKER_TAG: ${DOCKER_TAG:-NOT SET}"
            echo "   QA_PASSED: ${QA_PASSED:-NOT SET}"
            echo "================================================================="
            
            # Clean up
            rm -f /tmp/qa-result.json
        else
            echo "❌ Error: QA result file not found!"
            exit 1
        fi

        echo "✅ MongoDB QA decision completed successfully"

        # Now you can use the QA_VOTE variable in shell
        echo ""
        echo "================================================================="
        echo "SHELL DECISION BASED ON QA_VOTE:"
        

