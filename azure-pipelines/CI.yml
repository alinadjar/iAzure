trigger: none

schedules:
- cron: "30 21 * * 4"   
  displayName: Nightly
  branches:
    include:
    - cicd  
  always: true


pool:
  name: 'WEB-1'

parameters:
- name: CREATE_PR
  displayName: "Create PR ?"
  type: string
  default: 'NO'
  values:
    - YES
    - NO
- name: SHOULD_RELEASE
  type: string
  default: 'true'
  values:
    - 'true'
    - 'false'
- name: BRANCH
  type: string
  default: 'dev'
  displayName: "Select Branch"
  values:
    - 'dev'
    - 'alpha'
    - 'beta'
- name: RUN_SONARQUBE
  displayName: "Run SonarQube ?"
  type: string
  default: 'NO'
  values:
    - YES
    - NO    
- name: WORK_ITEM_IDS
  displayName: "Extra work item IDs to link (comma-separated, optional)"
  type: string
  default: ' '
- name: TRIGGER_WI_FOLLOWUP
  displayName: "Trigger WorkItem follow-up pipeline?"
  type: string
  default: 'YES'
  values:
    - YES
    - NO
- name: WI_FOLLOWUP_PIPELINE_ID
  displayName: "WorkItem follow-up pipeline ID (CICD repo)"
  type: string
  default: '147'
- name: NOTIFY_MATTERMOST
  displayName: "Send work item summary to Mattermost?"
  type: string
  default: 'YES'
  values:
    - YES
    - NO


variables:
  # Common variables
  - name: buildPlatform
    value: 'Any CPU'
  - name: buildConfiguration
    value: 'Release'
  - name: isTagDuplicate
    value: 'false'
  - name: orgUrl
    value: 'http://azure.sadgan.int/WebApp'
  - name: project
    value: 'SadganErp'
  - name: isBranchDevelop
    value: ${{ eq(parameters.BRANCH, 'dev') }}
  - name: isBranchDevOps
    value: ${{ eq(parameters.BRANCH, 'devops') }}
  - name: isBranchALPHA
    value: ${{ eq(parameters.BRANCH, 'alpha') }}
  - name: isBranchBETA
    value: ${{ eq(parameters.BRANCH, 'beta') }}
  - name: isBranchMASTER
    value: ${{ eq(parameters.BRANCH, 'master') }} 
  - name: isCreatePR
    value: ${{ eq(parameters.CREATE_PR, 'YES') }} 
  - name: CURRENT_BRANCH
    value: ${{ parameters.BRANCH }}
  - name: System.Diagnostics.DefaultLogDirectory
    value: '$(Agent.TempDirectory)/diag'
  - name: SYSTEM_DEBUG
    value: false
  - name: VSTS_DEBUG
    value: false
  - name: wikiId
    value: 'SadganErp.wiki'


stages:
# Stage 0: INIT
- stage: INIT
  displayName: "Initialize ${{ parameters.BRANCH }}"
  jobs: 
  - job: InitJob
    steps:
    - checkout: none
    - task: Bash@3
      name: init
      displayName: "init 🌿 ${{ parameters.BRANCH }}"
      env:
        CURRENT_BRANCH: ${{ parameters.BRANCH }}
      inputs:
        targetType: 'inline'
        script: |    
          case "$CURRENT_BRANCH" in
              "dev") SOURCE_BRANCH="dev" ;;
              "devops") SOURCE_BRANCH="dev" ;;
              "alpha") SOURCE_BRANCH="dev" ;;
              "beta") SOURCE_BRANCH="alpha" ;;
              "master") SOURCE_BRANCH="beta" ;;
              *)
                  echo "Error: Current branch '$CURRENT_BRANCH' is not valid for promotion"
                  exit 1
                  ;;
          esac
          
          echo "Current branch: $CURRENT_BRANCH"
          echo "Source branch: $SOURCE_BRANCH"
          
          echo "##vso[task.setvariable variable=SOURCE_BRANCH;isOutput=true]$SOURCE_BRANCH"
          echo "##vso[task.setvariable variable=TARGET_BRANCH;isOutput=true]$CURRENT_BRANCH"
          
          # set stage-level variables for downstream stages
          echo "##vso[task.setvariable variable=SOURCE_BRANCH;isOutput=true;isReadonly=true]$SOURCE_BRANCH"
          echo "##vso[task.setvariable variable=TARGET_BRANCH;isOutput=true;isReadonly=true]$CURRENT_BRANCH"

# Stage 1: PR Creation
- stage: PR_Creation
  displayName: 'PR Creation Stage'
  dependsOn: INIT
  condition: and(succeeded(), eq(variables['isCreatePR'], 'True'), eq(variables['isBranchDevelop'], 'False'))
  variables:
    SOURCE_BRANCH: $[ stageDependencies.INIT.InitJob.outputs['init.SOURCE_BRANCH'] ]
    TARGET_BRANCH: $[ stageDependencies.INIT.InitJob.outputs['init.TARGET_BRANCH'] ]
  jobs:
  - job: CreatePRs
    displayName: 'Create PRs & Merge'
    steps:
    - checkout: none
    
    - task: Bash@3
      name: create_pr_multi_repo
      displayName: 'Create & Complete PRs'
      env:
        GIT_PAT: $(GIT_PAT)
        SOURCE_BRANCH: $(SOURCE_BRANCH)
        TARGET_BRANCH: $(TARGET_BRANCH)
        BUILD_ID: $(Build.BuildId)
        BUILD_NUMBER: $(Build.BuildNumber)
        MANUAL_WORK_ITEM_IDS: ${{ coalesce(parameters.WORK_ITEM_IDS, '') }}
        TRIGGER_WI_FOLLOWUP: ${{ parameters.TRIGGER_WI_FOLLOWUP }}
        WI_FOLLOWUP_PIPELINE_ID: ${{ parameters.WI_FOLLOWUP_PIPELINE_ID }}
      inputs:
        targetType: 'inline'
        script: |
          set -e
          # Function to clean repository ID (extract only valid UUID)
          clean_repo_id() {
            local id="$1"
            # Extract UUID format: 8-4-4-4-12 hex digits
            local cleaned=$(echo "$id" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            if [ -z "$cleaned" ]; then
              echo "$id" | tr -d '\n\r ' | cut -c1-36
            else
              echo "$cleaned"
            fi
          }
          
          # Function to safely call curl and validate JSON response
          call_api() {
            local url="$1"
            local method="${2:-GET}"
            local data="${3:-}"
            local content_type="${4:-application/json}"
            local temp_file=$(mktemp)
            local http_code
            
            echo "🔵 Calling API: $method $url" >&2
            
            # Clean URL of any potential newlines or extra characters
            url=$(echo "$url" | tr -d '\n\r ')
            
            # Add cache-control headers for all requests
            if [ "$method" = "GET" ]; then
              http_code=$(curl -s -w "%{http_code}" -u ":$GIT_PAT" \
                -H "Cache-Control: no-cache" \
                -H "Pragma: no-cache" \
                -o "$temp_file" "$url")
            else
              http_code=$(curl -sS -w "%{http_code}" -u ":$GIT_PAT" \
                -H "Content-Type: ${content_type}" \
                -H "Cache-Control: no-cache" \
                -H "Pragma: no-cache" \
                -X "$method" \
                -d "$data" \
                -o "$temp_file" "$url")
            fi
            
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "❌ API call failed with HTTP $http_code" >&2
              if [ -s "$temp_file" ]; then
                cat "$temp_file" >&2
              fi
              rm -f "$temp_file"
              return 1
            fi
            
            # Validate JSON response (skip for empty body)
            if [ -s "$temp_file" ] && ! jq empty "$temp_file" 2>/dev/null; then
              echo "❌ Invalid JSON response" >&2
              cat "$temp_file" >&2
              rm -f "$temp_file"
              return 1
            fi
            
            cat "$temp_file"
            rm -f "$temp_file"
            return 0
          }

          # Extract work item IDs from PR commits (REST) and link them to the PR
          # extract_work_item_ids_from_pr() {
          #   local project_api_url="$1"
          #   local repo_id="$2"
          #   local pr_id="$3"
          #   local repo_id_clean
          #   local pr_id_clean
          #   local commits_url
          #   local commits_json
          #   local commit_count
          #   local tmp_ids
          #   local commit_id
          #   local wi_url
          #   local wi_json
            
          #   repo_id_clean=$(clean_repo_id "$repo_id")
          #   pr_id_clean=$(echo "$pr_id" | tr -d '\n\r ')
          #   tmp_ids=$(mktemp)
            
          #   echo "  🔗 Extracting work items from PR $pr_id_clean commits..." >&2
          #   commits_url="${project_api_url}/git/repositories/${repo_id_clean}/pullrequests/${pr_id_clean}/commits?api-version=7.0&\$top=500"
          #   commits_json=$(call_api "$commits_url") || {
          #     echo "  ⚠️ Failed to list PR commits" >&2
          #     rm -f "$tmp_ids"
          #     return 0
          #   }
            
          #   commit_count=$(echo "$commits_json" | jq '.value | length')
          #   echo "  📋 PR commits found: $commit_count" >&2
            
          #   # Parse #123 / AB#123 from commit messages
          #   echo "$commits_json" | jq -r '.value[].comment // empty' \
          #     | grep -oE '(AB#|#)[0-9]+' | sed 's/AB#//;s/#//' >> "$tmp_ids" 2>/dev/null || true
            
          #   # Work items already associated with commits in Azure DevOps
          #   while IFS= read -r commit_id; do
          #     [ -z "$commit_id" ] && continue
          #     wi_url="${project_api_url}/git/repositories/${repo_id_clean}/commits/${commit_id}/workItems?api-version=7.0"
          #     wi_json=$(call_api "$wi_url") || continue
          #     echo "$wi_json" | jq -r '.value[]?.id // empty' >> "$tmp_ids" 2>/dev/null || true
          #   done < <(echo "$commits_json" | jq -r '.value[].commitId')
            
          #   sort -u "$tmp_ids" | grep -E '^[0-9]+$' || true
          #   rm -f "$tmp_ids"
          # }
          extract_work_item_ids_from_pr() {
            local project_api_url="$1"
            local repo_id="$2"
            local pr_id="$3"
            local repo_id_clean
            local pr_id_clean
            local commits_url
            local commits_json
            local commit_count
            local tmp_ids
            local commit_id
            local wi_url
            local wi_json
            
            repo_id_clean=$(clean_repo_id "$repo_id")
            pr_id_clean=$(echo "$pr_id" | tr -d '\n\r ')
            tmp_ids=$(mktemp)
            
            echo "  🔗 Extracting work items from PR $pr_id_clean commits..." >&2
            commits_url="${project_api_url}/git/repositories/${repo_id_clean}/pullrequests/${pr_id_clean}/commits?api-version=7.0&\$top=500"
            commits_json=$(call_api "$commits_url") || {
              echo "  ⚠️ Failed to list PR commits" >&2
              rm -f "$tmp_ids"
              return 0
            }
            
            commit_count=$(echo "$commits_json" | jq '.value | length')
            echo "  📋 PR commits found: $commit_count" >&2
            
            # Process each commit; skip auto-generated merge commits (e.g. "Merged PR 35972: ...").
            # They duplicate feature commits and can yield wrong work item IDs from long/truncated
            # messages or stale ADO commit associations.
            while IFS= read -r commit_obj; do
              local commit_id comment
              commit_id=$(echo "$commit_obj" | jq -r '.commitId // empty')
              comment=$(echo "$commit_obj" | jq -r '.comment // ""')
              [ -z "$commit_id" ] && continue
              
              if [[ "$comment" == "Merged PR"* ]] || [[ "$comment" == "Merge pull request"* ]] || [[ "$comment" == "Merge branch"* ]]; then
                echo "  ⏭️ Skipping merge commit: $(echo "$comment" | cut -c1-80)" >&2
                continue
              fi
              
              # Parse #123 / AB#123 from commit message
              echo "$comment" | grep -oE '(AB#|#)[0-9]+' | sed 's/AB#//;s/#//' >> "$tmp_ids" 2>/dev/null || true
              
              # Work items already associated with commits in Azure DevOps
              wi_url="${project_api_url}/git/repositories/${repo_id_clean}/commits/${commit_id}/workItems?api-version=7.0"
              wi_json=$(call_api "$wi_url") || continue
              echo "$wi_json" | jq -r '.value[]?.id // empty' >> "$tmp_ids" 2>/dev/null || true
            done < <(echo "$commits_json" | jq -c '.value[]?')
            
            sort -u "$tmp_ids" | grep -E '^[0-9]+$' || true
            rm -f "$tmp_ids"
          }


          # Link work items to PR via WIT ArtifactLink (PR PATCH workItemRefs is ignored on on-prem ADO)
          patch_pr_work_item_refs() {
            local project_api_url="$1"
            local repo_id="$2"
            local pr_id="$3"
            local ids_csv="$4"
            local repo_id_clean
            local pr_id_clean
            local pr_url
            local pr_json
            local pr_artifact_id
            local project_id
            local wi_id
            local wi_json
            local wi_patch_url
            local patch_body
            local linked_count=0
            
            [ -z "$ids_csv" ] && return 0
            
            repo_id_clean=$(clean_repo_id "$repo_id")
            pr_id_clean=$(echo "$pr_id" | tr -d '\n\r ')
            pr_url="${project_api_url}/git/repositories/${repo_id_clean}/pullrequests/${pr_id_clean}?api-version=7.0"
            
            pr_json=$(call_api "$pr_url") || {
              echo "  ⚠️ Failed to load PR $pr_id_clean for work item linking"
              return 1
            }
            
            pr_artifact_id=$(echo "$pr_json" | jq -r '.artifactId // empty')
            if [ -z "$pr_artifact_id" ]; then
              project_id=$(echo "$pr_json" | jq -r '.repository.project.id // empty')
              if [ -n "$project_id" ]; then
                pr_artifact_id="vstfs:///Git/PullRequestId/${project_id}%2f${repo_id_clean}%2f${pr_id_clean}"
              fi
            fi
            
            if [ -z "$pr_artifact_id" ]; then
              echo "  ⚠️ Could not resolve PR artifactId for work item linking"
              return 1
            fi
            
            echo "  📎 Linking work items to PR $pr_id_clean via ArtifactLink: $(echo "$ids_csv" | tr '\n' ' ')"
            echo "  🔗 PR artifact: $pr_artifact_id" >&2
            
            while IFS= read -r wi_id; do
              [ -z "$wi_id" ] && continue
              
              wi_json=$(call_api "${project_api_url}/wit/workitems/${wi_id}?api-version=7.0&\$expand=Relations") || {
                echo "  ⚠️ Could not load work item #$wi_id — skipping"
                continue
              }
              
              if [ "$(echo "$wi_json" | jq -r --arg url "$pr_artifact_id" '[.relations[]? | select(.url == $url)] | length')" -gt 0 ]; then
                echo "  ℹ️ Work item #$wi_id already linked to PR"
                continue
              fi
              
              patch_body=$(jq -n --arg url "$pr_artifact_id" \
                '[{ "op": "add", "path": "/relations/-", "value": { "rel": "ArtifactLink", "url": $url, "attributes": { "name": "Pull Request" } } }]')
              wi_patch_url="${project_api_url}/wit/workitems/${wi_id}?api-version=7.0"
              
              if call_api "$wi_patch_url" "PATCH" "$patch_body" "application/json-patch+json" > /dev/null; then
                echo "  ✅ Linked work item #$wi_id to PR"
                linked_count=$((linked_count + 1))
              else
                echo "  ⚠️ Failed to link work item #$wi_id (check PAT: Work Items Read & Write)"
              fi
            done < <(echo "$ids_csv" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -E '^[0-9]+$' | sort -u)
            
            if [ "$linked_count" -gt 0 ]; then
              echo "  ✅ Linked $linked_count work item(s) to PR"
            else
              echo "  ℹ️ No new work item links added to PR"
            fi
          }


          append_work_item_ids() {
            local global_file="$1"
            local ids="$2"
            while IFS= read -r id; do
              [ -n "$id" ] && echo "$id" >> "$global_file"
            done <<< "$ids"
          }

          # Function to check if a branch exists using Git (more reliable than REST API)
          check_branch_exists_git() {
            local repo_url="$1"
            local branch_name="$2"
            
            echo "  🔍 Checking branch via Git: $branch_name" >&2
            
            # Use git ls-remote to check if branch exists
            if git ls-remote --heads "$repo_url" "$branch_name" 2>/dev/null | grep -q "refs/heads/$branch_name"; then
              # Extract the commit hash for the branch
              local commit_hash=$(git ls-remote --heads "$repo_url" "$branch_name" 2>/dev/null | awk '{print $1}')
              echo "  ✅ Branch confirmed via Git (Commit: $commit_hash)" >&2
              echo "$commit_hash"
              return 0
            else
              echo "  ❌ Branch not found via Git" >&2
              return 1
            fi
          }
          
          # Git configuration
          git config --global user.email "S_Bot_Azure@sadgan.int"
          git config --global user.name "S_Bot_Azure"
          git config --global http.extraHeader "Authorization: Basic $(echo -n "PAT:$(GIT_PAT)" | base64 -w 0)"
          git config --global http.sslVerify false
          git config --global --add safe.directory '*'
          git config --global core.compression 0
          git config --global http.postBuffer 1048576000
          git config --global pack.threads 1
          git config --global pull.rebase false
          
          SOURCE_BRANCH="$SOURCE_BRANCH"
          TARGET_BRANCH="$TARGET_BRANCH"
          
          # Define all repositories to process
          REPOSITORIES=(
            "SadganShared/_git/1_Configs"
            "SadganShared/_git/2_SharedLibrary"
            "SadganShared/_git/3_ClientLibrary"
            "SadganShared/_git/4_ServerLibrary"
            "SadganErp/_git/Sadgan.Erp.Client.Core"
            "SadganErp/_git/Sadgan.Erp.Panel"
            "SadganErp/_git/SadganErpApi"
          )
          
          # Base URL for Git operations
          GIT_BASE_URL="http://$(GIT_PAT)@azure.sadgan.int/WebApp"
          
          echo "========================================="
          echo "Starting multi-repo PR creation for $SOURCE_BRANCH → $TARGET_BRANCH"
          echo "Total repositories: ${#REPOSITORIES[@]}"
          echo "========================================="
          
          # Initialize associative arrays
          declare -A REPO_IDS
          declare -A PR_IDS
          declare -A MERGE_STATUSES
          declare -A SOURCE_COMMITS
          declare -A REPO_SKIPPED
          declare -A SOURCE_COMMIT_HASHES
          declare -A TARGET_COMMIT_HASHES
          declare -A REPO_WI_IDS_MAP
          GLOBAL_WI_FILE=$(mktemp)
          touch "$GLOBAL_WI_FILE"

          # Optional manual IDs — skip when parameter is empty/whitespace
          MANUAL_WORK_ITEM_IDS="$(echo "${MANUAL_WORK_ITEM_IDS:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "$MANUAL_WORK_ITEM_IDS" ]; then
            echo "$MANUAL_WORK_ITEM_IDS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | grep -E '^[0-9]+$' >> "$GLOBAL_WI_FILE" || true
            echo "Manual work item IDs: $MANUAL_WORK_ITEM_IDS"
          else
            echo "No manual WORK_ITEM_IDS — using PR commit extraction only"
          fi
          
          # First pass: Check all repos for conflicts before any merges
          echo ""
          echo "========================================="
          echo "PHASE 1: PRE-VALIDATION - Checking all repos for merge conflicts"
          echo "========================================="
          
          for REPO_NAME in "${REPOSITORIES[@]}"; do
            echo ""
            echo "📦 Processing repository: $REPO_NAME"
            echo "-----------------------------------------"
            
            # Extract project name and simple repo name from the path
            PROJECT_NAME=$(echo "$REPO_NAME" | cut -d'/' -f1)
            SIMPLE_REPO_NAME=$(basename "$REPO_NAME")
            
            echo "  📁 Project: $PROJECT_NAME"
            echo "  📂 Repo: $SIMPLE_REPO_NAME"
            
            # Construct project-specific API URL
            PROJECT_API_URL="$GIT_BASE_URL/$PROJECT_NAME/_apis"
            echo "========  PROJECT_API_URL: $PROJECT_API_URL"
            
            # Get repository ID from REST API using project-specific URL
            echo "  🔍 Looking up repository ID for: $SIMPLE_REPO_NAME"
            REPOS_URL="$PROJECT_API_URL/git/repositories?api-version=7.0&_=$(date +%s%N)"
            REPOS_RESPONSE=$(call_api "$REPOS_URL") || {
              echo "  ❌ Failed to get repositories list for project $PROJECT_NAME"
              exit 1
            }
            
            # Extract and clean repository ID
            RAW_REPO_ID=$(echo "$REPOS_RESPONSE" | jq -r --arg name "$SIMPLE_REPO_NAME" '.value[] | select(.name==$name) | .id')
            REPO_ID=$(clean_repo_id "$RAW_REPO_ID")
            
            if [ -z "$REPO_ID" ] || [ "$REPO_ID" = "null" ]; then
              echo "  ❌ Could not find repository: $SIMPLE_REPO_NAME in project $PROJECT_NAME"
              echo "  Available repositories in project $PROJECT_NAME:"
              echo "$REPOS_RESPONSE" | jq -r '.value[].name' | sed 's/^/    - /'
              exit 1
            fi
            echo "  ✅ Found repository ID: $REPO_ID"
            REPO_IDS["$REPO_NAME"]="$REPO_ID"
            
            # Construct Git URL for this repository
            REPO_GIT_URL="$GIT_BASE_URL/$REPO_NAME"
            echo "======== REPO_GIT_URL: $REPO_GIT_URL"
            
            # Validate source branch using Git
            echo "  🔍 Validating source branch via Git: $SOURCE_BRANCH"
            SOURCE_COMMIT=$(check_branch_exists_git "$REPO_GIT_URL" "$SOURCE_BRANCH") || {
              echo "  ⚠️ Source branch '$SOURCE_BRANCH' not found via Git"
              echo "  ⚠️ Skipping this repository for PR creation"
              REPO_SKIPPED["$REPO_NAME"]="source_branch_missing"
              continue
            }
            SOURCE_COMMIT_HASHES["$REPO_NAME"]="$SOURCE_COMMIT"
            echo "  ✅ Source branch commit: $SOURCE_COMMIT"
            
            # Validate target branch using Git
            echo "  🔍 Validating target branch via Git: $TARGET_BRANCH"
            TARGET_COMMIT=$(check_branch_exists_git "$REPO_GIT_URL" "$TARGET_BRANCH") || {
              echo "  ⚠️ Target branch '$TARGET_BRANCH' not found via Git"
              echo "  ⚠️ Skipping this repository for PR creation"
              REPO_SKIPPED["$REPO_NAME"]="target_branch_missing"
              continue
            }
            TARGET_COMMIT_HASHES["$REPO_NAME"]="$TARGET_COMMIT"
            echo "  ✅ Target branch commit: $TARGET_COMMIT"
            
            echo "  ✅ Both branches validated successfully via Git"
            
            # Check for existing PR using project-specific API URL
            echo "  🔍 Checking for existing PRs..."
            PR_SEARCH_URL="$PROJECT_API_URL/git/repositories/$REPO_ID/pullrequests?searchCriteria.status=active&api-version=7.0&_=$(date +%s%N)"
            PR_SEARCH=$(call_api "$PR_SEARCH_URL") || {
              echo "  ❌ Failed to search PRs"
              exit 1
            }
            
            EXISTING_PR=$(echo "$PR_SEARCH" | jq -r --arg source "refs/heads/$SOURCE_BRANCH" --arg target "refs/heads/$TARGET_BRANCH" \
              '.value[] | select(.sourceRefName==$source and .targetRefName==$target) | .pullRequestId')
            
            if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
              echo "  ⚠️ Active PR exists: $EXISTING_PR"
              PR_IDS["$REPO_NAME"]="$EXISTING_PR"
            else
              # Create new PR with retry logic using project-specific API URL
              echo "  🆕 Creating new PR..."
              PR_URL="$PROJECT_API_URL/git/repositories/$REPO_ID/pullrequests?api-version=7.0"
              PR_TITLE="BOT auto pr from $SOURCE_BRANCH to $TARGET_BRANCH"
              PR_BODY="{
                \"sourceRefName\": \"refs/heads/$SOURCE_BRANCH\",
                \"targetRefName\": \"refs/heads/$TARGET_BRANCH\",
                \"title\": \"$PR_TITLE\"
              }"
              
              # Retry loop for PR creation
              MAX_PR_RETRIES=10
              PR_RETRY=0
              PR_CREATED=false
              
              while [ $PR_RETRY -lt $MAX_PR_RETRIES ] && [ "$PR_CREATED" = false ]; do
                if [ $PR_RETRY -gt 0 ]; then
                  echo "  ⚠️ Retry $PR_RETRY creating PR (waiting 5 seconds)..."
                  sleep 5
                fi
                
                # Attempt PR creation via REST API with cache-busting headers
                PR_RESPONSE=$(curl -s -u ":$GIT_PAT" \
                  -H "Content-Type: application/json" \
                  -H "Cache-Control: no-cache, no-store" \
                  -H "Pragma: no-cache" \
                  -H "Expires: 0" \
                  -X POST \
                  -d "$PR_BODY" \
                  "$PR_URL" 2>/dev/null || echo '{"error":"connection failed"}')
                
                # Check if PR creation succeeded
                if echo "$PR_RESPONSE" | jq -e '.pullRequestId' > /dev/null 2>&1; then
                  PR_ID=$(echo "$PR_RESPONSE" | jq -r '.pullRequestId')
                  echo "  ✅ PR created successfully with ID: $PR_ID"
                  PR_IDS["$REPO_NAME"]="$PR_ID"
                  PR_CREATED=true
                elif echo "$PR_RESPONSE" | grep -q "TF401398"; then
                  # Branch not found error
                  echo "  ⚠️ REST API still doesn't see the branch (attempt $((PR_RETRY+1))/$MAX_PR_RETRIES)"
                  PR_RETRY=$((PR_RETRY + 1))
                else
                  echo "  ❌ Failed to create PR - unexpected error"
                  echo "  Response: $PR_RESPONSE"
                  PR_RETRY=$((PR_RETRY + 1))
                fi
              done
              
              if [ "$PR_CREATED" = false ]; then
                echo "  ❌ Could not create PR after $MAX_PR_RETRIES attempts"
                echo "  ⚠️ Skipping this repository"
                REPO_SKIPPED["$REPO_NAME"]="pr_creation_failed"
                continue
              fi
            fi

            # Extract work item IDs from PR commits (PATCH in Phase 3 before completion — completed PRs are read-only)
            EXTRACTED_WI_IDS=$(extract_work_item_ids_from_pr "$PROJECT_API_URL" "$REPO_ID" "${PR_IDS["$REPO_NAME"]}")
            if [ -n "$EXTRACTED_WI_IDS" ]; then
              echo "  📝 Work item IDs from PR commits:"
              echo "$EXTRACTED_WI_IDS" | sed 's/^/    - /'
              REPO_WI_IDS_MAP["$REPO_NAME"]="$(echo "$EXTRACTED_WI_IDS" | paste -sd, -)"
              append_work_item_ids "$GLOBAL_WI_FILE" "$EXTRACTED_WI_IDS"
            else
              echo "  ℹ️ No work item IDs found in PR commits for $REPO_NAME"
            fi

            
            # Quick check for immediate conflicts using project-specific API URL
            echo "  🔍 Checking initial merge status..."
            PR_URL="$PROJECT_API_URL/git/repositories/$REPO_ID/pullrequests/${PR_IDS["$REPO_NAME"]}?api-version=7.0&_=$(date +%s%N)"
            PR_DETAILS=$(call_api "$PR_URL") || {
              echo "  ❌ Failed to get PR details"
              exit 1
            }
            
            MERGE_STATUS=$(echo "$PR_DETAILS" | jq -r '.mergeStatus')
            MERGE_STATUSES["$REPO_NAME"]="$MERGE_STATUS"
            
            if [ "$MERGE_STATUS" = "conflicts" ]; then
              echo "  ❌ IMMEDIATE CONFLICT detected in $REPO_NAME"
              echo "  Aborting promotion - all repos must be conflict-free before proceeding"
              exit 1
            elif [ "$MERGE_STATUS" = "failure" ]; then
              echo "  ❌ MERGE FAILURE detected in $REPO_NAME"
              exit 1
            fi
            
            echo "  ✅ Initial merge status: $MERGE_STATUS"
          done
          
          # Filter out skipped repositories
          ACTIVE_REPOS=()
          for REPO_NAME in "${REPOSITORIES[@]}"; do
            if [ -z "${REPO_SKIPPED["$REPO_NAME"]}" ]; then
              ACTIVE_REPOS+=("$REPO_NAME")
            else
              echo ""
              echo "⚠️ Skipping $REPO_NAME - Reason: ${REPO_SKIPPED["$REPO_NAME"]}"
            fi
          done
          
          if [ ${#ACTIVE_REPOS[@]} -eq 0 ]; then
            echo ""
            echo "❌ No active repositories to process. All were skipped."
            exit 0
          fi
          
          echo ""
          echo "✅ Active repositories to process: ${#ACTIVE_REPOS[@]}"
          
          # Second pass: Wait for all merges to be ready
          echo ""
          echo "========================================="
          echo "PHASE 2: WAITING FOR ALL MERGES TO BE READY"
          echo "========================================="
          
          MAX_ATTEMPTS=60
          ATTEMPT=0
          ALL_READY=false
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ "$ALL_READY" = false ]; do
            ALL_READY=true
            ATTEMPT=$((ATTEMPT + 1))
            
            echo ""
            echo "--- Check attempt $ATTEMPT/$MAX_ATTEMPTS ---"
            
            for REPO_NAME in "${ACTIVE_REPOS[@]}"; do
              REPO_ID="${REPO_IDS["$REPO_NAME"]}"
              PR_ID="${PR_IDS["$REPO_NAME"]}"
              PROJECT_NAME=$(echo "$REPO_NAME" | cut -d'/' -f1)
              PROJECT_API_URL="$GIT_BASE_URL/$PROJECT_NAME/_apis"
              
              # Clean IDs before constructing URL
              REPO_ID_CLEAN=$(clean_repo_id "$REPO_ID")
              PR_ID_CLEAN=$(echo "$PR_ID" | tr -d '\n\r ')
              
              PR_URL="$PROJECT_API_URL/git/repositories/$REPO_ID_CLEAN/pullrequests/$PR_ID_CLEAN?api-version=7.0&_=$(date +%s%N)"
              PR_DETAILS=$(call_api "$PR_URL") || {
                echo "  ⚠️ Failed to get PR details for $REPO_NAME, will retry..."
                ALL_READY=false
                continue
              }
              
              MERGE_STATUS=$(echo "$PR_DETAILS" | jq -r '.mergeStatus')
              
              printf "  %-40s: %s\n" "$REPO_NAME" "$MERGE_STATUS"
              
              if [ "$MERGE_STATUS" = "conflicts" ]; then
                echo "  ❌ Merge conflict detected in $REPO_NAME"
                exit 1
              elif [ "$MERGE_STATUS" = "failure" ]; then
                echo "  ❌ Merge failure in $REPO_NAME"
                exit 1
              elif [ "$MERGE_STATUS" != "succeeded" ]; then
                ALL_READY=false
                MERGE_STATUSES["$REPO_NAME"]="$MERGE_STATUS"
              else
                MERGE_STATUSES["$REPO_NAME"]="$MERGE_STATUS"
                # Store source commit for later use
                if [ -z "${SOURCE_COMMITS[$REPO_NAME]}" ]; then
                  SOURCE_COMMITS["$REPO_NAME"]=$(echo "$PR_DETAILS" | jq -r '.lastMergeSourceCommit.commitId')
                fi
              fi
            done
            
            if [ "$ALL_READY" = false ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Not all merges ready yet. Waiting 10 seconds..."
              sleep 10
            fi
          done
          
          if [ "$ALL_READY" = false ]; then
            echo "❌ Timeout waiting for merges to be ready"
            echo "Current statuses:"
            for REPO_NAME in "${ACTIVE_REPOS[@]}"; do
              echo "  $REPO_NAME: ${MERGE_STATUSES["$REPO_NAME"]}"
            done
            exit 1
          fi
          
          echo ""
          echo "✅ ALL ACTIVE REPOSITORIES READY FOR MERGE"
          
          # Third pass: Approve and complete PRs sequentially
          echo ""
          echo "========================================="
          echo "PHASE 3: SEQUENTIAL APPROVAL AND COMPLETION"
          echo "========================================="
          
          COMPLETED_COUNT=0
          for REPO_NAME in "${ACTIVE_REPOS[@]}"; do
            COMPLETED_COUNT=$((COMPLETED_COUNT + 1))
            echo ""
            echo "[$COMPLETED_COUNT/${#ACTIVE_REPOS[@]}] Processing repository: $REPO_NAME"
            echo "-----------------------------------------"
            
            REPO_ID="${REPO_IDS["$REPO_NAME"]}"
            PR_ID="${PR_IDS["$REPO_NAME"]}"
            SOURCE_COMMIT="${SOURCE_COMMITS["$REPO_NAME"]}"
            PROJECT_NAME=$(echo "$REPO_NAME" | cut -d'/' -f1)
            PROJECT_API_URL="$GIT_BASE_URL/$PROJECT_NAME/_apis"
            
            # Clean IDs
            REPO_ID_CLEAN=$(clean_repo_id "$REPO_ID")
            PR_ID_CLEAN=$(echo "$PR_ID" | tr -d '\n\r ')
            
            # Get current user identity
            echo "  🔍 Getting PR details for approval..."
            PR_URL="$PROJECT_API_URL/git/repositories/$REPO_ID_CLEAN/pullrequests/$PR_ID_CLEAN?api-version=7.0&_=$(date +%s%N)"
            PR_DETAILS=$(call_api "$PR_URL") || {
              echo "  ❌ Failed to get PR details"
              exit 1
            }
            
            CURRENT_USER_ID=$(echo "$PR_DETAILS" | jq -r '.createdBy.id')
            
            # Add as reviewer and vote +10
            echo "  👍 Approving PR $PR_ID..."
            REVIEWER_URL="$PROJECT_API_URL/git/repositories/$REPO_ID_CLEAN/pullrequests/$PR_ID_CLEAN/reviewers/$CURRENT_USER_ID?api-version=7.0"
            REVIEWER_BODY="{\"vote\": 10}"
            
            call_api "$REVIEWER_URL" "PUT" "$REVIEWER_BODY" > /dev/null || {
              echo "  ⚠️ Failed to record vote, but continuing..."
            }
            
            echo "  ✅ PR approved"

            # Link work items while PR is still active (completed PRs cannot be edited — TF401181)
            if [ -n "${REPO_WI_IDS_MAP[$REPO_NAME]:-}" ]; then
              echo "  🔗 Linking work items to PR before completion..."
              patch_pr_work_item_refs "$PROJECT_API_URL" "$REPO_ID" "$PR_ID" "${REPO_WI_IDS_MAP[$REPO_NAME]}" || true
            fi

            
            # Complete the PR with bypass
            echo "  🔄 Completing PR $PR_ID..."
            COMPLETE_URL="$PROJECT_API_URL/git/repositories/$REPO_ID_CLEAN/pullrequests/$PR_ID_CLEAN?api-version=7.0"
            COMPLETE_BODY="{
              \"status\": \"completed\",
              \"lastMergeSourceCommit\": {
                \"commitId\": \"$SOURCE_COMMIT\"
              },
              \"completionOptions\": {
                \"bypassPolicy\": true,
                \"bypassReason\": \"Automated pr - sequential merge\",
                \"mergeStrategy\": \"rebaseAndFastForward\",
                \"deleteSourceBranch\": false
              }
            }"
            
            COMPLETE_RESPONSE=$(call_api "$COMPLETE_URL" "PATCH" "$COMPLETE_BODY") || {
              echo "  ❌ Failed to complete PR for $REPO_NAME"
              exit 1
            }
            
            # Check completion
            HAS_COMPLETION_QUEUE=$(echo "$COMPLETE_RESPONSE" | jq -r 'has("completionQueueTime")')
            HAS_CLOSED_BY=$(echo "$COMPLETE_RESPONSE" | jq -r 'has("closedBy")')
            CURRENT_STATUS=$(echo "$COMPLETE_RESPONSE" | jq -r '.status // "unknown"')
            
            if [ "$HAS_COMPLETION_QUEUE" = "true" ] || [ "$HAS_CLOSED_BY" = "true" ] || [ "$CURRENT_STATUS" = "completed" ]; then
              echo "  ✅ PR $PR_ID completed successfully"
              
              # Wait for merge to fully complete before next repo
              echo "  ⏱️ Waiting 5 seconds for merge to settle..."
              sleep 5
              
              # Verify final status
              FINAL_CHECK=$(call_api "$COMPLETE_URL") || true
              FINAL_STATUS=$(echo "$FINAL_CHECK" | jq -r '.status // "unknown"')
              echo "  📊 Final PR status: $FINAL_STATUS"
            else
              echo "  ❌ Failed to complete PR for $REPO_NAME"
              echo "  Response: $COMPLETE_RESPONSE"
              exit 1
            fi
          done
          
          echo ""
          echo "========================================="
          echo "✅ ALL $COMPLETED_COUNT ACTIVE REPOSITORIES PROCESSED SUCCESSFULLY"
          if [ ${#REPOSITORIES[@]} -ne ${#ACTIVE_REPOS[@]} ]; then
            echo "⚠️ Skipped repositories: $(( ${#REPOSITORIES[@]} - ${#ACTIVE_REPOS[@]} ))"
          fi
          echo "========================================="

          # Dedupe all collected work item IDs across repos
          DEDUPED_WORK_ITEM_IDS=$(sort -u "$GLOBAL_WI_FILE" | grep -E '^[0-9]+$' | paste -sd, - || true)
          rm -f "$GLOBAL_WI_FILE"
          
          echo ""
          echo "========================================="
          echo "WORK ITEMS SUMMARY"
          echo "========================================="
          if [ -n "$DEDUPED_WORK_ITEM_IDS" ]; then
            echo "Deduped work item IDs: $DEDUPED_WORK_ITEM_IDS"
            echo "$DEDUPED_WORK_ITEM_IDS" | tr ',' '\n' | sed 's/^[[:space:]]*//' | sed 's/^/  - /'
            echo "##vso[task.setvariable variable=WORK_ITEM_IDS;isOutput=true]$DEDUPED_WORK_ITEM_IDS"
            echo "##vso[task.setvariable variable=DEDUPED_WORK_ITEM_IDS;isOutput=true]$DEDUPED_WORK_ITEM_IDS"
          else
            echo "No work item IDs collected from PR commits"
            echo "##vso[task.setvariable variable=WORK_ITEM_IDS;isOutput=true]"
            echo "##vso[task.setvariable variable=DEDUPED_WORK_ITEM_IDS;isOutput=true]"
          fi
          
          # Queue WorkItem follow-up pipeline in CICD repo (SadganErp project)
          if [ "$TRIGGER_WI_FOLLOWUP" = "YES" ] && [ -n "$DEDUPED_WORK_ITEM_IDS" ] && [ -n "$WI_FOLLOWUP_PIPELINE_ID" ]; then
            echo ""
            echo "🚀 Queueing WorkItem follow-up pipeline (ID: $WI_FOLLOWUP_PIPELINE_ID)..."
            QUEUE_URL="http://azure.sadgan.int/WebApp/SadganErp/_apis/pipelines/${WI_FOLLOWUP_PIPELINE_ID}/runs?api-version=7.0"
            

            QUEUE_BODY=$(jq -n \
              --arg ids "$DEDUPED_WORK_ITEM_IDS" \
              --arg target "$TARGET_BRANCH" \
              --arg source "$SOURCE_BRANCH" \
              --arg buildId "$BUILD_ID" \
              --arg buildNumber "$BUILD_NUMBER" \
              '{ 
                resources: { repositories: { self: { refName: "refs/heads/cicd" } } },
                templateParameters: { 
                  WORK_ITEM_IDS: $ids, 
                  TARGET_BRANCH: $target, 
                  SOURCE_BRANCH: $source, 
                  PROMOTION_BUILD_ID: $buildId, 
                  PROMOTION_BUILD_NUMBER: $buildNumber 
                } 
              }')  
            
            QUEUE_RESPONSE=$(call_api "$QUEUE_URL" "POST" "$QUEUE_BODY") || {
              echo "⚠️ Failed to queue WorkItem follow-up pipeline"
            }

            if [ -n "$QUEUE_RESPONSE" ]; then
              FOLLOWUP_RUN_ID=$(echo "$QUEUE_RESPONSE" | jq -r '.id // empty')
              FOLLOWUP_RUN_URL=$(echo "$QUEUE_RESPONSE" | jq -r '._links.web.href // empty')
              echo "✅ Follow-up pipeline queued: run ID ${FOLLOWUP_RUN_ID}"
              [ -n "$FOLLOWUP_RUN_URL" ] && echo "   $FOLLOWUP_RUN_URL"
            fi
          elif [ "$TRIGGER_WI_FOLLOWUP" = "YES" ] && [ -z "$WI_FOLLOWUP_PIPELINE_ID" ]; then
            echo "⚠️ TRIGGER_WI_FOLLOWUP=YES but WI_FOLLOWUP_PIPELINE_ID is empty — set pipeline ID parameter after creating WorkItem_FollowUp.yml in Azure DevOps"
          fi
          
    # Publish PR completion status for next stages
    # - task: PublishPipelineArtifact@1
    #   inputs:
    #     targetPath: '$(Build.ArtifactStagingDirectory)'
    #     artifactName: 'pr-status'




# Stage 1b: Alpha hotfix — collect work items since last release tag (no PR)
- stage: Hotfix_WI_Collection
  displayName: 'Alpha Hotfix — Work Item Collection'
  dependsOn: INIT
  condition: and(succeeded(), eq(variables['isCreatePR'], 'False'), eq(variables['isBranchALPHA'], 'True'))
  variables:
    SOURCE_BRANCH: $[ stageDependencies.INIT.InitJob.outputs['init.SOURCE_BRANCH'] ]
    TARGET_BRANCH: $[ stageDependencies.INIT.InitJob.outputs['init.TARGET_BRANCH'] ]
  jobs:
  - job: CollectHotfixWorkItems
    displayName: 'Extract work items since last v*-*.* tag on alpha'
    steps:
    - checkout: none

    - task: Bash@3
      name: hotfix_wi
      displayName: 'Collect work items from commits after last release tag'
      env:
        GIT_PAT: $(GIT_PAT)
        SOURCE_BRANCH: $(SOURCE_BRANCH)
        TARGET_BRANCH: $(TARGET_BRANCH)
        BUILD_ID: $(Build.BuildId)
        BUILD_NUMBER: $(Build.BuildNumber)
        MANUAL_WORK_ITEM_IDS: ${{ coalesce(parameters.WORK_ITEM_IDS, '') }}
        TRIGGER_WI_FOLLOWUP: ${{ parameters.TRIGGER_WI_FOLLOWUP }}
        WI_FOLLOWUP_PIPELINE_ID: ${{ parameters.WI_FOLLOWUP_PIPELINE_ID }}
      inputs:
        targetType: 'inline'
        script: |
          set -e

          clean_repo_id() {
            local id="$1"
            local cleaned
            cleaned=$(echo "$id" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            if [ -z "$cleaned" ]; then
              echo "$id" | tr -d '\n\r ' | cut -c1-36
            else
              echo "$cleaned"
            fi
          }

          call_api() {
            local url="$1"
            local method="${2:-GET}"
            local data="${3:-}"
            local content_type="${4:-application/json}"
            local temp_file http_code
            temp_file=$(mktemp)
            url=$(echo "$url" | tr -d '\n\r ')

            if [ "$method" = "GET" ]; then
              http_code=$(curl -s -w "%{http_code}" -u ":$GIT_PAT" \
                -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
                -o "$temp_file" "$url")
            else
              http_code=$(curl -sS -w "%{http_code}" -u ":$GIT_PAT" \
                -H "Content-Type: ${content_type}" \
                -H "Cache-Control: no-cache" -H "Pragma: no-cache" \
                -X "$method" -d "$data" -o "$temp_file" "$url")
            fi

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "❌ API call failed with HTTP $http_code" >&2
              [ -s "$temp_file" ] && cat "$temp_file" >&2
              rm -f "$temp_file"
              return 1
            fi

            if [ -s "$temp_file" ] && ! jq empty "$temp_file" 2>/dev/null; then
              echo "❌ Invalid JSON response" >&2
              cat "$temp_file" >&2
              rm -f "$temp_file"
              return 1
            fi

            cat "$temp_file"
            rm -f "$temp_file"
            return 0
          }

          append_work_item_ids() {
            local global_file="$1"
            local ids="$2"
            while IFS= read -r id; do
              [ -n "$id" ] && echo "$id" >> "$global_file"
            done <<< "$ids"
          }

          # Commits on TARGET_BRANCH after the latest tag matching vX.Y.Z-<branch>.N
          extract_work_item_ids_since_release_tag() {
            local project_api_url="$1"
            local repo_id="$2"
            local repo_git_url="$3"
            local branch="$4"
            local tmp_ids repo_id_clean tag_glob tag_regex latest_tag base_commit
            local work_dir commit_id subject body full_comment wi_url wi_json

            repo_id_clean=$(clean_repo_id "$repo_id")
            tmp_ids=$(mktemp)
            tag_glob="v*-${branch}.*"
            tag_regex="^v[0-9]+\\.[0-9]+\\.[0-9]+-${branch}\\.[0-9]+$"

            work_dir=$(mktemp -d)
            echo "  📥 Cloning ${branch} for tag scan..." >&2
            if ! git clone --quiet --branch "$branch" --tags "$repo_git_url" "$work_dir/repo" 2>/dev/null; then
              echo "  ⚠️ Could not clone $branch — skipping repo" >&2
              rm -rf "$work_dir" "$tmp_ids"
              return 0
            fi

            cd "$work_dir/repo"
            latest_tag=$(git tag -l "$tag_glob" | grep -E "$tag_regex" | sort -V | tail -1)
            if [ -z "$latest_tag" ]; then
              echo "  ⚠️ No release tag matching ${tag_glob} (pattern vX.Y.Z-${branch}.N) — skipping repo" >&2
              cd - >/dev/null
              rm -rf "$work_dir"
              rm -f "$tmp_ids"
              return 0
            fi

            base_commit=$(git rev-parse "${latest_tag}^{commit}")
            echo "  🏷️ Latest release tag: $latest_tag ($base_commit)" >&2

            while IFS= read -r commit_id; do
              [ -z "$commit_id" ] && continue
              subject=$(git log -1 --format=%s "$commit_id")
              body=$(git log -1 --format=%b "$commit_id")
              full_comment="${subject}"$'\n'"${body}"

              if [[ "$subject" == "Merged PR"* ]] || [[ "$subject" == "Merge pull request"* ]] || [[ "$subject" == "Merge branch"* ]]; then
                echo "  ⏭️ Skipping merge commit: $(echo "$subject" | cut -c1-80)" >&2
                continue
              fi

              echo "$full_comment" | grep -oE '(AB#|#)[0-9]+' | sed 's/AB#//;s/#//' >> "$tmp_ids" 2>/dev/null || true

              wi_url="${project_api_url}/git/repositories/${repo_id_clean}/commits/${commit_id}/workItems?api-version=7.0"
              wi_json=$(call_api "$wi_url") || continue
              echo "$wi_json" | jq -r '.value[]?.id // empty' >> "$tmp_ids" 2>/dev/null || true
            done < <(git rev-list "${base_commit}..HEAD")

            cd - >/dev/null
            rm -rf "$work_dir"
            sort -u "$tmp_ids" | grep -E '^[0-9]+$' || true
            rm -f "$tmp_ids"
          }

          git config --global user.email "S_Bot_Azure@sadgan.int"
          git config --global user.name "S_Bot_Azure"
          git config --global http.extraHeader "Authorization: Basic $(echo -n "PAT:$(GIT_PAT)" | base64 -w 0)"
          git config --global http.sslVerify false
          git config --global --add safe.directory '*'

          GIT_BASE_URL="http://$(GIT_PAT)@azure.sadgan.int/WebApp"
          REPOSITORIES=(
            "SadganShared/_git/1_Configs"
            "SadganShared/_git/2_SharedLibrary"
            "SadganShared/_git/3_ClientLibrary"
            "SadganShared/_git/4_ServerLibrary"
            "SadganErp/_git/Sadgan.Erp.Client.Core"
            "SadganErp/_git/Sadgan.Erp.Panel"
            "SadganErp/_git/SadganErpApi"
          )

          GLOBAL_WI_FILE=$(mktemp)
          touch "$GLOBAL_WI_FILE"

          MANUAL_WORK_ITEM_IDS="$(echo "${MANUAL_WORK_ITEM_IDS:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -n "$MANUAL_WORK_ITEM_IDS" ]; then
            echo "$MANUAL_WORK_ITEM_IDS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | grep -E '^[0-9]+$' >> "$GLOBAL_WI_FILE" || true
            echo "Manual work item IDs: $MANUAL_WORK_ITEM_IDS"
          fi

          echo "========================================="
          echo "Alpha hotfix WI collection on $TARGET_BRANCH (since last v*-${TARGET_BRANCH}.* tag)"
          echo "========================================="

          for REPO_NAME in "${REPOSITORIES[@]}"; do
            echo ""
            echo "📦 $REPO_NAME"
            PROJECT_NAME=$(echo "$REPO_NAME" | cut -d'/' -f1)
            SIMPLE_REPO_NAME=$(basename "$REPO_NAME")
            PROJECT_API_URL="$GIT_BASE_URL/$PROJECT_NAME/_apis"
            REPO_GIT_URL="$GIT_BASE_URL/$REPO_NAME"

            REPOS_URL="$PROJECT_API_URL/git/repositories?api-version=7.0&_=$(date +%s%N)"
            REPOS_RESPONSE=$(call_api "$REPOS_URL") || {
              echo "  ⚠️ Failed to list repositories in $PROJECT_NAME — skipping"
              continue
            }

            RAW_REPO_ID=$(echo "$REPOS_RESPONSE" | jq -r --arg name "$SIMPLE_REPO_NAME" '.value[] | select(.name==$name) | .id')
            REPO_ID=$(clean_repo_id "$RAW_REPO_ID")
            if [ -z "$REPO_ID" ] || [ "$REPO_ID" = "null" ]; then
              echo "  ⚠️ Repository not found: $SIMPLE_REPO_NAME — skipping"
              continue
            fi

            EXTRACTED_WI_IDS=$(extract_work_item_ids_since_release_tag \
              "$PROJECT_API_URL" "$REPO_ID" "$REPO_GIT_URL" "$TARGET_BRANCH")
            if [ -n "$EXTRACTED_WI_IDS" ]; then
              echo "  📝 Work item IDs from commits after release tag:"
              echo "$EXTRACTED_WI_IDS" | sed 's/^/    - /'
              append_work_item_ids "$GLOBAL_WI_FILE" "$EXTRACTED_WI_IDS"
            else
              echo "  ℹ️ No work item IDs found for $REPO_NAME"
            fi
          done

          DEDUPED_WORK_ITEM_IDS=$(sort -u "$GLOBAL_WI_FILE" | grep -E '^[0-9]+$' | paste -sd, - || true)
          rm -f "$GLOBAL_WI_FILE"

          echo ""
          echo "========================================="
          echo "HOTFIX WORK ITEMS SUMMARY"
          echo "========================================="
          if [ -n "$DEDUPED_WORK_ITEM_IDS" ]; then
            echo "Deduped work item IDs: $DEDUPED_WORK_ITEM_IDS"
            echo "##vso[task.setvariable variable=WORK_ITEM_IDS;isOutput=true]$DEDUPED_WORK_ITEM_IDS"
            echo "##vso[task.setvariable variable=DEDUPED_WORK_ITEM_IDS;isOutput=true]$DEDUPED_WORK_ITEM_IDS"
          else
            echo "No work item IDs collected from hotfix commits"
            echo "##vso[task.setvariable variable=WORK_ITEM_IDS;isOutput=true]"
            echo "##vso[task.setvariable variable=DEDUPED_WORK_ITEM_IDS;isOutput=true]"
          fi

          if [ "$TRIGGER_WI_FOLLOWUP" = "YES" ] && [ -n "$DEDUPED_WORK_ITEM_IDS" ] && [ -n "$WI_FOLLOWUP_PIPELINE_ID" ]; then
            echo ""
            echo "🚀 Queueing WorkItem follow-up pipeline (ID: $WI_FOLLOWUP_PIPELINE_ID)..."
            QUEUE_URL="http://azure.sadgan.int/WebApp/SadganErp/_apis/pipelines/${WI_FOLLOWUP_PIPELINE_ID}/runs?api-version=7.0"
            QUEUE_BODY=$(jq -n \
              --arg ids "$DEDUPED_WORK_ITEM_IDS" \
              --arg target "$TARGET_BRANCH" \
              --arg source "$SOURCE_BRANCH" \
              --arg buildId "$BUILD_ID" \
              --arg buildNumber "$BUILD_NUMBER" \
              '{
                resources: { repositories: { self: { refName: "refs/heads/cicd" } } },
                templateParameters: {
                  WORK_ITEM_IDS: $ids,
                  TARGET_BRANCH: $target,
                  SOURCE_BRANCH: $source,
                  PROMOTION_BUILD_ID: $buildId,
                  PROMOTION_BUILD_NUMBER: $buildNumber
                }
              }')
            QUEUE_RESPONSE=$(call_api "$QUEUE_URL" "POST" "$QUEUE_BODY") || {
              echo "⚠️ Failed to queue WorkItem follow-up pipeline"
            }
            if [ -n "$QUEUE_RESPONSE" ]; then
              FOLLOWUP_RUN_ID=$(echo "$QUEUE_RESPONSE" | jq -r '.id // empty')
              FOLLOWUP_RUN_URL=$(echo "$QUEUE_RESPONSE" | jq -r '._links.web.href // empty')
              echo "✅ Follow-up pipeline queued: run ID ${FOLLOWUP_RUN_ID}"
              [ -n "$FOLLOWUP_RUN_URL" ] && echo "   $FOLLOWUP_RUN_URL"
            fi
          fi

