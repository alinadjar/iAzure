        echo ""
        echo "========================================="
        echo "✅ Git tags created successfully"
        echo "========================================="
        echo "Frontend: $(FRONTEND_TAG) -> $(FRONTEND_COMMIT)"
        echo "Backend:  $(BACKEND_TAG) -> $(BACKEND_COMMIT)"
        
      displayName: 'Create and Push Git Tags'
      env:
        GIT_PAT: $(GIT_PAT)


