trigger: none
pool:
  name: 'WEB-1'


parameters:
- name: CREATE_PR
  displayName: "Create PR ?"
  type: string
  default: 'NO'
  values:
    - YES
    - NO
- name: SHOULD_RELEASE
  type: string
  default: 'false'
  values:
    - 'true'
    - 'false'
- name: BRANCH
  type: string
  default: 'dev'
  displayName: "Select Branch"
  values:
    - 'dev'
    - 'devops'
    - 'alpha'
    - 'beta'
    - 'master'



variables:  
  solution: '$(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi/4_Gateway/src/SadganErp.Api.Gateway.HttpApi.Host/SadganErp.Api.Gateway.HttpApi.Host.csproj'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  DOCKER_IMG: $(DOCKER_REGISTRY)/fx/backend
  isTagDuplicate: 'false'
  orgUrl: 'http://azure.sadgan.int/WebApp'
  project: 'SadganErp'
  baseProjPath: $(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi
  isBranchDevelop: ${{ eq(parameters.BRANCH, 'dev') }}
  isBranchDevOps:  ${{ eq(parameters.BRANCH, 'devops') }}
  isBranchALPHA:   ${{ eq(parameters.BRANCH, 'alpha') }}
  isBranchBETA:    ${{ eq(parameters.BRANCH, 'beta') }}
  isBranchMASTER:  ${{ eq(parameters.BRANCH, 'master') }} 
  isCreatePR:      ${{ eq(parameters.CREATE_PR, 'YES') }} 
  CURRENT_BRANCH:  ${{ parameters.BRANCH }}


# ──────────────────────────────────────────────────────────────────────
# 1. Resources – this pulls in the *other* Git repo
# ──────────────────────────────────────────────────────────────────────
resources:
  repositories:
  - repository: versionRepo   # alias you’ll use in checkout / path
    type: git
    name: SadganErp/CICD
    ref: refs/heads/cicd      # or refs/tags/v1.2.3, whatever branch you want
  - repository: self          # This is the source code repo
    type: git
    name: SadganErp/SadganErpApi
    ref: refs/heads/${{ parameters.BRANCH }}
# ──────────────────────────────────────────────────────────────────────
# 2. Check out *both* repos
# ──────────────────────────────────────────────────────────────────────
jobs:
  - job: CI
    displayName: 'CI'
    steps:
    - checkout: none
    
    # - bash: sudo apt-get update && sudo apt-get install -y jq
    #   displayName: 'Install jq'
    #   condition: eq(variables['Agent.OS'], 'Linux')
    
    # - task: Cache@2
    #   displayName: 'Cache .NET SDK'
    #   inputs:
    #     key: 'dotnet-sdk | "$(Agent.OS)" | 9.x'  # Use a unique key for the cache
    #     path: '$(Agent.ToolsDirectory)/dotnet'   # Path to the SDK installation
    #     restoreKeys: |
    #       dotnet-sdk | "$(Agent.OS)"  # Restore key for fallback
    
    # - task: UseDotNet@2
    #   displayName: 'Install .NET SDK'
    #   inputs:
    #     packageType: 'sdk'
    #     version: '9.x' 
    #     installationPath: $(Agent.ToolsDirectory)/dotnet
    
    
    - task: Bash@3
      name: init
      displayName: 'init'
      env:
        CURRENT_BRANCH: ${{ parameters.BRANCH }}
      inputs:
        targetType: 'inline'
        script: |    
          # Determine source branch based on current branch
          case "$CURRENT_BRANCH" in
              "dev")
                  SOURCE_BRANCH="dev"
                  ;;
              "devops")
                  SOURCE_BRANCH="dev"
                  ;;
              "alpha")
                  SOURCE_BRANCH="dev"
                  ;;
              "beta")
                  SOURCE_BRANCH="alpha"
                  ;;
              "master")
                  SOURCE_BRANCH="beta"
                  ;;
              *)
                  echo "Error: Current branch '$CURRENT_BRANCH' is not valid for promotion"
                  echo "Expected: alpha, beta, or master"
                  exit 1
                  ;;
          esac
          
          echo "Current branch: $CURRENT_BRANCH"
          echo "Source branch: $SOURCE_BRANCH"
          
          # Export for use in pipeline
          echo "##vso[task.setvariable variable=SOURCE_BRANCH;isOutput=true]$SOURCE_BRANCH"
          echo "##vso[task.setvariable variable=TARGET_BRANCH;isOutput=true]$CURRENT_BRANCH"
    
    
    - task: Bash@3
      name: create_pr_multi_repo
      displayName: 'Create & Complete PRs'
      condition: and(eq(variables['isCreatePR'], 'True'), eq(variables['isBranchDevelop'], 'False'))
      env:
        GIT_PAT: $(GIT_PAT)
      inputs:
        targetType: 'inline'
        script: |
          set -e
          
          # Function to clean repository ID (extract only valid UUID)
          clean_repo_id() {
            local id="$1"
            # Extract UUID format: 8-4-4-4-12 hex digits
            local cleaned=$(echo "$id" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            if [ -z "$cleaned" ]; then
              echo "$id" | tr -d '\n\r ' | cut -c1-36
            else
              echo "$cleaned"
            fi
          }
          
          # Function to safely call curl and validate JSON response
          call_api() {
            local url="$1"
            local method="${2:-GET}"
            local data="${3:-}"
            local temp_file=$(mktemp)
            local http_code
            
            echo "🔵 Calling API: $method $url" >&2
            
            # Clean URL of any potential newlines or extra characters
            url=$(echo "$url" | tr -d '\n\r ')
            
            if [ "$method" = "GET" ]; then
              http_code=$(curl -s -w "%{http_code}" -u ":$GIT_PAT" \
                -o "$temp_file" "$url")
            else
              http_code=$(curl -s -w "%{http_code}" -u ":$GIT_PAT" \
                -H "Content-Type: application/json" \
                -X "$method" \
                -d "$data" \
                -o "$temp_file" "$url")
            fi
            
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "❌ API call failed with HTTP $http_code" >&2
              if [ -s "$temp_file" ]; then
                cat "$temp_file" >&2
              fi
              rm -f "$temp_file"
              return 1
            fi
            
            # Validate JSON response
            if ! jq empty "$temp_file" 2>/dev/null; then
              echo "❌ Invalid JSON response" >&2
              cat "$temp_file" >&2
              rm -f "$temp_file"
              return 1
            fi
            
            cat "$temp_file"
            rm -f "$temp_file"
            return 0
          }
          
          # Git configuration
          git config --global user.email "S_Bot_Azure@sadgan.int"
          git config --global user.name "S_Bot_Azure"
          git config --global http.extraHeader "Authorization: Basic $(echo -n "PAT:$(GIT_PAT)" | base64 -w 0)"
          git config --global http.sslVerify false
          git config --global --add safe.directory '*'
          git config --global core.compression 0
          git config --global http.postBuffer 1048576000
          git config --global pack.threads 1
          git config --global pull.rebase false
          
          SOURCE_BRANCH="$(init.SOURCE_BRANCH)"
          TARGET_BRANCH="$(init.TARGET_BRANCH)"
          
          # Define all repositories to process
          REPOSITORIES=(
            "SadganShared/_git/1_Configs"
            "SadganShared/_git/2_SharedLibrary"
            "SadganShared/_git/4_ServerLibrary"
            "SadganErp/_git/SadganErpApi"
          )
          
          # Base URL
          BASE_URL="http://$(GIT_PAT)@azure.sadgan.int/WebApp"
          API_URL="$BASE_URL/_apis"
          
          echo "========================================="
          echo "Starting multi-repo PR creation for $SOURCE_BRANCH → $TARGET_BRANCH"
          echo "Total repositories: ${#REPOSITORIES[@]}"
          echo "========================================="
          
          # Initialize associative arrays
          declare -A REPO_IDS
          declare -A PR_IDS
          declare -A MERGE_STATUSES
          declare -A SOURCE_COMMITS
          
          # First pass: Check all repos for conflicts before any merges
          echo ""
          echo "========================================="
          echo "PHASE 1: PRE-VALIDATION - Checking all repos for merge conflicts"
          echo "========================================="
          
          for REPO_NAME in "${REPOSITORIES[@]}"; do
            echo ""
            echo "📦 Processing repository: $REPO_NAME"
            echo "-----------------------------------------"
            
            # Extract simple repo name
            SIMPLE_REPO_NAME=$(basename "$REPO_NAME")
            
            # Get repository ID
            echo "  🔍 Looking up repository ID for: $SIMPLE_REPO_NAME"
            REPOS_URL="$API_URL/git/repositories?api-version=6.0"
            REPOS_RESPONSE=$(call_api "$REPOS_URL") || {
              echo "  ❌ Failed to get repositories list"
              exit 1
            }
            
            # Extract and clean repository ID
            RAW_REPO_ID=$(echo "$REPOS_RESPONSE" | jq -r --arg name "$SIMPLE_REPO_NAME" '.value[] | select(.name==$name) | .id')
            REPO_ID=$(clean_repo_id "$RAW_REPO_ID")
            
            if [ -z "$REPO_ID" ] || [ "$REPO_ID" = "null" ]; then
              echo "  ❌ Could not find repository: $SIMPLE_REPO_NAME"
              echo "  Available repositories:"
              echo "$REPOS_RESPONSE" | jq -r '.value[].name' | sed 's/^/    - /'
              exit 1
            fi
            echo "  ✅ Found repository ID: $REPO_ID"
            REPO_IDS["$REPO_NAME"]="$REPO_ID"
            
            # Check for existing PR
            echo "  🔍 Checking for existing PRs..."
            PR_SEARCH_URL="$API_URL/git/repositories/$REPO_ID/pullrequests?searchCriteria.status=active&api-version=6.0"
            PR_SEARCH=$(call_api "$PR_SEARCH_URL") || {
              echo "  ❌ Failed to search PRs"
              exit 1
            }
            
            EXISTING_PR=$(echo "$PR_SEARCH" | jq -r --arg source "refs/heads/$SOURCE_BRANCH" --arg target "refs/heads/$TARGET_BRANCH" \
              '.value[] | select(.sourceRefName==$source and .targetRefName==$target) | .pullRequestId')
            
            if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
              echo "  ⚠️ Active PR exists: $EXISTING_PR"
              PR_IDS["$REPO_NAME"]="$EXISTING_PR"
            else
              # Create new PR
              echo "  🆕 Creating new PR..."
              PR_URL="$API_URL/git/repositories/$REPO_ID/pullrequests?api-version=6.0"
              PR_TITLE="BOT auto pr from $SOURCE_BRANCH to $TARGET_BRANCH"
              PR_BODY="{
                \"sourceRefName\": \"refs/heads/$SOURCE_BRANCH\",
                \"targetRefName\": \"refs/heads/$TARGET_BRANCH\",
                \"title\": \"$PR_TITLE\"
              }"
              
              PR_RESPONSE=$(call_api "$PR_URL" "POST" "$PR_BODY") || {
                echo "  ❌ Failed to create PR for $REPO_NAME"
                exit 1
              }
              
              PR_ID=$(echo "$PR_RESPONSE" | jq -r '.pullRequestId')
              
              if [ -z "$PR_ID" ] || [ "$PR_ID" = "null" ]; then
                echo "  ❌ Failed to create PR - invalid response"
                echo "  Response: $PR_RESPONSE"
                exit 1
              fi
              echo "  ✅ PR created with ID: $PR_ID"
              PR_IDS["$REPO_NAME"]="$PR_ID"
            fi
            
            # Quick check for immediate conflicts
            echo "  🔍 Checking initial merge status..."
            PR_URL="$API_URL/git/repositories/$REPO_ID/pullrequests/${PR_IDS["$REPO_NAME"]}?api-version=6.0"
            PR_DETAILS=$(call_api "$PR_URL") || {
              echo "  ❌ Failed to get PR details"
              exit 1
            }
            
            MERGE_STATUS=$(echo "$PR_DETAILS" | jq -r '.mergeStatus')
            MERGE_STATUSES["$REPO_NAME"]="$MERGE_STATUS"
            
            if [ "$MERGE_STATUS" = "conflicts" ]; then
              echo "  ❌ IMMEDIATE CONFLICT detected in $REPO_NAME"
              echo "  Aborting promotion - all repos must be conflict-free before proceeding"
              exit 1
            elif [ "$MERGE_STATUS" = "failure" ]; then
              echo "  ❌ MERGE FAILURE detected in $REPO_NAME"
              exit 1
            fi
            
            echo "  ✅ Initial merge status: $MERGE_STATUS"
          done
          
          # Second pass: Wait for all merges to be ready
          echo ""
          echo "========================================="
          echo "PHASE 2: WAITING FOR ALL MERGES TO BE READY"
          echo "========================================="
          
          MAX_ATTEMPTS=60
          ATTEMPT=0
          ALL_READY=false
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ] && [ "$ALL_READY" = false ]; do
            ALL_READY=true
            ATTEMPT=$((ATTEMPT + 1))
            
            echo ""
            echo "--- Check attempt $ATTEMPT/$MAX_ATTEMPTS ---"
            
            for REPO_NAME in "${REPOSITORIES[@]}"; do
              REPO_ID="${REPO_IDS["$REPO_NAME"]}"
              PR_ID="${PR_IDS["$REPO_NAME"]}"
              
              # Clean IDs before constructing URL
              REPO_ID_CLEAN=$(clean_repo_id "$REPO_ID")
              PR_ID_CLEAN=$(echo "$PR_ID" | tr -d '\n\r ')
              
              PR_URL="$API_URL/git/repositories/$REPO_ID_CLEAN/pullrequests/$PR_ID_CLEAN?api-version=6.0"
              PR_DETAILS=$(call_api "$PR_URL") || {
                echo "  ⚠️ Failed to get PR details for $REPO_NAME, will retry..."
                ALL_READY=false
                continue
              }
              
              MERGE_STATUS=$(echo "$PR_DETAILS" | jq -r '.mergeStatus')
              
              printf "  %-40s: %s\n" "$REPO_NAME" "$MERGE_STATUS"
              
              if [ "$MERGE_STATUS" = "conflicts" ]; then
                echo "  ❌ Merge conflict detected in $REPO_NAME"
                exit 1
              elif [ "$MERGE_STATUS" = "failure" ]; then
                echo "  ❌ Merge failure in $REPO_NAME"
                exit 1
              elif [ "$MERGE_STATUS" != "succeeded" ]; then
                ALL_READY=false
                MERGE_STATUSES["$REPO_NAME"]="$MERGE_STATUS"
              else
                MERGE_STATUSES["$REPO_NAME"]="$MERGE_STATUS"
                # Store source commit for later use
                if [ -z "${SOURCE_COMMITS[$REPO_NAME]}" ]; then
                  SOURCE_COMMITS["$REPO_NAME"]=$(echo "$PR_DETAILS" | jq -r '.lastMergeSourceCommit.commitId')
                fi
              fi
            done
            
            if [ "$ALL_READY" = false ] && [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Not all merges ready yet. Waiting 10 seconds..."
              sleep 10
            fi
          done
          
          if [ "$ALL_READY" = false ]; then
            echo "❌ Timeout waiting for merges to be ready"
            echo "Current statuses:"
            for REPO_NAME in "${REPOSITORIES[@]}"; do
              echo "  $REPO_NAME: ${MERGE_STATUSES["$REPO_NAME"]}"
            done
            exit 1
          fi
          
          echo ""
          echo "✅ ALL REPOSITORIES READY FOR MERGE"
          
          # Third pass: Approve and complete PRs sequentially
          echo ""
          echo "========================================="
          echo "PHASE 3: SEQUENTIAL APPROVAL AND COMPLETION"
          echo "========================================="
          
          COMPLETED_COUNT=0
          for REPO_NAME in "${REPOSITORIES[@]}"; do
            COMPLETED_COUNT=$((COMPLETED_COUNT + 1))
            echo ""
            echo "[$COMPLETED_COUNT/${#REPOSITORIES[@]}] Processing repository: $REPO_NAME"
            echo "-----------------------------------------"
            
            REPO_ID="${REPO_IDS["$REPO_NAME"]}"
            PR_ID="${PR_IDS["$REPO_NAME"]}"
            SOURCE_COMMIT="${SOURCE_COMMITS["$REPO_NAME"]}"
            
            # Clean IDs
            REPO_ID_CLEAN=$(clean_repo_id "$REPO_ID")
            PR_ID_CLEAN=$(echo "$PR_ID" | tr -d '\n\r ')
            
            # Get current user identity
            echo "  🔍 Getting PR details for approval..."
            PR_URL="$API_URL/git/repositories/$REPO_ID_CLEAN/pullrequests/$PR_ID_CLEAN?api-version=6.0"
            PR_DETAILS=$(call_api "$PR_URL") || {
              echo "  ❌ Failed to get PR details"
              exit 1
            }
            
            CURRENT_USER_ID=$(echo "$PR_DETAILS" | jq -r '.createdBy.id')
            
            # Add as reviewer and vote +10
            echo "  👍 Approving PR $PR_ID..."
            REVIEWER_URL="$API_URL/git/repositories/$REPO_ID_CLEAN/pullrequests/$PR_ID_CLEAN/reviewers/$CURRENT_USER_ID?api-version=6.0"
            REVIEWER_BODY="{\"vote\": 10}"
            
            call_api "$REVIEWER_URL" "PUT" "$REVIEWER_BODY" > /dev/null || {
              echo "  ⚠️ Failed to record vote, but continuing..."
            }
            
            echo "  ✅ PR approved"
            
            # Complete the PR with bypass
            echo "  🔄 Completing PR $PR_ID..."
            COMPLETE_URL="$API_URL/git/repositories/$REPO_ID_CLEAN/pullrequests/$PR_ID_CLEAN?api-version=6.0"
            COMPLETE_BODY="{
              \"status\": \"completed\",
              \"lastMergeSourceCommit\": {
                \"commitId\": \"$SOURCE_COMMIT\"
              },
              \"completionOptions\": {
                \"bypassPolicy\": true,
                \"bypassReason\": \"Automated pr - sequential merge\",
                \"mergeStrategy\": \"squash\",
                \"deleteSourceBranch\": false
              }
            }"
            
            COMPLETE_RESPONSE=$(call_api "$COMPLETE_URL" "PATCH" "$COMPLETE_BODY") || {
              echo "  ❌ Failed to complete PR for $REPO_NAME"
              exit 1
            }
            
            # Check completion
            HAS_COMPLETION_QUEUE=$(echo "$COMPLETE_RESPONSE" | jq -r 'has("completionQueueTime")')
            HAS_CLOSED_BY=$(echo "$COMPLETE_RESPONSE" | jq -r 'has("closedBy")')
            CURRENT_STATUS=$(echo "$COMPLETE_RESPONSE" | jq -r '.status // "unknown"')
            
            if [ "$HAS_COMPLETION_QUEUE" = "true" ] || [ "$HAS_CLOSED_BY" = "true" ] || [ "$CURRENT_STATUS" = "completed" ]; then
              echo "  ✅ PR $PR_ID completed successfully"
              
              # Wait for merge to fully complete before next repo
              echo "  ⏱️ Waiting 5 seconds for merge to settle..."
              sleep 5
              
              # Verify final status
              FINAL_CHECK=$(call_api "$COMPLETE_URL") || true
              FINAL_STATUS=$(echo "$FINAL_CHECK" | jq -r '.status // "unknown"')
              echo "  📊 Final PR status: $FINAL_STATUS"
            else
              echo "  ❌ Failed to complete PR for $REPO_NAME"
              echo "  Response: $COMPLETE_RESPONSE"
              exit 1
            fi
          done
          
          echo ""
          echo "========================================="
          echo "✅ ALL $COMPLETED_COUNT REPOSITORIES PROCESSED SUCCESSFULLY"
          echo "========================================="
    
    
    
    - bash: |
        set -e
        # Configure Git
        # git config --global credential.helper store
        # git config --global credential.useHttpPath false
        git config --global user.email "S_Bot_Azure@sadgan.int"
        git config --global user.name "S_Bot_Azure"
        git config --global http.extraHeader "Authorization: Basic $(echo -n "PAT:$(GIT_PAT)" | base64)"
        git config --global http.sslVerify false
        git config --global --add safe.directory '*'
        git config --global core.compression 0
        git config --global http.postBuffer 1048576000
        git config --global pack.threads 1
        git config --global pull.rebase false
    
    
        BASE_URL="http://$(GIT_PAT)@azure.sadgan.int/WebApp"
    
        function clone_or_pull {
            branch_name=$1
            repo_url=$2
            target_dir=$3
            
            echo "Cleaning up previous checkout ($target_dir)..."
            if [ -d "$target_dir" ]; then
                echo "Removing directory..."
                rm -rf "$target_dir"
            fi
            
            echo "Cloning $repo_url (branch: $branch_name) into $target_dir..."
            git clone --branch "$branch_name" "$repo_url" "$target_dir"
            
            if [ $? -eq 0 ] && [ -d "$target_dir/.git" ]; then
                cd "$target_dir"
                echo "Current directory: $(pwd)"
                echo "✅ Repository cloned to: $target_dir"
                echo "📁 Directory contents:"
                ls -la
            else
                echo "❌ Clone failed"
                exit 1
            fi
        } 
    
        echo "================= isCreatePR: $(isCreatePR)"
        PULL_BRANCH=$( [ "$(isBranchDevelop)" = "True" -o  "$(isBranchDevOps)" = "True"  ] && echo "developweb1" || echo "alpha" )
        

        clone_or_pull  $PULL_BRANCH     "$BASE_URL/SadganShared/_git/1_Configs"              "$(System.DefaultWorkingDirectory)/SadganShared/1_Configs"       
        clone_or_pull  $PULL_BRANCH     "$BASE_URL/SadganShared/_git/2_SharedLibrary"        "$(System.DefaultWorkingDirectory)/SadganShared/2_SharedLibrary" 
        clone_or_pull  $PULL_BRANCH     "$BASE_URL/SadganShared/_git/4_ServerLibrary"        "$(System.DefaultWorkingDirectory)/SadganShared/4_ServerLibrary"                
        clone_or_pull  $CURRENT_BRANCH  "$BASE_URL/SadganErp/_git/SadganErpApi"              "$(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi"          
        clone_or_pull  cicd             "$BASE_URL/SadganErp/_git/CICD"                      "$(System.DefaultWorkingDirectory)/CICD"  
    
    
        MAIN_COMMIT_HASH=$(cd "$(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi" && git rev-parse HEAD | cut -c1-8)
        echo "Using commit hash for cache busting: $MAIN_COMMIT_HASH"
    
        COMMIT_HASH="$MAIN_COMMIT_HASH"
    
    
        echo "Commit hash for SadganErpApi: $COMMIT_HASH"
        echo "##vso[task.setvariable variable=commit_hash;isOutput=true]$COMMIT_HASH"
        # echo "==================================="
        # echo "$(pwd)"
        # echo "Final directory structure:"
        # ls -R | head -15
      displayName: "Git Checkout"
      name: gitPull
      env:
        GIT_PAT: $(GIT_PAT)
    


    - task: Bash@3
      name: tagSetting
      displayName: 'Version Assign'
      env:
        SHOULD_RELEASE: ${{ parameters.SHOULD_RELEASE }}
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        targetType: 'inline'
        script: |
          ls -alh
          CUR_BRANCH="$CURRENT_BRANCH"
          echo "User name: ${{ variables['Build.RequestedFor'] }}"
          echo "User ID: ${{ variables['Build.RequestedForId'] }}"
          

          compare_versions() {
                local v1="$1" v2="$2"
            
                # 1. Strip leading “v” (case‑insensitive) & validate
                for v in v1 v2; do
                    local val=${!v}
                    [[ $val =~ ^[vV]?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
                        echo "Error – $val is not a valid semantic version (vMAJOR.MINOR.PATCH)" >&2
                        return 3
                    }
                    # Save only the numeric parts
                    eval "${v}=(${BASH_REMATCH[1]} ${BASH_REMATCH[2]} ${BASH_REMATCH[3]})"
                done
            
                # 2. Compare major, then minor, then patch
                local i
                for i in 0 1 2; do
                    if    (( v1[i] > v2[i] )); then printf "%s > %s\n" "$v1" "$v2"; return 1
                    elif (( v1[i] < v2[i] )); then printf "%s < %s\n" "$v1" "$v2"; return 2
                    fi
                done
            
                # 3. All components equal
                printf "%s == %s\n" "$v1" "$v2"
                return 0
          }
          
          # ------------------------------------------------------------------
          #  Extract Version & Perform Sanity check
          # ------------------------------------------------------------------
          if [ "$(isBranchDevelop)" == "True" -o  "$(isBranchDevOps)" == "True" ]; then
            NEW_TAG=$( [ "$(isBranchDevelop)" = true ] && echo "latest-dev" || echo "v0.0.0.0" )
            echo "Using tag: $NEW_TAG"
            echo "##vso[task.setvariable variable=FQIN;isOutput=true]$(DOCKER_IMG):$NEW_TAG"
            echo "##vso[task.setvariable variable=DOCKER_TAG;isOutput=true]$NEW_TAG"
                              
            cat <<EOF > $(Build.ArtifactStagingDirectory)/vars.json
              {
                "FQIN": "$(DOCKER_IMG):$NEW_TAG",
                "DOCKER_TAG": "$NEW_TAG",
                "CREATE_RELEASE": $SHOULD_RELEASE,
                "BRANCH": "$CUR_BRANCH"
              }
          EOF
          else
            json_file="$(System.DefaultWorkingDirectory)/CICD/branch-versions/backend/version.$CUR_BRANCH.json"
            #  echo $json_file
            IFS=, read -r major minor patch < <(
              jq -r '.major + "," + .minor + "," + .patch' "$json_file"
            )
          
            # printf 'v%s.%s.%s\n' "$major" "$minor" "$patch"
            baseVersion="v$major.$minor.$patch"
            echo "baseVersion: $baseVersion"
              
            cd "$(baseProjPath)"
            git tag -l | xargs git tag -d && git fetch --tags
            TAGS=$(git tag -l "${baseVersion}-$CUR_BRANCH*")
            LAST_TAG=$(git tag -l "${baseVersion}-$CUR_BRANCH.*" | sort -V | tail -n1)
            echo "LAST_TAG = $LAST_TAG"
            if [[ -z "$LAST_TAG" ]]; then
                echo "⚠️  No tag found matching '$baseVersion-$CUR_BRANCH.*'"
                _MAJOR=$major
                _MINOR=$minor
                _PATCH=$patch
                _PRE=$CUR_BRANCH
                _BN=0
            else
                IFS='.-' read -r _MAJOR _MINOR _PATCH _PRE _BN <<< "${LAST_TAG#v}"
                # _BN=$(echo "$LAST_TAG" | rev | cut -d. -f1 | rev)
            fi
            LAST_TAG="v$_MAJOR.$_MINOR.$_PATCH-$_PRE.$_BN"
            echo "LAST_TAG = $LAST_TAG"
            lastTagVersion="v$_MAJOR.$_MINOR.$_PATCH"
            echo "lastTagVersion: $lastTagVersion"
            
            if compare_versions "$lastTagVersion" "$baseVersion"; then # in case versions are equal
              echo "input version matches base version; so increasing build number:"
              _BN=$((_BN + 1))
              NEW_TAG="v$_MAJOR.$_MINOR.$_PATCH-$CUR_BRANCH.$_BN"
            elif [[ $? -eq 1 ]]; then # in case baseVersion is lower
              echo "WRONG! base version cannot be lower than previously released version!"
              exit 1
            else # baseVersion is upper
              NEW_TAG="v$major.$minor.$patch-$CUR_BRANCH.1"
            fi
            
            echo "new tag is: $NEW_TAG"
            cd "$(baseProjPath)"
            if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
              echo "Tag $NEW_TAG already exists!"
              echo "##vso[task.setvariable variable=isTagDuplicate]true"
              exit 0
            else              
              echo "##vso[task.setvariable variable=FQIN;isOutput=true]$(DOCKER_IMG):$NEW_TAG"
              echo "##vso[task.setvariable variable=DOCKER_TAG;isOutput=true]$NEW_TAG"
              cat <<EOF > $(Build.ArtifactStagingDirectory)/vars.json
                {
                  "FQIN": "$(DOCKER_IMG):$NEW_TAG",
                  "DOCKER_TAG": "$NEW_TAG",
                  "CREATE_RELEASE": $SHOULD_RELEASE,
                  "BRANCH": "$CUR_BRANCH"
                }
          EOF
            fi
          fi
          # for part in "$major" "$minor" "$patch"; do
          #     # We allow leading zeroes but want at least one digit
          #     if [[ ! $part =~ ^[0-9]+$ ]]; then
          #         echo "Error: version part '$part' is not a number" >&2
          #         exit 1
          #     fi
          # done
    
    
    # publish env as artifacts
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'build-vars'
        publishLocation: 'Container'
      condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))
    
    - bash: |
        configPropsFile="$(System.DefaultWorkingDirectory)/SadganShared/1_Configs/Directory.Packages.props"
    
        if [ "$(isBranchDevelop)" == "True" -o "$(isBranchDevOps)" = "True" ]; then
          new_assembly_version="0.0.0.0"
        else
          assembly_version=$(awk -F '[<>]' '/<AssemblyVersion>/ {print $3}' $configPropsFile)
          tag_version="$(tagSetting.DOCKER_TAG)"
          tag_version="${tag_version#v}"
          
          # Simple solution: extract all numbers and join with dots
          new_assembly_version=$(echo "$tag_version" | grep -oE '[0-9]+' | head -4 | paste -sd '.' -)
          
          # If we don't have 4 numbers, pad with zeros
          if [ -z "$new_assembly_version" ]; then
            new_assembly_version="0.0.0.0"
          else
            # Count how many numbers we have
            num_count=$(echo "$new_assembly_version" | tr -cd '.' | wc -c)
            num_count=$((num_count + 1))
            
            # Pad to 4 numbers
            while [ $num_count -lt 4 ]; do
              new_assembly_version="${new_assembly_version}.0"
              num_count=$((num_count + 1))
            done
          fi
        fi
    
        echo "current assembly version $assembly_version is changing to $new_assembly_version"
        sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>$new_assembly_version</AssemblyVersion>|" $configPropsFile
      displayName: "Assembly Version Fix"
      condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))
    
    
    # Override appsettings.json

    - bash: |
        sourceFile="$(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi/4_Gateway/src/SadganErp.Api.Gateway.HttpApi.Host/appsettings.pipe.json"
        destinationFile="$(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi/4_Gateway/src/SadganErp.Api.Gateway.HttpApi.Host/appsettings.json"
  
        if [ -f "$sourceFile" ]; then
            cp -f "$sourceFile" "$destinationFile"
            echo "Successfully copied appsettings.pipe.json to appsettings.json"
        else
            echo "❌ appsettings.pipe.json not found!"
            exit 1
        fi
      displayName: "Override appsettings.json"
      condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))
    
    
    
    # Create global NuGet.Config
    - bash: |
        # Nuget SSL
        echo "##vso[task.setvariable variable=NUGET_SSL_VERIFY]false"    
    
        sudo mkdir -p /usr/share
        echo '<?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="baget" value="https://nupkg.sadgan.int/v3/index.json" />
            <add key="NupkgWeb2" value="http://192.168.10.118/WebApp/_packaging/NupkgWeb2/nuget/v3/index.json" allowInsecureConnections="true" />
          </packageSources>
          <packageSourceCredentials>
            <NupkgWeb2>
              <add key="Username" value="S_Bot_Azure" />
              <add key="ClearTextPassword" value="$(BOT_TOKEN)" />
            </NupkgWeb2>
          </packageSourceCredentials>
        </configuration>' | sudo tee /usr/share/NuGet.Config > /dev/null
    
        # Remove project-specific NuGet.Config files
        find $(Build.SourcesDirectory) -name "NuGet.Config" -type f -delete
    
        ls -l /usr/share/NuGet.Config
        cat /usr/share/NuGet.Config
      displayName: 'Create global NuGet.Config'
      condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))
      env:
        BOT_TOKEN: $(BOT_TOKEN)
        
    
    # .Net Restore
    - bash: |
        export PATH="/home/azurebot/.dotnet:$PATH"
        dotnet --info
        dotnet restore "$(solution)" --configfile /usr/share/NuGet.Config
      displayName: 'Dotnet Restore'
      condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))
                
    
    - bash: |
        export PATH="/home/azurebot/.dotnet:$PATH"
        dotnet build "$(solution)" --no-restore --configuration $(buildConfiguration)
      displayName: 'Build Solution'
      condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))
        
    
    - bash: |
        export PATH="/home/azurebot/.dotnet:$PATH"
        dotnet publish "$(solution)" --no-restore --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish
        cp $(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi/4_Gateway/src/SadganErp.Api.Gateway.HttpApi.Host/appsettings.json $(Build.ArtifactStagingDirectory)/publish/
      displayName: 'Publish Solution'
      condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))
        
    
    - bash: |
        mkdir -p $(Build.ArtifactStagingDirectory)/docker
        cp $(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi/4_Gateway/src/SadganErp.Api.Gateway.HttpApi.Host/Dockerfile.pipe  $(Build.ArtifactStagingDirectory)/docker/
    
        echo "$(NEXUS_DOCKER_PASSWORD)" | docker login $(DOCKER_REGISTRY) \
          -u $(NEXUS_DOCKER_USERNAME) \
          --password-stdin
    
    
        cd $(Build.ArtifactStagingDirectory)
        APPSETTINGS_FILE="publish/appsettings.json"
    
        if [ "$(isBranchDevelop)" == "True" -o  "$(isBranchDevOps)" = "True" ]; then
          # sed -i '/"ConnectionStrings": {/,/}/s/pg/pg-dev/g' "$APPSETTINGS_FILE"
          # sed -i '/"App": {/,/}/ s|"SelfUrl": ".*"|"SelfUrl": "https://dev.api.fx.sadgan.int"|'     "$APPSETTINGS_FILE"
          # sed -i '/"App": {/,/}/ s|"CorsOrigins": ".*"|"CorsOrigins": "https://dev.api.fx.sadgan.int,https://dev.fx.sadgan.int"|' "$APPSETTINGS_FILE"
          # cat "$APPSETTINGS_FILE" | jq .
          docker build \
              -t $(tagSetting.FQIN) \
              -f docker/Dockerfile.pipe \
              .
          docker push $(tagSetting.FQIN)
        else
          docker build \
              -t "$(tagSetting.FQIN)" \
              -f docker/Dockerfile.pipe \
              .
    
          docker push "$(tagSetting.FQIN)"

          cd "$(baseProjPath)"
          git tag -a "$(tagSetting.DOCKER_TAG)" -m "$(tagSetting.DOCKER_TAG)"
          git push origin "$(tagSetting.DOCKER_TAG)" || { echo "Tag already available on remote repo!"; exit 1; }
        fi
      displayName: 'Build & Push Image'
      condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))
      env:
        NEXUS_DOCKER_USERNAME: $(NEXUS_DOCKER_USERNAME)
        NEXUS_DOCKER_PASSWORD: $(NEXUS_DOCKER_PASSWORD)
