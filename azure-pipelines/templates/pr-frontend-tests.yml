parameters:
- name: buildConfiguration
  type: string
  default: Release
- name: nodeVersion
  type: string
  default: '20.20.2'
- name: publishCodeCoverage
  type: string
  default: 'false'

steps:
- template: pr-test-clone.yml
  parameters:
    profile: frontend   

- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1
    dotnet --info
  displayName: 'Verify .NET SDK'

- template: dotnet-frontend-tests.yml
  parameters:
    buildConfiguration: ${{ parameters.buildConfiguration }}
    collectCoverage: ${{ parameters.publishCodeCoverage }}
    coverageFormat: cobertura
    runNodeSetup: 'true'
    nodeVersion: ${{ parameters.nodeVersion }}


- ${{ if or(eq(parameters.publishCodeCoverage, 'true'), eq(parameters.publishCodeCoverage, 'True')) }}:
  - bash: |
      set -euo pipefail
      ROOT="$(System.DefaultWorkingDirectory)/TestResults"
      echo "Searching for Cobertura under $ROOT ..."
      find "$ROOT" -type f \( -name 'coverage.cobertura.xml' -o -name '*.cobertura.xml' \) -ls || true
      mapfile -t FILES < <(find "$ROOT" -type f -name 'coverage.cobertura.xml' 2>/dev/null || true)
      if [ "${#FILES[@]}" -eq 0 ]; then
        echo "##vso[task.logissue type=error]No coverage.cobertura.xml found. Enable collectCoverage and check dotnet test logs for XPlat Code Coverage."
        exit 1
      fi
      # PublishCodeCoverageResults@1 on Server 2022 matches one path; use first file (merge in ADO if multiple).
      echo "##vso[task.setvariable variable=coberturaSummaryFile]${FILES[0]}"
      echo "Using summary file: ${FILES[0]}"
    displayName: 'Locate Cobertura coverage file'
    condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'))

  
  
  - bash: |
      set -euo pipefail
      export DOTNET_ROOT=/opt/net_sdk_10
      export PATH="/opt/net_sdk_10:$PATH"
      SRC="$(coberturaSummaryFile)"
      PUB_DIR="$(Agent.TempDirectory)/coverage-publish"
      rm -rf "$PUB_DIR"
      mkdir -p "$PUB_DIR"
      TOOL_DIR="$(Agent.TempDirectory)/reportgenerator"
      mkdir -p "$TOOL_DIR"
      if [ ! -x "$TOOL_DIR/reportgenerator" ]; then
        dotnet tool install dotnet-reportgenerator-globaltool --tool-path "$TOOL_DIR" --version 5.4.4
      fi
      echo "Cobertura summary file:"
      ls -lh "$SRC" || true
      SRC_ROOT="$(System.DefaultWorkingDirectory)"
      # Server browse API needs HtmlInline_AzurePipelines index.html (summary.html → index.html → HTTP 400).
      # Scope with assembly filters; path filters like */Sadgan.Erp.Panel/* miss SadganErp/ on disk and emptied Cobertura.
      "$TOOL_DIR/reportgenerator" \
        "-reports:${SRC}" \
        "-targetdir:${PUB_DIR}" \
        "-reporttypes:Cobertura;HtmlInline_AzurePipelines" \
        "-assemblyfilters:+Sadgan.Erp.Panel*;+Sadgan.Erp.Client.Core*" \
        "-sourcedirs:${SRC_ROOT}"
      FILTERED_COB="$PUB_DIR/Cobertura.xml"
      LINES_VALID=0
      if [ -f "$FILTERED_COB" ]; then
        LINES_VALID="$(grep -oE 'lines-valid="[0-9]+"' "$FILTERED_COB" | head -1 | grep -oE '[0-9]+' || true)"
        LINES_VALID="${LINES_VALID:-0}"
      fi
      echo "Filtered Cobertura lines-valid: ${LINES_VALID}"
      if [ "$LINES_VALID" -eq 0 ]; then
        echo "##vso[task.logissue type=warning]Assembly filters produced empty Cobertura; publishing full report HTML (larger)."
        rm -rf "$PUB_DIR"/*
        "$TOOL_DIR/reportgenerator" \
          "-reports:${SRC}" \
          "-targetdir:${PUB_DIR}" \
          "-reporttypes:HtmlInline_AzurePipelines" \
          "-sourcedirs:${SRC_ROOT}"
        SUMMARY_FOR_PUBLISH="$SRC"
      else
        SUMMARY_FOR_PUBLISH="$FILTERED_COB"
      fi
      if [ ! -f "$PUB_DIR/index.html" ] && [ ! -f "$PUB_DIR/index.htm" ]; then
        echo "##vso[task.logissue type=error]HtmlInline_AzurePipelines index.html not found under $PUB_DIR"
        ls -la "$PUB_DIR" || true
        exit 1
      fi
      du -sh "$PUB_DIR" "$SRC" "$SUMMARY_FOR_PUBLISH" 2>/dev/null || true
      echo "##vso[task.setvariable variable=coberturaSummaryFile]${SUMMARY_FOR_PUBLISH}"
      echo "##vso[task.setvariable variable=coverageReportDir]$PUB_DIR"
      echo "##vso[task.setvariable variable=disable.coverage.autogenerate]true"
    displayName: 'Prepare coverage HTML for publish'
    condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'))

  - task: PublishCodeCoverageResults@1
    displayName: 'Publish code coverage'
    condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'))
    # PublishCodeCoverageResults@1 runs ReportGenerator HtmlInline_AzurePipelines when dotnet is on PATH
    # (tens of GB on large solutions). disable.coverage.autogenerate is set in the prepare step (Server 2022 has no step-level variables).
    env:
      DISABLE_COVERAGE_AUTOGENERATE: 'true'
    inputs:
      codeCoverageTool: Cobertura
      summaryFileLocation: '$(coberturaSummaryFile)'
      reportDirectory: '$(coverageReportDir)'
      pathToSources: '$(System.DefaultWorkingDirectory)'

  - bash: |
      set -euo pipefail
      rm -rf "$(Agent.TempDirectory)/coverage-publish"
    displayName: 'Remove local coverage publish folder'
    condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'))


- task: PublishTestResults@2
  displayName: 'Publish test results'
  condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'))
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(System.DefaultWorkingDirectory)/TestResults/**/*.trx'
    mergeTestResults: true
    testRunTitle: 'Sadgan.Erp.Panel PR — Panel Tests'
    failTaskOnFailedTests: true
  

