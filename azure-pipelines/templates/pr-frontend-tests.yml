parameters:
- name: buildConfiguration
  type: string
  default: Release
- name: nodeVersion
  type: string
  default: '20.20.2'
- name: publishCodeCoverage
  type: string
  default: 'false'

steps:
- template: pr-test-clone.yml
  parameters:
    profile: frontend   

- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1
    dotnet --info
  displayName: 'Verify .NET SDK'

- template: dotnet-frontend-tests.yml
  parameters:
    buildConfiguration: ${{ parameters.buildConfiguration }}
    collectCoverage: ${{ parameters.publishCodeCoverage }}
    coverageFormat: cobertura
    runNodeSetup: 'true'
    nodeVersion: ${{ parameters.nodeVersion }}


- ${{ if or(eq(parameters.publishCodeCoverage, 'true'), eq(parameters.publishCodeCoverage, 'True')) }}:
  - bash: |
      set -euo pipefail
      ROOT="$(System.DefaultWorkingDirectory)/TestResults"
      echo "Searching for Cobertura under $ROOT ..."
      find "$ROOT" -type f \( -name 'coverage.cobertura.xml' -o -name '*.cobertura.xml' \) -ls || true
      mapfile -t FILES < <(find "$ROOT" -type f -name 'coverage.cobertura.xml' 2>/dev/null || true)
      if [ "${#FILES[@]}" -eq 0 ]; then
        echo "##vso[task.logissue type=error]No coverage.cobertura.xml found. Enable collectCoverage and check dotnet test logs for XPlat Code Coverage."
        exit 1
      fi
      # PublishCodeCoverageResults@1 on Server 2022 matches one path; use first file (merge in ADO if multiple).
      echo "##vso[task.setvariable variable=coberturaSummaryFile]${FILES[0]}"
      echo "##vso[task.setvariable variable=disable.coverage.autogenerate]true"
      echo "Using summary file: ${FILES[0]}"
      ls -lh "${FILES[0]}" || true
    displayName: 'Locate Cobertura coverage file'
    condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'))

  - bash: |
      set -euo pipefail
      export DOTNET_ROOT=/opt/net_sdk_10
      export PATH="/opt/net_sdk_10:$PATH"
      MAX_COBERTURA_MB=35
      MAX_HTML_MB=500
      SRC="$(coberturaSummaryFile)"
      SRC_ROOT="$(System.DefaultWorkingDirectory)"
      HTML_DIR="$(Agent.TempDirectory)/coverage-html"
      rm -rf "$HTML_DIR"
      mkdir -p "$HTML_DIR"
      echo "##vso[task.setvariable variable=publishCoverageWithHtml]false"

      COB_MB="$(du -m "$SRC" 2>/dev/null | awk '{print $1}')"
      COB_MB="${COB_MB:-999}"
      echo "Cobertura size: ${COB_MB} MB (HTML only if <= ${MAX_COBERTURA_MB} MB)"

      if [ "$COB_MB" -gt "$MAX_COBERTURA_MB" ]; then
        echo "##vso[task.logissue type=warning]Cobertura too large for PR HTML report; Azure tab will show summary-only message. Ensure Coverlet excludes **/*.razor."
        exit 0
      fi

      TOOL_DIR="$(Agent.TempDirectory)/reportgenerator"
      mkdir -p "$TOOL_DIR"
      if [ ! -x "$TOOL_DIR/reportgenerator" ]; then
        dotnet tool install dotnet-reportgenerator-globaltool --tool-path "$TOOL_DIR" --version 5.4.4
      fi
      "$TOOL_DIR/reportgenerator" \
        "-reports:${SRC}" \
        "-targetdir:${HTML_DIR}" \
        "-reporttypes:HtmlInline_AzurePipelines" \
        "-sourcedirs:${SRC_ROOT}"
      HTML_MB="$(du -sm "$HTML_DIR" 2>/dev/null | awk '{print $1}')"
      HTML_MB="${HTML_MB:-999}"
      echo "HtmlInline_AzurePipelines size: ${HTML_MB} MB"
      if [ ! -f "$HTML_DIR/index.html" ] || [ "$HTML_MB" -gt "$MAX_HTML_MB" ]; then
        echo "##vso[task.logissue type=warning]Coverage HTML missing or too large (${HTML_MB} MB); publishing Cobertura summary only."
        rm -rf "$HTML_DIR"
        exit 0
      fi
      echo "##vso[task.setvariable variable=publishCoverageWithHtml]true"
      echo "##vso[task.setvariable variable=coverageReportDir]$HTML_DIR"
    displayName: 'Prepare small coverage HTML (optional)'
    condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'))

  - task: PublishCodeCoverageResults@1
    displayName: 'Publish code coverage (summary + HTML)'
    condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'), eq(variables['publishCoverageWithHtml'], 'true'))
    env:
      DISABLE_COVERAGE_AUTOGENERATE: 'true'
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    inputs:
      codeCoverageTool: Cobertura
      summaryFileLocation: '$(coberturaSummaryFile)'
      reportDirectory: '$(coverageReportDir)'
      pathToSources: '$(System.DefaultWorkingDirectory)'

  - task: PublishCodeCoverageResults@1
    displayName: 'Publish code coverage (summary only)'
    condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'), ne(variables['publishCoverageWithHtml'], 'true'))
    env:
      DISABLE_COVERAGE_AUTOGENERATE: 'true'
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    inputs:
      codeCoverageTool: Cobertura
      summaryFileLocation: '$(coberturaSummaryFile)'
      pathToSources: '$(System.DefaultWorkingDirectory)'

  - bash: |
      set -euo pipefail
      rm -rf "$(Agent.TempDirectory)/coverage-html"
      rm -rf "$(System.DefaultWorkingDirectory)/TestResults/coverage"
    displayName: 'Free agent disk after coverage publish'
    condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'))


- task: PublishTestResults@2
  displayName: 'Publish test results'
  condition: and(succeededOrFailed(), eq(variables['dotnetTestsExecuted'], 'true'))
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(System.DefaultWorkingDirectory)/TestResults/**/*.trx'
    mergeTestResults: true
    testRunTitle: 'Sadgan.Erp.Panel PR — Panel Tests'
    failTaskOnFailedTests: true

