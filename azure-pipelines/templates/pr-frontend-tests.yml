parameters:
- name: buildConfiguration
  type: string
  default: Release
- name: nodeVersion
  type: string
  default: '20.20.2'
- name: publishCodeCoverage
  type: string
  default: 'false'

steps:
- template: pr-test-clone.yml
  parameters:
    profile: frontend   

- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1
    dotnet --info
  displayName: 'Verify .NET SDK'

- template: dotnet-frontend-tests.yml
  parameters:
    buildConfiguration: ${{ parameters.buildConfiguration }}
    collectCoverage: ${{ parameters.publishCodeCoverage }}
    coverageFormat: cobertura
    runNodeSetup: 'true'
    nodeVersion: ${{ parameters.nodeVersion }}

- task: PublishTestResults@2
  displayName: 'Publish test results'
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(System.DefaultWorkingDirectory)/TestResults/**/*.trx'
    mergeTestResults: true
    testRunTitle: 'Sadgan.Erp.Panel PR — Panel Tests'
    failTaskOnFailedTests: true

- ${{ if or(eq(parameters.publishCodeCoverage, 'true'), eq(parameters.publishCodeCoverage, 'True')) }}:
  - task: PublishCodeCoverageResults@2
    displayName: 'Publish code coverage'
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/TestResults/coverage/**/coverage.cobertura.xml'
      pathToSources: '$(System.DefaultWorkingDirectory)'
      failIfCoverageEmpty: false    
