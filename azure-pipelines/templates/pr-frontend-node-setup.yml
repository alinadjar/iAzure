parameters:
- name: nodeVersion
  type: string
  default: '20.20.2'

steps:
- bash: |
    set -euo pipefail

    export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
    if [ ! -s "$NVM_DIR/nvm.sh" ]; then
      echo "nvm not found at $NVM_DIR (agent user: $(whoami), HOME=$HOME)"
      exit 1
    fi

    # nvm is a shell function; must be sourced in every step unless PATH is prepended below.
    # shellcheck source=/dev/null
    . "$NVM_DIR/nvm.sh"

    NODE_VER="${{ parameters.nodeVersion }}"
    NODE_VER="${NODE_VER#v}"

    if ! nvm use "$NODE_VER"; then
      echo "Installing Node $NODE_VER via nvm ..."
      nvm install "$NODE_VER"
      nvm use "$NODE_VER"
    fi

    NODE_BIN="$(command -v node)"
    NPM_BIN="$(command -v npm)"
    echo "Using node: $NODE_BIN ($(node -v))"
    echo "Using npm:  $NPM_BIN ($(npm -v))"

    # Persist for later steps in this job (dotnet MSBuild Exec runs npm).
    echo "##vso[task.prependpath]$(dirname "$NODE_BIN")"
  displayName: 'Setup Node (nvm)'

- bash: |
    set -euo pipefail

    WEBAPP="$(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Panel/src/Sadgan.Erp.Panel.WebApp"
    PANEL_ROOT="$(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Panel"

    if [ ! -d "$WEBAPP" ]; then
      echo "WebApp path not found (skip tailwind prep): $WEBAPP"
      exit 0
    fi

    rm -f "$WEBAPP/global.json" "$PANEL_ROOT/global.json" 2>/dev/null || true

    if [ -d /opt/node_modules ]; then
      echo "Copying preinstalled node_modules from /opt/node_modules ..."
      rm -rf "$WEBAPP/node_modules"
      cp -r /opt/node_modules "$WEBAPP/node_modules"
      chmod -R +x "$WEBAPP/node_modules/.bin" 2>/dev/null || true
      ls -l "$WEBAPP/node_modules/.bin/tailwindcss" || true
    else
      echo "WARNING: /opt/node_modules not found; npm run build:css during dotnet build may fail."
    fi
  displayName: 'Prepare WebApp node_modules (tailwind)'
