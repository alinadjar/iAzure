parameters:
- name: buildConfiguration
  type: string
  default: Debug
- name: collectCoverage
  type: string
  default: 'false'
- name: emitCoberturaForAzure
  type: string
  default: 'false'

steps:
- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    ROOT="$(System.DefaultWorkingDirectory)"
    API="$ROOT/SadganErp/SadganErpApi"
    API_SLN="$API/SadganErp.Api.sln"
    CFG="${{ parameters.buildConfiguration }}"

    if [ ! -f "$API_SLN" ]; then
      echo "##vso[task.logissue type=error]Solution not found: $API_SLN"
      exit 1
    fi

    # All *Tests.csproj entries in SadganErp.Api.sln (add new test projects to the sln only).
    mapfile -t TEST_PROJECTS < <(
      grep -E '\.Tests\.csproj"' "$API_SLN" \
        | sed -E 's/.*", "([^"]+\.Tests\.csproj)".*/\1/' \
        | tr '\\' '/' \
        | while read -r rel; do realpath -m "$API/$rel"; done \
        | sort -u
    )

    if [ "${#TEST_PROJECTS[@]}" -eq 0 ]; then
      echo "##vso[task.logissue type=error]No *Tests.csproj projects found in $API_SLN"
      exit 1
    fi

    echo "Test projects from solution (${#TEST_PROJECTS[@]}):"
    printf '  %s\n' "${TEST_PROJECTS[@]}"

    dotnet restore "$API_SLN" --configfile "$(Agent.TempDirectory)/NuGet.Config" --disable-parallel
    dotnet build "$API_SLN" --configuration "$CFG" --no-restore
  displayName: 'Dotnet restore and build (backend tests)'

- bash: |
    set -uo pipefail
    echo "##vso[task.setvariable variable=dotnetTestsExecuted]true"
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    ROOT="$(System.DefaultWorkingDirectory)"
    API="$ROOT/SadganErp/SadganErpApi"
    API_SLN="$API/SadganErp.Api.sln"
    CFG="${{ parameters.buildConfiguration }}"
    RESULTS_DIR="$ROOT/TestResults"
    COVERAGE="${{ parameters.collectCoverage }}"
    EMIT_COBERTURA_AZURE="${{ parameters.emitCoberturaForAzure }}"
    rm -rf "$RESULTS_DIR"
    mkdir -p "$RESULTS_DIR"

    mapfile -t TEST_PROJECTS < <(
      grep -E '\.Tests\.csproj"' "$API_SLN" \
        | sed -E 's/.*", "([^"]+\.Tests\.csproj)".*/\1/' \
        | tr '\\' '/' \
        | while read -r rel; do realpath -m "$API/$rel"; done \
        | sort -u
    )

    FAILED=0
    for PROJ in "${TEST_PROJECTS[@]}"; do
      NAME="$(basename "$PROJ" .csproj)"
      echo "========== $NAME =========="
      if [ ! -f "$PROJ" ]; then
        echo "##vso[task.logissue type=error]Missing test project (listed in sln): $PROJ"
        FAILED=1
        continue
      fi

      run_test() {
        local fmt="$1"
        local write_trx="$2"
        local -a args=(
          "$PROJ"
          --configuration "$CFG"
          --no-build
          --results-directory "$RESULTS_DIR"
        )
        if [ "$write_trx" = "true" ]; then
          args+=(--logger "trx;LogFileName=${NAME}.trx")
        fi
        if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
          local cover_out="$RESULTS_DIR/coverage/$NAME/"
          mkdir -p "$cover_out"
          args+=(
            /p:CollectCoverage=true
            /p:CoverletOutputFormat="$fmt"
            /p:CoverletOutput="$cover_out"
          )
        fi
        dotnet test "${args[@]}"
      }

      if ! run_test opencover true; then
        echo "##vso[task.logissue type=error]Test project failed: $NAME"
        FAILED=1
        continue
      fi
      if { [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; } \
        && { [ "$EMIT_COBERTURA_AZURE" = "true" ] || [ "$EMIT_COBERTURA_AZURE" = "True" ]; }; then
        echo "Second pass: Cobertura for Azure DevOps (no extra TRX) ..."
        if ! run_test cobertura false; then
          echo "##vso[task.logissue type=error]Cobertura pass failed: $NAME"
          FAILED=1
        fi
      fi
    done

    echo "TRX files:"
    find "$RESULTS_DIR" -name '*.trx' -type f -ls || true
    if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
      echo "Coverage files:"
      find "$RESULTS_DIR/coverage" -name 'coverage.*.xml' -type f -ls || true
      if ! find "$RESULTS_DIR/coverage" -name 'coverage.opencover.xml' -type f 2>/dev/null | grep -q .; then
        echo "##vso[task.logissue type=warning]No coverage.opencover.xml — Sonar coverage will stay empty. Ensure test projects import Directory.Packages.Tests.props (coverlet.msbuild)."
      fi
    fi

    if [ "$FAILED" -ne 0 ]; then
      exit 1
    fi
  displayName: 'Run backend tests'
