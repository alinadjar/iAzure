parameters:
- name: buildConfiguration
  type: string
  default: Debug
- name: collectCoverage
  type: string
  default: 'false'
- name: emitCoberturaForAzure
  type: string
  default: 'false'

steps:
- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    ROOT="$(System.DefaultWorkingDirectory)"
    API="$ROOT/SadganErp/SadganErpApi"
    API_SLN="$API/SadganErp.Api.sln"
    CFG="${{ parameters.buildConfiguration }}"

    if [ ! -f "$API_SLN" ]; then
      echo "##vso[task.logissue type=error]Solution not found: $API_SLN"
      exit 1
    fi

    # All *Tests.csproj entries in SadganErp.Api.sln (add new test projects to the sln only).
    mapfile -t TEST_PROJECTS < <(
      grep -E '\.Tests\.csproj"' "$API_SLN" \
        | sed -E 's/.*", "([^"]+\.Tests\.csproj)".*/\1/' \
        | tr '\\' '/' \
        | while read -r rel; do realpath -m "$API/$rel"; done \
        | sort -u
    )

    if [ "${#TEST_PROJECTS[@]}" -eq 0 ]; then
      echo "##vso[task.logissue type=error]No *Tests.csproj projects found in $API_SLN"
      exit 1
    fi

    echo "Test projects from solution (${#TEST_PROJECTS[@]}):"
    printf '  %s\n' "${TEST_PROJECTS[@]}"

    dotnet restore "$API_SLN" --configfile "$(NUGET_CONFIG_PATH)" --disable-parallel
    dotnet build "$API_SLN" --configuration "$CFG" --no-restore
  displayName: 'Dotnet restore and build (backend tests)'

- bash: |
    set -uo pipefail
    echo "##vso[task.setvariable variable=dotnetTestsExecuted]true"
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    ROOT="$(System.DefaultWorkingDirectory)"
    API="$ROOT/SadganErp/SadganErpApi"
    API_SLN="$API/SadganErp.Api.sln"
    CFG="${{ parameters.buildConfiguration }}"
    RESULTS_DIR="$ROOT/TestResults"
    COVERAGE="${{ parameters.collectCoverage }}"
    rm -rf "$RESULTS_DIR"
    mkdir -p "$RESULTS_DIR"

    mapfile -t TEST_PROJECTS < <(
      grep -E '\.Tests\.csproj"' "$API_SLN" \
        | sed -E 's/.*", "([^"]+\.Tests\.csproj)".*/\1/' \
        | tr '\\' '/' \
        | while read -r rel; do realpath -m "$API/$rel"; done \
        | sort -u
    )

    FAILED=0
    for PROJ in "${TEST_PROJECTS[@]}"; do
      NAME="$(basename "$PROJ" .csproj)"
      echo "========== $NAME =========="
      if [ ! -f "$PROJ" ]; then
        echo "##vso[task.logissue type=error]Missing test project (listed in sln): $PROJ"
        FAILED=1
        continue
      fi

      EXTRA_ARGS=()
      if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
        COVER_OUT="$RESULTS_DIR/coverage/$NAME/"
        mkdir -p "$COVER_OUT"
        EXTRA_ARGS=(
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput="$COVER_OUT"
        )
      fi

      if ! dotnet test "$PROJ" \
        --configuration "$CFG" \
        --no-build \
        --logger "trx;LogFileName=${NAME}.trx" \
        --results-directory "$RESULTS_DIR" \
        "${EXTRA_ARGS[@]}"; then
        echo "##vso[task.logissue type=error]Test project failed: $NAME"
        FAILED=1
      fi
    done

    echo "TRX files:"
    find "$RESULTS_DIR" -name '*.trx' -type f -ls || true
    if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
      echo "Coverage files:"
      find "$RESULTS_DIR/coverage" -name 'coverage.opencover.xml' -type f -ls || true
    fi

    if [ "$FAILED" -ne 0 ]; then
      exit 1
    fi
  displayName: 'Run backend tests'
