parameters:
- name: buildConfiguration
  type: string
  default: Debug
- name: collectCoverage
  type: string
  default: 'false'

steps:
- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    ROOT="$(System.DefaultWorkingDirectory)"
    API="$ROOT/SadganErp/SadganErpApi"
    SHARED_LIB="$ROOT/SadganShared/2_SharedLibrary"
    CFG="${{ parameters.buildConfiguration }}"

    HOST_PROJ="$API/4_Gateway/src/SadganErp.Api.Gateway.HttpApi.Host/SadganErp.Api.Gateway.HttpApi.Host.csproj"
    GATEWAY_SLN="$API/4_Gateway/SadganErp.Api.Gateway.sln"

    TEST_PROJECTS=(
      "$SHARED_LIB/Sadgan.Shared.Tests/Sadgan.Shared.Tests.csproj"
      "$API/1_Core/test/SadganErp.Api.Core.EntityFrameworkCore.Tests/SadganErp.Api.Core.EntityFrameworkCore.Tests.csproj"
      "$API/4_Gateway/test/SadganErp.Api.Gateway.Application.Tests/SadganErp.Api.Gateway.Application.Tests.csproj"
      "$API/4_Gateway/test/SadganErp.Api.Gateway.EntityFrameworkCore.Tests/SadganErp.Api.Gateway.EntityFrameworkCore.Tests.csproj"
      "$API/4_Gateway/test/SadganErp.Api.Gateway.Domain.Tests/SadganErp.Api.Gateway.Domain.Tests.csproj"
      "$API/4_Gateway/test/SadganErp.Api.Gateway.HttpApi.Tests/SadganErp.Api.Gateway.HttpApi.Tests.csproj"
    )

    dotnet restore "$HOST_PROJ" --configfile "$(NUGET_CONFIG_PATH)" --disable-parallel
    dotnet restore "$GATEWAY_SLN" --configfile "$(NUGET_CONFIG_PATH)" --disable-parallel
    for PROJ in "${TEST_PROJECTS[@]}"; do
      dotnet restore "$PROJ" --configfile "$(NUGET_CONFIG_PATH)" --disable-parallel
    done
    dotnet build "$HOST_PROJ" --configuration "$CFG" --no-restore
  displayName: 'Dotnet restore and build (backend tests)'

- bash: |
    set -uo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    ROOT="$(System.DefaultWorkingDirectory)"
    API="$ROOT/SadganErp/SadganErpApi"
    SHARED_LIB="$ROOT/SadganShared/2_SharedLibrary"
    CFG="${{ parameters.buildConfiguration }}"
    RESULTS_DIR="$ROOT/TestResults"
    COVERAGE="${{ parameters.collectCoverage }}"
    mkdir -p "$RESULTS_DIR"

    TEST_PROJECTS=(
      "$SHARED_LIB/Sadgan.Shared.Tests/Sadgan.Shared.Tests.csproj"
      "$API/1_Core/test/SadganErp.Api.Core.EntityFrameworkCore.Tests/SadganErp.Api.Core.EntityFrameworkCore.Tests.csproj"
      "$API/4_Gateway/test/SadganErp.Api.Gateway.Application.Tests/SadganErp.Api.Gateway.Application.Tests.csproj"
      "$API/4_Gateway/test/SadganErp.Api.Gateway.EntityFrameworkCore.Tests/SadganErp.Api.Gateway.EntityFrameworkCore.Tests.csproj"
      "$API/4_Gateway/test/SadganErp.Api.Gateway.Domain.Tests/SadganErp.Api.Gateway.Domain.Tests.csproj"
      "$API/4_Gateway/test/SadganErp.Api.Gateway.HttpApi.Tests/SadganErp.Api.Gateway.HttpApi.Tests.csproj"
    )

    FAILED=0
    for PROJ in "${TEST_PROJECTS[@]}"; do
      NAME="$(basename "$PROJ" .csproj)"
      echo "========== $NAME =========="
      dotnet build "$PROJ" --configuration "$CFG" --no-restore

      EXTRA_ARGS=()
      if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
        COVER_OUT="$RESULTS_DIR/coverage/$NAME/"
        mkdir -p "$COVER_OUT"
        EXTRA_ARGS=(
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput="$COVER_OUT"
        )
      fi

      if ! dotnet test "$PROJ" \
        --configuration "$CFG" \
        --no-build \
        --logger "trx;LogFileName=${NAME}.trx" \
        --results-directory "$RESULTS_DIR" \
        "${EXTRA_ARGS[@]}"; then
        echo "##vso[task.logissue type=error]Test project failed: $NAME"
        FAILED=1
      fi
    done

    echo "TRX files:"
    find "$RESULTS_DIR" -name '*.trx' -type f -ls || true
    if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
      echo "Coverage files:"
      find "$RESULTS_DIR/coverage" -name 'coverage.opencover.xml' -type f -ls || true
    fi

    if [ "$FAILED" -ne 0 ]; then
      exit 1
    fi
  displayName: 'Run backend tests'
