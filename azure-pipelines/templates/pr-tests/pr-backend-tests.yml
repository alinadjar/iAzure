parameters:
- name: buildConfiguration
  type: string
  default: Debug

steps:
- template: pr-test-clone.yml
  parameters:
    profile: backend

- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1
    dotnet --info
  displayName: 'Verify .NET SDK'

- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    HOST_PROJ="$(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi/4_Gateway/src/SadganErp.Api.Gateway.HttpApi.Host/SadganErp.Api.Gateway.HttpApi.Host.csproj"
    TEST_PROJ="$(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi/4_Gateway/test/SadganErp.Api.Gateway.HttpApi.Tests/SadganErp.Api.Gateway.HttpApi.Tests.csproj"

    dotnet restore "$HOST_PROJ" --configfile "$(NUGET_CONFIG_PATH)" --disable-parallel
    dotnet restore "$TEST_PROJ" --configfile "$(NUGET_CONFIG_PATH)" --disable-parallel
    dotnet build "$TEST_PROJ" --configuration ${{ parameters.buildConfiguration }} --no-restore
  displayName: 'Dotnet restore and build (backend tests)'

# - task: DotNetCoreCLI@2
#   displayName: 'Run backend tests (Gateway HttpApi)'
#   inputs:
#     command: test
#     projects: '$(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi/4_Gateway/test/SadganErp.Api.Gateway.HttpApi.Tests/SadganErp.Api.Gateway.HttpApi.Tests.csproj'
#     arguments: >
#       --configuration ${{ parameters.buildConfiguration }}
#       --no-restore
#       --logger trx
#     publishTestResults: true

- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    TEST_PROJ="$(System.DefaultWorkingDirectory)/SadganErp/SadganErpApi/4_Gateway/test/SadganErp.Api.Gateway.HttpApi.Tests/SadganErp.Api.Gateway.HttpApi.Tests.csproj"
    RESULTS_DIR="$(System.DefaultWorkingDirectory)/TestResults"
    mkdir -p "$RESULTS_DIR"

    dotnet test "$TEST_PROJ" \
      --configuration ${{ parameters.buildConfiguration }} \
      --no-build \
      --logger "trx;LogFileName=backend-gateway.trx" \
      --results-directory "$RESULTS_DIR"
  displayName: 'Run backend tests (Gateway HttpApi)'
  

- task: PublishTestResults@2
  displayName: 'Publish test results'
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(System.DefaultWorkingDirectory)/TestResults/**/*.trx'
    mergeTestResults: true
    testRunTitle: 'SadganErpApi PR — Gateway HttpApi Tests'
    failTaskOnFailedTests: true
