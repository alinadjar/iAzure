parameters:
- name: profile
  type: string
  # backend | frontend

steps:
- bash: |
    set -euo pipefail

    # if [ "$(Build.Reason)" != "PullRequest" ]; then
    #   echo "This pipeline is for Pull Request validation (Build.Reason=$(Build.Reason))."
    #   exit 1
    # fi

    mkdir -p "$GIT_HOME"
    export GIT_CONFIG_GLOBAL="$(GIT_CONFIG_GLOBAL)"

    git config --file "$GIT_CONFIG_GLOBAL" user.email "S_Bot_Azure@sadgan.int"
    git config --file "$GIT_CONFIG_GLOBAL" user.name "S_Bot_Azure"
    git config --file "$GIT_CONFIG_GLOBAL" http.extraHeader "Authorization: Basic $(echo -n "PAT:$(GIT_PAT)" | base64)"
    git config --file "$GIT_CONFIG_GLOBAL" http.sslVerify false
    git config --file "$GIT_CONFIG_GLOBAL" --add safe.directory '*'

    BASE_URL="http://$(GIT_PAT)@azure.sadgan.int/WebApp"
    PR_ID="$(System.PullRequest.PullRequestId)"
    TARGET_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
    APP_REPO="$(Build.Repository.Name)"
    WORK_ROOT="$(System.DefaultWorkingDirectory)"

    echo "PR #$PR_ID → target: $TARGET_BRANCH | app repo: $APP_REPO"

    if [ "$TARGET_BRANCH" != "dev" ] && [[ ! "$TARGET_BRANCH" =~ ^wit/ ]]; then
      echo "Unsupported PR target branch: $TARGET_BRANCH (expected dev or wit/*)"
      exit 1
    fi

    SHARED_BRANCH="dev"

    clone_shared() {
      local branch_name="$1"
      local repo_path="$2"
      local target_dir="$3"

      echo "Cloning SadganShared/$repo_path @ $branch_name ..."
      rm -rf "$target_dir"
      git clone --branch "$branch_name" "$BASE_URL/SadganShared/_git/$repo_path" "$target_dir"
    }

    clone_app_pr_merge() {
      local repo_name="$1"
      local target_dir="$2"

      echo "Cloning SadganErp/$repo_name and checking out PR merge commit ..."
      rm -rf "$target_dir"
      git clone "$BASE_URL/SadganErp/_git/$repo_name" "$target_dir"
      cd "$target_dir"
      if ! git fetch origin "refs/pull/${PR_ID}/merge"; then
        echo "Could not fetch refs/pull/${PR_ID}/merge (merge conflicts or policy). Failing so PR cannot complete."
        exit 1
      fi
      git checkout FETCH_HEAD
      echo "App commit under test: $(git rev-parse --short HEAD)"
      cd "$WORK_ROOT"
    }

    clone_shared "$SHARED_BRANCH" "1_Configs" "$WORK_ROOT/SadganShared/1_Configs"
    clone_shared "$SHARED_BRANCH" "2_SharedLibrary" "$WORK_ROOT/SadganShared/2_SharedLibrary"

    if [ "${{ parameters.profile }}" = "frontend" ]; then
      clone_shared "$SHARED_BRANCH" "3_ClientLibrary" "$WORK_ROOT/SadganShared/3_ClientLibrary"
      clone_shared "$SHARED_BRANCH" "4_ServerLibrary" "$WORK_ROOT/SadganShared/4_ServerLibrary"
      clone_app_pr_merge "Sadgan.Erp.Panel" "$WORK_ROOT/SadganErp/Sadgan.Erp.Panel"
      rm -rf "$WORK_ROOT/SadganErp/Sadgan.Erp.Client.Core"
      git clone --branch "$SHARED_BRANCH" "$BASE_URL/SadganErp/_git/Sadgan.Erp.Client.Core" "$WORK_ROOT/SadganErp/Sadgan.Erp.Client.Core"
    else
      clone_shared "$SHARED_BRANCH" "4_ServerLibrary" "$WORK_ROOT/SadganShared/4_ServerLibrary"
      if [ "$APP_REPO" != "SadganErpApi" ]; then
        echo "Backend PR test must run from SadganErpApi repository (got $APP_REPO)."
        exit 1
      fi
      clone_app_pr_merge "SadganErpApi" "$WORK_ROOT/SadganErp/SadganErpApi"
    fi

    if [ "${{ parameters.profile }}" = "frontend" ] && [ "$APP_REPO" != "Sadgan.Erp.Panel" ]; then
      echo "Frontend PR test must run from Sadgan.Erp.Panel repository (got $APP_REPO)."
      exit 1
    fi

    echo "Checkout complete."
  displayName: 'Clone shared repos and PR merge commit'
  env:
    GIT_PAT: $(GIT_PAT)
    GIT_CONFIG_GLOBAL: $(GIT_CONFIG_GLOBAL)
    GIT_HOME: $(GIT_HOME)

- bash: |
    set -euo pipefail
    echo "##vso[task.setvariable variable=NUGET_SSL_VERIFY]false"

    NUGET_CONFIG="$(Agent.TempDirectory)/NuGet.Config"
    mkdir -p "$(Agent.TempDirectory)"
    cat > "$NUGET_CONFIG" <<EOF
    <?xml version="1.0" encoding="utf-8"?>
    <configuration>
      <packageSources>
        <clear />
        <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
        <add key="NupkgWeb2" value="http://192.168.10.118/WebApp/_packaging/NupkgWeb2/nuget/v3/index.json" allowInsecureConnections="true" />
      </packageSources>
      <packageSourceCredentials>
        <NupkgWeb2>
          <add key="Username" value="S_Bot_Azure" />
          <add key="ClearTextPassword" value="$(BOT_TOKEN)" />
        </NupkgWeb2>
      </packageSourceCredentials>
    </configuration>
    EOF

    find "$(System.DefaultWorkingDirectory)" -name "NuGet.Config" -type f -delete
    echo "##vso[task.setvariable variable=NUGET_CONFIG_PATH]$NUGET_CONFIG"
  displayName: 'Create NuGet.Config'
  env:
    BOT_TOKEN: $(BOT_TOKEN)
