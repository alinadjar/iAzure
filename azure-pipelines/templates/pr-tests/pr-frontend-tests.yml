parameters:
- name: buildConfiguration
  type: string
  default: Release
- name: nodeVersion
  type: string
  default: '20.20.2'

steps:
- template: pr-test-clone.yml
  parameters:
    profile: frontend

- template: pr-frontend-node-setup.yml
  parameters:
    nodeVersion: ${{ parameters.nodeVersion }}

- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1
    dotnet --info
  displayName: 'Verify .NET SDK'

- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    cp -r /opt/node_modules .
    chmod -R +x node_modules/.bin
    ls -l node_modules/.bin/tailwindcss
    # npm run build:css
    rm $(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Panel/global.json 2>/dev/null || true    

    command -v node >/dev/null && node -v || echo "WARNING: node not on PATH"
    command -v npm >/dev/null && npm -v || echo "WARNING: npm not on PATH"
    

    SLN="$(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Panel/Sadgan.Erp.Panel.sln"
    dotnet restore "$SLN" --configfile "$(NUGET_CONFIG_PATH)" --disable-parallel
    dotnet build "$SLN" --configuration ${{ parameters.buildConfiguration }} --no-restore
  displayName: 'Dotnet restore and build (Panel solution)'

- bash: |
    set -uo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    ROOT="$(System.DefaultWorkingDirectory)"
    CFG="${{ parameters.buildConfiguration }}"
    RESULTS_DIR="$ROOT/TestResults"
    mkdir -p "$RESULTS_DIR"

    # MockTests and ServerTests share one folder; build+test each project separately so testhost files are not overwritten.
    TEST_PROJECTS=(
      "$ROOT/SadganShared/3_ClientLibrary/src/Sadgan.Shared.Client.Tests/Sadgan.Shared.Client.MockTests.csproj"
      "$ROOT/SadganShared/3_ClientLibrary/src/Sadgan.Shared.Client.Tests/Sadgan.Shared.Client.ServerTests.csproj"
      "$ROOT/SadganErp/Sadgan.Erp.Panel/src/Sadgan.Erp.Panel.Tests/Sadgan.Erp.Panel.Api.Tests.csproj"
    )

    FAILED=0
    for PROJ in "${TEST_PROJECTS[@]}"; do
      NAME="$(basename "$PROJ" .csproj)"
      echo "========== $NAME =========="
      dotnet build "$PROJ" --configuration "$CFG" --no-restore
      if ! dotnet test "$PROJ" \
        --configuration "$CFG" \
        --no-build \
        --logger "trx;LogFileName=${NAME}.trx" \
        --results-directory "$RESULTS_DIR"; then
        echo "##vso[task.logissue type=error]Test project failed: $NAME"
        FAILED=1
      fi
    done

    echo "TRX files produced:"
    find "$RESULTS_DIR" -name '*.trx' -type f -ls || true

    if [ "$FAILED" -ne 0 ]; then
      exit 1
    fi
  displayName: 'Run frontend tests (per project)'

- task: PublishTestResults@2
  displayName: 'Publish test results'
  condition: always()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(System.DefaultWorkingDirectory)/TestResults/**/*.trx'
    mergeTestResults: true
    testRunTitle: 'Sadgan.Erp.Panel PR — Panel Tests'
    failTaskOnFailedTests: true
