parameters:
- name: buildConfiguration
  type: string
  default: Release
- name: collectCoverage
  type: string
  default: 'false'
- name: coverageFormat
  type: string
  default: 'opencover'
  # opencover -> Sonar; cobertura -> Azure DevOps
- name: runNodeSetup
  type: string
  default: 'true'
- name: nodeVersion
  type: string
  default: '20.20.2'
- name: emitCoberturaForAzure
  type: string
  default: 'false'
- name: testProjects
  type: string
  default: panel-only
  # panel-only | client-and-panel | sln
- name: includeSadganSharedTests
  type: string
  default: 'false'

steps:
- ${{ if or(eq(parameters.runNodeSetup, 'true'), eq(parameters.runNodeSetup, 'True')) }}:
  - template: pr-frontend-node-setup.yml
    parameters:
      nodeVersion: ${{ parameters.nodeVersion }}

- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1
    cp -r /opt/node_modules .
    chmod -R +x node_modules/.bin
    ls -l node_modules/.bin/tailwindcss
    rm "$(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Panel/global.json" 2>/dev/null || true
    command -v node >/dev/null && node -v || echo "WARNING: node not on PATH"
    command -v npm >/dev/null && npm -v || echo "WARNING: npm not on PATH"
    SLN="$(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Panel/Sadgan.Erp.Panel.sln"
    if [ -z "${NUGET_CONFIG_PATH:-}" ] || [ ! -f "$(NUGET_CONFIG_PATH)" ]; then
      echo "##vso[task.logissue type=error]NUGET_CONFIG_PATH is not set. Run Create NuGet.Config before dotnet-frontend-tests."
      exit 1
    fi
    dotnet restore "$SLN" --configfile "$(NUGET_CONFIG_PATH)" --disable-parallel
  displayName: 'Dotnet restore (Panel tests)'

- bash: |
    set -uo pipefail
    echo "##vso[task.setvariable variable=dotnetTestsExecuted]true"
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1
    ROOT="$(System.DefaultWorkingDirectory)"
    SLN="$ROOT/SadganErp/Sadgan.Erp.Panel/Sadgan.Erp.Panel.sln"
    PANEL_DIR="$ROOT/SadganErp/Sadgan.Erp.Panel"
    CFG="${{ parameters.buildConfiguration }}"
    RESULTS_DIR="$ROOT/TestResults"
    COVERAGE="${{ parameters.collectCoverage }}"
    COVER_FORMAT="${{ parameters.coverageFormat }}"
    EMIT_COBERTURA_AZURE="${{ parameters.emitCoberturaForAzure }}"
    INCLUDE_SHARED="${{ parameters.includeSadganSharedTests }}"
    TEST_SCOPE="${{ parameters.testProjects }}"
    XUNIT_SETTINGS="$(Agent.TempDirectory)/xunit-serial.runsettings.xml"
    cat > "$XUNIT_SETTINGS" <<'EOF'
  <?xml version="1.0" encoding="utf-8"?>
  <RunSettings>
    <RunConfiguration>
      <TestSessionTimeout>900000</TestSessionTimeout>
      <MaxCpuCount>1</MaxCpuCount>
    </RunConfiguration>
    <XUnit>
      <ParallelizeAssembly>false</ParallelizeAssembly>
      <ParallelizeTestCollections>false</ParallelizeTestCollections>
      <MaxParallelThreads>1</MaxParallelThreads>
    </XUnit>
  </RunSettings>
  EOF
    rm -rf "$RESULTS_DIR"
    mkdir -p "$RESULTS_DIR"
    PANEL_PROJ="$ROOT/SadganErp/Sadgan.Erp.Panel/src/Sadgan.Erp.Panel.Tests/Sadgan.Erp.Panel.Api.Tests.csproj"
    MOCK_PROJ="$ROOT/SadganShared/3_ClientLibrary/src/Sadgan.Shared.Client.Tests/Sadgan.Shared.Client.MockTests.csproj"
    SERVER_PROJ="$ROOT/SadganShared/3_ClientLibrary/src/Sadgan.Shared.Client.Tests/Sadgan.Shared.Client.ServerTests.csproj"
    TEST_PROJECTS=()
    case "$TEST_SCOPE" in
      panel-only|Panel-Only|PANEL-ONLY)
        TEST_PROJECTS=("$PANEL_PROJ")
        ;;
      client-and-panel|Client-And-Panel|CLIENT-AND-PANEL)
        TEST_PROJECTS=("$MOCK_PROJ" "$SERVER_PROJ" "$PANEL_PROJ")
        ;;
      sln|Sln|SLN)
        mapfile -t DISCOVERED < <(grep -E '(MockTests|ServerTests|\.Tests)\.csproj"' "$SLN" | sed -E 's/.*", "([^"]+\.csproj)".*/\1/' | tr '\\' '/' | while read -r rel; do realpath -m "$PANEL_DIR/$rel"; done | sort -u)
        if [ "${#DISCOVERED[@]}" -eq 0 ]; then
          echo "##vso[task.logissue type=error]No test projects found in $SLN"
          exit 1
        fi
        PREFERRED_BASENAMES=(Sadgan.Shared.Client.MockTests.csproj Sadgan.Shared.Client.ServerTests.csproj Sadgan.Erp.Panel.Api.Tests.csproj Sadgan.Shared.Tests.csproj)
        for base in "${PREFERRED_BASENAMES[@]}"; do
          if [ "$base" = "Sadgan.Shared.Tests.csproj" ] && [ "$INCLUDE_SHARED" != "true" ] && [ "$INCLUDE_SHARED" != "True" ]; then
            continue
          fi
          for p in "${DISCOVERED[@]}"; do
            if [ "$(basename "$p")" = "$base" ]; then
              TEST_PROJECTS+=("$p")
              break
            fi
          done
        done
        for p in "${DISCOVERED[@]}"; do
          found=0
          for q in "${TEST_PROJECTS[@]}"; do
            if [ "$p" = "$q" ]; then found=1; break; fi
          done
          if [ "$found" -eq 0 ]; then TEST_PROJECTS+=("$p"); fi
        done
        ;;
      *)
        echo "##vso[task.logissue type=error]Unknown testProjects scope: $TEST_SCOPE (use panel-only, client-and-panel, or sln)"
        exit 1
        ;;
    esac
    echo "testProjects scope: $TEST_SCOPE"
    echo "Test projects (${#TEST_PROJECTS[@]}):"
    printf '  %s\n' "${TEST_PROJECTS[@]}"
    if [ "$TEST_SCOPE" = "panel-only" ] || [ "$TEST_SCOPE" = "Panel-Only" ] || [ "$TEST_SCOPE" = "PANEL-ONLY" ]; then
      echo "panel-only: build MockTests dependency first (WireMock BaseFixture in Sadgan.Shared.Client.MockTests.dll) ..."
      if ! dotnet build "$MOCK_PROJ" --configuration "$CFG" --no-restore -m:1 --disable-parallel -p:BuildInParallel=false; then
        echo "##vso[task.logissue type=error]Build failed: Sadgan.Shared.Client.MockTests (Panel dependency)"
        exit 1
      fi
    fi
    clear_static_web_asset_cache() {
      find "$ROOT/SadganErp" -path '*/obj/*' -name 'rpswa.dswa.cache.json' -delete 2>/dev/null || true
    }
    FAILED=0
    for PROJ in "${TEST_PROJECTS[@]}"; do
      NAME="$(basename "$PROJ" .csproj)"
      echo "========== $NAME =========="
      if [ ! -f "$PROJ" ]; then
        echo "##vso[task.logissue type=error]Missing test project: $PROJ"
        FAILED=1
        continue
      fi
      clear_static_web_asset_cache
      EXTRA_BUILD=()
      if [ "$NAME" = "Sadgan.Shared.Client.ServerTests" ]; then
        EXTRA_BUILD=(/p:UseMockHttp=true)
        echo "ServerTests: /p:UseMockHttp=true on agent (avoid localhost:5050)."
      fi
      echo "dotnet build (single test project) ..."
      if ! dotnet build "$PROJ" --configuration "$CFG" --no-restore -m:1 --disable-parallel -p:BuildInParallel=false "${EXTRA_BUILD[@]}"; then
        echo "##vso[task.logissue type=error]Build failed: $NAME"
        FAILED=1
        continue
      fi
      run_dotnet_test() {
        local cover_fmt="$1"
        local write_trx="$2"
        local collect="$3"
        local -a args=("$PROJ" --configuration "$CFG" --no-build --results-directory "$RESULTS_DIR")
        if [ "$NAME" = "Sadgan.Shared.Client.ServerTests" ]; then
          args+=(/p:UseMockHttp=true)
        fi
        if [ "$write_trx" = "true" ]; then
          args+=(--logger "trx;LogFileName=${NAME}.trx")
        fi
        if [ "$NAME" = "Sadgan.Erp.Panel.Api.Tests" ]; then
          args+=(--settings "$XUNIT_SETTINGS" --blame-hang-timeout 10m --logger "console;verbosity=normal")
        fi
        if { [ "$collect" = "true" ] || [ "$collect" = "True" ]; } && { [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; }; then
          local cover_out="$RESULTS_DIR/coverage/$NAME/"
          mkdir -p "$cover_out"
          args+=(/p:CollectCoverage=true /p:CoverletOutputFormat="$cover_fmt" /p:CoverletOutput="$cover_out" '/p:Include=[Sadgan*]*')
        fi
        echo "dotnet test (${cover_fmt}, trx=${write_trx}, coverage=${collect}) ..."
        dotnet test "${args[@]}"
      }
      collect_coverage=true
      if [ "$NAME" = "Sadgan.Erp.Panel.Api.Tests" ]; then
        collect_coverage=false
        if { [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; }; then
          echo "Skipping Coverlet on Panel.Api.Tests; TRX only. Use client-and-panel for ADO Cobertura from Mock/Server."
        fi
      elif [ "$NAME" = "Sadgan.Shared.Tests" ]; then
        collect_coverage=false
        if { [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; }; then
          echo "Skipping Coverlet on Sadgan.Shared.Tests; TRX only."
        fi
      fi
      PRIMARY_COVER="$COVER_FORMAT"
      if ! run_dotnet_test "$PRIMARY_COVER" true "$collect_coverage"; then
        echo "##vso[task.logissue type=error]Test project failed: $NAME"
        FAILED=1
        continue
      fi
      if { [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; } && [ "$PRIMARY_COVER" = "opencover" ] && { [ "$EMIT_COBERTURA_AZURE" = "true" ] || [ "$EMIT_COBERTURA_AZURE" = "True" ]; } && [ "$collect_coverage" = "true" ]; then
        echo "Second pass: Cobertura for Azure DevOps (no extra TRX) ..."
        if ! run_dotnet_test "cobertura" false true; then
          echo "##vso[task.logissue type=error]Cobertura pass failed: $NAME"
          FAILED=1
        fi
      fi
    done
    echo "TRX files:"
    find "$RESULTS_DIR" -name '*.trx' -type f -ls || true
    if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
      echo "Coverage files:"
      find "$RESULTS_DIR/coverage" -name 'coverage.*.xml' -type f -ls 2>/dev/null || true
      if ! find "$RESULTS_DIR/coverage" -name 'coverage.*.xml' -type f 2>/dev/null | grep -q .; then
        echo "##vso[task.logissue type=warning]No coverage XML under TestResults/coverage."
      fi
    fi
    if [ "$FAILED" -ne 0 ]; then
      exit 1
    fi
  displayName: 'Run frontend tests'
