parameters:
- name: buildConfiguration
  type: string
  default: Release
- name: collectCoverage
  type: string
  default: 'false'
- name: coverageFormat
  type: string
  default: 'opencover'  
 # opencover → Sonar (coverage.opencover.xml); cobertura → Azure DevOps (coverage.cobertura.xml)  
- name: runNodeSetup
  type: string
  default: 'true'
- name: nodeVersion
  type: string
  default: '20.20.2'

steps:
- ${{ if or(eq(parameters.runNodeSetup, 'true'), eq(parameters.runNodeSetup, 'True')) }}:
  - template: pr-frontend-node-setup.yml
    parameters:
      nodeVersion: ${{ parameters.nodeVersion }}

- bash: |
    set -euo pipefail
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    cp -r /opt/node_modules .
    chmod -R +x node_modules/.bin
    ls -l node_modules/.bin/tailwindcss
    # npm run build:css
    rm $(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Panel/global.json 2>/dev/null || true    

    command -v node >/dev/null && node -v || echo "WARNING: node not on PATH"
    command -v npm >/dev/null && npm -v || echo "WARNING: npm not on PATH"

    SLN="$(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Panel/Sadgan.Erp.Panel.sln"
    dotnet restore "$SLN" --configfile "$(NUGET_CONFIG_PATH)" --disable-parallel
    dotnet build "$SLN" --configuration ${{ parameters.buildConfiguration }} --no-restore
  displayName: 'Dotnet build (Panel tests)'

- bash: |
    set -uo pipefail
    echo "##vso[task.setvariable variable=dotnetTestsExecuted]true"
    export DOTNET_ROOT=/opt/net_sdk_10
    export PATH="/opt/net_sdk_10:$PATH"
    export MSBUILDDISABLENODEREUSE=1

    ROOT="$(System.DefaultWorkingDirectory)"
    CFG="${{ parameters.buildConfiguration }}"
    RESULTS_DIR="$ROOT/TestResults"
    COVERAGE="${{ parameters.collectCoverage }}"
    COVER_FORMAT="${{ parameters.coverageFormat }}"

    rm -rf "$RESULTS_DIR"
    mkdir -p "$RESULTS_DIR"

    RUNSETTINGS="$(Agent.TempDirectory)/coverlet.runsettings"
    if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
      cat > "$RUNSETTINGS" <<EOF
    <?xml version="1.0" encoding="utf-8"?>
    <RunSettings>
      <DataCollectionRunSettings>
        <DataCollectors>
          <DataCollector friendlyName="XPlat Code Coverage">
            <Configuration>
              <Format>${COVER_FORMAT}</Format>
              <Include>[*]*</Include>
              <ExcludeByAttribute>Obsolete,GeneratedCode,CompilerGenerated</ExcludeByAttribute>
              <ExcludeByFile>**/Migrations/**</ExcludeByFile>
            </Configuration>
          </DataCollector>
        </DataCollectors>
      </DataCollectionRunSettings>
    </RunSettings>
    EOF
      echo "Coverlet runsettings ($COVER_FORMAT):"
      cat "$RUNSETTINGS"
    fi

    TEST_PROJECTS=(
    #   "$ROOT/SadganShared/3_ClientLibrary/src/Sadgan.Shared.Client.Tests/Sadgan.Shared.Client.MockTests.csproj"
    #   "$ROOT/SadganShared/3_ClientLibrary/src/Sadgan.Shared.Client.Tests/Sadgan.Shared.Client.ServerTests.csproj"
      "$ROOT/SadganErp/Sadgan.Erp.Panel/src/Sadgan.Erp.Panel.Tests/Sadgan.Erp.Panel.Api.Tests.csproj"
    )

    FAILED=0
    for PROJ in "${TEST_PROJECTS[@]}"; do
      NAME="$(basename "$PROJ" .csproj)"
      echo "========== $NAME =========="
      dotnet build "$PROJ" --configuration "$CFG" --no-restore

      TEST_ARGS=(
        --configuration "$CFG"
        --no-build
        --logger "trx;LogFileName=${NAME}.trx"
        --results-directory "$RESULTS_DIR"
      )
      # if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
      #   COVER_OUT="$RESULTS_DIR/coverage/$NAME/"
      #   mkdir -p "$COVER_OUT"
      #   TEST_ARGS+=(
      #     /p:CollectCoverage=true
      #     /p:CoverletOutputFormat=opencover
      #     /p:CoverletOutput="$COVER_OUT"
      #   )
      # fi
      if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
        if [ "$COVER_FORMAT" = "cobertura" ]; then
          COVER_OUT="$RESULTS_DIR/coverage/$NAME/"
          mkdir -p "$COVER_OUT"
          TEST_ARGS+=(
            /p:CollectCoverage=true
            /p:CoverletOutputFormat=cobertura
            /p:CoverletOutput="$COVER_OUT"
            # Include/ExcludeByFile live in Sadgan.Erp.Panel.Api.Tests.csproj (avoid /p:Include overriding with [Sadgan.Erp*]*).
          )
        else
          TEST_ARGS+=(
            --collect:"XPlat Code Coverage"
            --settings "$RUNSETTINGS"
          )
        fi
      fi


      if ! dotnet test "$PROJ" "${TEST_ARGS[@]}"; then
        echo "##vso[task.logissue type=error]Test project failed: $NAME"
        FAILED=1
      fi
    done

    echo "TRX files:"
    find "$RESULTS_DIR" -name '*.trx' -type f -ls || true
    if [ "$COVERAGE" = "true" ] || [ "$COVERAGE" = "True" ]; then
      # find "$RESULTS_DIR/coverage" -name 'coverage.opencover.xml' -type f -ls || true
      # find "$RESULTS_DIR/coverage" -name 'coverage.*.xml' -type f -ls || true
      echo "Coverage files:"
      find "$RESULTS_DIR" -name "coverage.${COVER_FORMAT}.xml" -type f -ls || true
      find "$RESULTS_DIR/coverage" -name "coverage.${COVER_FORMAT}.xml" -type f -ls 2>/dev/null || true
      if ! find "$RESULTS_DIR" \( -name "coverage.${COVER_FORMAT}.xml" -o -path "*/coverage/*" -name "coverage.${COVER_FORMAT}.xml" \) -type f | grep -q .; then
        echo "##vso[task.logissue type=warning]No coverage.${COVER_FORMAT}.xml files found — Sonar/Azure coverage will stay empty."
      fi
    fi

    if [ "$FAILED" -ne 0 ]; then
      exit 1
    fi
  displayName: 'Run frontend tests'
