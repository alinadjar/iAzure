parameters:
- name: TARGET_CHANNEL
  displayName: "Promote from/to:"
  type: string
  values:
      - dev_to_alpha
      - alpha_to_beta
      - beta_to_master
- name: VERSION
  displayName: "Target Version"
  type: string
  default: '0.0.0'
- name: ProjPath
  displayName: "Proj Path"
  type: string  
- name: Collection
  type: string  
- name: Repo
  displayName: "Repo"
  type: string  
- name: BranchName
  displayName: "Branch Name"
  type: string  
- name: side
  type: string
  values:
    - frontend
    - backend



steps:
- checkout: none

- task: Bash@3
  name: init
  displayName: 'init: '
  env:
    VERSION_INPUT: ${{ parameters.VERSION }}
    TARGET_CHANNEL: ${{ parameters.TARGET_CHANNEL }}
  inputs:
    targetType: 'inline'
    script: |
      SOURCE_BRANCH=$(echo "$TARGET_CHANNEL" | cut -d_ -f1)
      TARGET_BRANCH=$(echo "$TARGET_CHANNEL" | cut -d_ -f3)
      
      echo "SOURCE_BRANCH: $SOURCE_BRANCH"
      echo "TARGET_BRANCH: $TARGET_BRANCH"
      echo "VERSION_INPUT: $VERSION_INPUT"
      
      if [ $VERSION_INPUT == "0.0.0"  ]; then
          echo "❌ Version is required !"
          exit 1
      fi

      echo "##vso[task.setvariable variable=SOURCE_BRANCH;isOutput=true]$SOURCE_BRANCH"
      echo "##vso[task.setvariable variable=TARGET_BRANCH;isOutput=true]$TARGET_BRANCH"
      echo "##vso[task.setvariable variable=VERSION_INPUT;isOutput=true]$VERSION_INPUT"


- bash: |
    # Test URL accessibility
    COLLECTION="${{ parameters.Collection }}"
    PROJECT="Sadgan.Erp.Panel" 
    REPO="Sadgan.Erp.Panel"
    
    TEST_URL="http://azure.sadgan.int/WebApp/$COLLECTION/$PROJECT/_git/CICD"
    
    echo "Testing URL: $TEST_URL"
    
    # Test with curl to see the response
    curl -I -k -H "Authorization: bearer $(System.AccessToken)" "$TEST_URL"        

    echo "=== Debug Information ==="
    echo "System.AccessToken length: ${#SYSTEM_ACCESSTOKEN}"
    echo "System.AccessToken first 10 chars: ${SYSTEM_ACCESSTOKEN:0:10}..."
    

    git config --global http.sslVerify false
    git config --global --add safe.directory '*'
    
    COLLECTION="${{ parameters.Collection }}"
    PROJECT="Sadgan.Erp.Panel"
    
    # Method 1: Embedded credentials in URL (works best for Azure DevOps Server)
    echo "=== Cloning with embedded credentials ==="
    git clone --single-branch --branch "cicd" \
        "http://S_Bot_Azure:$(System.AccessToken)@azure.sadgan.int/WebApp/$COLLECTION/$PROJECT/_git/CICD" \
        "$(System.DefaultWorkingDirectory)/CICD_test"


    git clone --single-branch --branch "cicd" \
        "http://S_Bot_Azure:$(System.AccessToken)@azure.sadgan.int/WebApp/SadganErp/_git/CICD" \
        "$(System.DefaultWorkingDirectory)/CICD_xxx"    
    
    if [ $? -eq 0 ]; then
        echo "✅ Clone successful!"
    else
        echo "❌ Clone failed with embedded credentials"
        exit 1
    fi    
    echo "=== Test complete ==="
  displayName: 'Debug Repository URLs'
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)






