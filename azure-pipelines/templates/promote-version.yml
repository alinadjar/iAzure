- bash: |
    set -e
    echo "username:S_Bot_Azure" >> ~/.git-credentials
    echo "password:$(System.AccessToken)" >> ~/.git-credentials

    # Configure Git
    git config --global credential.helper store
    git config --global credential.useHttpPath true
    git config --global user.email "S_Bot_Azure@sadgan.int"
    git config --global user.name "S_Bot_Azure"
    git config --global http.sslVerify false
    git config --global --add safe.directory '*'
    git config --global core.compression 0
    git config --global http.postBuffer 1048576000
    git config --global pack.threads 1
    git config --global pull.rebase false
    
    
    BASE_URL="http://$(System.AccessToken)@azure.sadgan.int/WebApp"
    
    function clone_or_pull {
        branch_name=$1
        repo_url=$2
        target_dir=$3
    
        echo "$repo_url" > ~/.git-credentials

        echo "Cleaning up previous checkout ($target_dir)..."
        if [ -d "$target_dir" ]; then
            echo "Removing directory..."
            rm -rf "$target_dir"
        fi
    
  
        echo "Cloning $target_dir from branch $branch_name..."
        
  
        # Clone using environment variable for credentials
        echo "Cloning $repo_url (branch: $branch_name) into $target_dir..."
        # git clone --branch "$branch_name" "$repo_url" "$target_dir"

        git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" clone --single-branch --branch "$branch_name"     "$repo_url"    "$target_dir"
            
              
        if [ $? -eq 0 ] && [ -d "$target_dir/.git" ]; then
            cd "$target_dir"
            echo "Current directory: $pwd"
            echo "✅ Repository cloned to: $target_dir"
            echo "📁 Directory contents:"
            ls -la
        else
            echo "❌ Clone failed"
            exit 1
        fi
    }     

    # git clone --single-branch --branch "cicd" "http://S_Bot_Azure:$(System.AccessToken)@azure.sadgan.int/WebApp/$COLLECTION/$PROJECT/_git/CICD"     "$(System.DefaultWorkingDirectory)/CICD"


    clone_or_pull  "${{ parameters.BranchName }}"  "$BASE_URL/${{ parameters.Collection }}/_git/CICD"  "$(System.DefaultWorkingDirectory)/CICD"    
    clone_or_pull  $(init.TARGET_BRANCH)           "$BASE_URL/${{ parameters.Repo }}"                  "$(System.DefaultWorkingDirectory)/${{ parameters.ProjPath }}/$(init.TARGET_BRANCH)" 
    clone_or_pull  $(init.SOURCE_BRANCH)           "$BASE_URL/${{ parameters.Repo }}"                  "$(System.DefaultWorkingDirectory)/${{ parameters.ProjPath }}/$(init.SOURCE_BRANCH)"
    # git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" clone --single-branch --branch "alpha" "http://$(System.AccessToken)@azure.sadgan.int/WebApp/DevOps/_git/WinSetup"      
                  
    
    echo "Final directory structure:"
    ls -R | head -15
  displayName: 'Git Checkout'
  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)


- task: Bash@3
  displayName: 'Verify Version'
  env:
    TARGET_CHANNEL: ${{ parameters.TARGET_CHANNEL }}
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  inputs:
    targetType: 'inline'
    script: |
      echo "======== TARGET_CHANNEL: $TARGET_CHANNEL"
      compare_versions() {
            local v1="$1" v2="$2"
        
            # 1. Strip leading “v” (case‑insensitive) & validate
            for v in v1 v2; do
                local val=${!v}
                [[ $val =~ ^[vV]?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
                    echo "Error – $val is not a valid semantic version (vMAJOR.MINOR.PATCH)" >&2
                    return 3
                }
                # Save only the numeric parts
                eval "${v}=(${BASH_REMATCH[1]} ${BASH_REMATCH[2]} ${BASH_REMATCH[3]})"
            done
        
            # 2. Compare major, then minor, then patch
            local i
            for i in 0 1 2; do
                if    (( v1[i] > v2[i] )); then printf "%s > %s\n" "$v1" "$v2"; return 1
                elif (( v1[i] < v2[i] )); then printf "%s < %s\n" "$v1" "$v2"; return 2
                fi
            done
        
            # 3. All components equal
            printf "%s == %s\n" "$v1" "$v2"
            return 0
      }
      
      json_file="$(System.DefaultWorkingDirectory)/CICD/branch-versions/${{ parameters.side }}/version.$(init.TARGET_BRANCH).json"
      #  echo $json_file
      IFS=, read -r major minor patch < <(
        jq -r '.major + "," + .minor + "," + .patch' "$json_file"
      )
      baseVersion="v$major.$minor.$patch"
      inputVersion="$(init.VERSION_INPUT)"
      VERSION=${inputVersion:-0.0.0}
      if ! [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
        echo "VERSION '$VERSION' is not a valid semantic version" >&2
        exit 1
      fi
      _MAJOR="${BASH_REMATCH[1]}"
      _MINOR="${BASH_REMATCH[2]}"
      _PATCH="${BASH_REMATCH[3]}"
      echo "_MAJOR= $_MAJOR"
      echo "inputVersion = $inputVersion"
      SOURCE_BRANCH="$(init.SOURCE_BRANCH)"
        
      # 0) ensure inputVersion already exists on source branch:
      if [[ "$SOURCE_BRANCH" != "dev" && "$SOURCE_BRANCH" != "4_dev" && "$SOURCE_BRANCH" != "developweb1" ]]; then
        echo "=================================>> $inputVersion-$SOURCE_BRANCH*"
        cd "${{ parameters.ProjPath }}"/$SOURCE_BRANCH
        pwd
        git tag -l | xargs git tag -d && git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" fetch --tags
        TAGS=$(git tag -l "v$inputVersion-$SOURCE_BRANCH*")
        LAST_TAG=$(git tag -l "v$inputVersion-$SOURCE_BRANCH*" | sort -V | tail -n1)
        echo "LAST_TAG = $LAST_TAG"
        if [[ -z "$LAST_TAG" ]]; then
            echo "❌ Version not exists on source branch !!!"
            exit 1
        fi
      fi
        
      # 1) verify the input version to be not lower than target branch version
      if compare_versions "$baseVersion" "$inputVersion"; then # in case versions are equal
        echo "EQUAL: input version matches base version;"
      elif [[ $? -eq 1 ]]; then # in case inputVersion is lower
        echo "❌ Version cannot be lower than baseVesion !!!"
        exit 1
      fi
        
        
      # 2) create pr and perform merge using the bot user account
      # ---
      # 3) apply version to target channel
      cat > "$json_file" <<EOF
          {
              "major": "$_MAJOR",
              "minor": "$_MINOR",
              "patch": "$_PATCH"
          }
      EOF
       #  Commit & push if the file changed
       cd $(System.DefaultWorkingDirectory)/CICD/
       git status
       if git diff --quiet -- "$json_file"; then
         echo "No changes to $json_file – nothing committed."
       else
         # git config --local user.email "ci-build@example.com"
         # git config --local user.name  "CI Build"
         git add "$json_file"
         git commit -m "[BOT] $(init.SOURCE_BRANCH) --> $(init.TARGET_BRANCH) : version promoted to v$inputVersion by ${{ variables['Build.RequestedFor'] }}"
         git -c http.extraheader="AUTHORIZATION: bearer $(System.AccessToken)" push origin HEAD
       fi
