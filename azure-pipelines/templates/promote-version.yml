parameters:
- name: TARGET_CHANNEL
  displayName: "Promote from/to:"
  type: string
  values:
      - dev_to_alpha
      - alpha_to_beta
      - beta_to_master
- name: VERSION
  displayName: "Target Version"
  type: string
  default: '0.0.0'
- name: ProjPath
  displayName: "Proj Path"
  type: string     
- name: side
  type: string
  values:
    - frontend
    - backend



steps:
- task: Bash@3
  displayName: 'Verify Version'
  env:
    TARGET_CHANNEL: ${{ parameters.TARGET_CHANNEL }}
  inputs:
    targetType: 'inline'
    script: |
      echo "======== TARGET_CHANNEL: $TARGET_CHANNEL"
      compare_versions() {
            local v1="$1" v2="$2"
        
            # 1. Strip leading “v” (case‑insensitive) & validate
            for v in v1 v2; do
                local val=${!v}
                [[ $val =~ ^[vV]?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
                    echo "Error – $val is not a valid semantic version (vMAJOR.MINOR.PATCH)" >&2
                    return 3
                }
                # Save only the numeric parts
                eval "${v}=(${BASH_REMATCH[1]} ${BASH_REMATCH[2]} ${BASH_REMATCH[3]})"
            done
        
            # 2. Compare major, then minor, then patch
            local i
            for i in 0 1 2; do
                if    (( v1[i] > v2[i] )); then printf "%s > %s\n" "$v1" "$v2"; return 1
                elif (( v1[i] < v2[i] )); then printf "%s < %s\n" "$v1" "$v2"; return 2
                fi
            done
        
            # 3. All components equal
            printf "%s == %s\n" "$v1" "$v2"
            return 0
      }
      
      json_file="$(System.DefaultWorkingDirectory)/CICD/branch-versions/${{ parameters.side }}/version.$(init.TARGET_BRANCH).json"
      #  echo $json_file
      IFS=, read -r major minor patch < <(
        jq -r '.major + "," + .minor + "," + .patch' "$json_file"
      )
      baseVersion="v$major.$minor.$patch"
      inputVersion="$(init.VERSION_INPUT)"
      VERSION=${inputVersion:-0.0.0}
      if ! [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
        echo "VERSION '$VERSION' is not a valid semantic version" >&2
        exit 1
      fi
      _MAJOR="${BASH_REMATCH[1]}"
      _MINOR="${BASH_REMATCH[2]}"
      _PATCH="${BASH_REMATCH[3]}"
      echo "_MAJOR= $_MAJOR"
      echo "inputVersion = $inputVersion"
      SOURCE_BRANCH="$(init.SOURCE_BRANCH)"
        
      # 0) ensure inputVersion already exists on source branch:
      if [[ "$SOURCE_BRANCH" != "dev" && "$SOURCE_BRANCH" != "4_dev" && "$SOURCE_BRANCH" != "developweb1" ]]; then
        echo "=================================>> $inputVersion-$SOURCE_BRANCH*"
        cd "${{ parameters.ProjPath }}"/$SOURCE_BRANCH
        pwd
        git tag -l | xargs git tag -d && git fetch --tags
        TAGS=$(git tag -l "v$inputVersion-$SOURCE_BRANCH*")
        LAST_TAG=$(git tag -l "v$inputVersion-$SOURCE_BRANCH*" | sort -V | tail -n1)
        echo "LAST_TAG = $LAST_TAG"
        if [[ -z "$LAST_TAG" ]]; then
            echo "❌ Version not exists on source branch !!!"
            exit 1
        fi
      fi
        
      # 1) verify the input version to be not lower than target branch version
      if compare_versions "$baseVersion" "$inputVersion"; then # in case versions are equal
        echo "EQUAL: input version matches base version;"
      elif [[ $? -eq 1 ]]; then # in case inputVersion is lower
        echo "❌ Version cannot be lower than baseVesion !!!"
        exit 1
      fi
        
        
      # 2) create pr and perform merge using the bot user account
      # ---
      # 3) apply version to target channel
      cat > "$json_file" <<EOF
          {
              "major": "$_MAJOR",
              "minor": "$_MINOR",
              "patch": "$_PATCH"
          }
      EOF
       #  Commit & push if the file changed
       cd $(System.DefaultWorkingDirectory)/CICD/
       git status
       if git diff --quiet -- "$json_file"; then
         echo "No changes to $json_file – nothing committed."
       else
         # git config --local user.email "ci-build@example.com"
         # git config --local user.name  "CI Build"
         git add "$json_file"
         git commit -m "[BOT] $(init.SOURCE_BRANCH) --> $(init.TARGET_BRANCH) : version promoted to v$inputVersion at ${{ parameters.side }} by ${{ variables['Build.RequestedFor'] }}"
         git push origin HEAD
       fi
