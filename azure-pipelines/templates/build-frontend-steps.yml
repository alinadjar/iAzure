parameters:
- name: SHOULD_RELEASE
  type: string
- name: BRANCH
  type: string
- name: isBranchDevelop
  type: string
- name: isBranchDevOps
  type: string
- name: COMMIT_HASH
  type: string  

steps:
- task: Bash@3
  name: tagSetting
  displayName: 'Version Assign (Frontend)'
  env:
    SHOULD_RELEASE: ${{ parameters.SHOULD_RELEASE }}
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  inputs:
    targetType: 'inline'
    script: |
      ls -alh
      CUR_BRANCH="${{ parameters.BRANCH }}"
      echo "User name: $(Build.RequestedFor)"
      echo "User ID: $(Build.RequestedForId)"
      
      compare_versions() {
            local v1="$1" v2="$2"
        
            # 1. Strip leading “v” (case‑insensitive) & validate
            for v in v1 v2; do
                local val=${!v}
                [[ $val =~ ^[vV]?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
                    echo "Error – $val is not a valid semantic version (vMAJOR.MINOR.PATCH)" >&2
                    return 3
                }
                # Save only the numeric parts
                eval "${v}=(${BASH_REMATCH[1]} ${BASH_REMATCH[2]} ${BASH_REMATCH[3]})"
            done
        
            # 2. Compare major, then minor, then patch
            local i
            for i in 0 1 2; do
                if    (( v1[i] > v2[i] )); then printf "%s > %s\n" "$v1" "$v2"; return 1
                elif (( v1[i] < v2[i] )); then printf "%s < %s\n" "$v1" "$v2"; return 2
                fi
            done
        
            # 3. All components equal
            printf "%s == %s\n" "$v1" "$v2"
            return 0
      }
      
      # ------------------------------------------------------------------
      #  Extract Version & Perform Sanity check
      # ------------------------------------------------------------------
      if [ "${{ parameters.isBranchDevelop }}" == "True" -o  "${{ parameters.isBranchDevOps }}" == "True" ]; then
        NEW_TAG=$( [ "${{ parameters.isBranchDevelop }}" = true ] && echo "latest-dev" || echo "v0.0.0.0" )
        echo "Using tag: $NEW_TAG"
        echo "##vso[task.setvariable variable=FQIN;isOutput=true]$(DOCKER_IMG):$NEW_TAG"
        echo "##vso[task.setvariable variable=DOCKER_TAG;isOutput=true]$NEW_TAG"
                          
        cat <<EOF > $(Build.ArtifactStagingDirectory)/vars.json
          {
            "FQIN": "$(DOCKER_IMG):$NEW_TAG",
            "DOCKER_TAG": "$NEW_TAG",
            "CREATE_RELEASE": ${{ parameters.SHOULD_RELEASE }},
            "BRANCH": "$CUR_BRANCH"
          }
      EOF
      else
        json_file="$(System.DefaultWorkingDirectory)/$(versionConfigPath)/version.$CUR_BRANCH.json"
        echo "Reading version from: $json_file"
        IFS=, read -r major minor patch < <(
          jq -r '.major + "," + .minor + "," + .patch' "$json_file"
        )
      
        baseVersion="v$major.$minor.$patch"
        echo "baseVersion: $baseVersion"
          
        cd "$(baseProjPath)"
        git tag -l | xargs git tag -d && git fetch --tags
        TAGS=$(git tag -l "${baseVersion}-$CUR_BRANCH*")
        LAST_TAG=$(git tag -l "${baseVersion}-$CUR_BRANCH.*" | sort -V | tail -n1)
        echo "LAST_TAG = $LAST_TAG"
        if [[ -z "$LAST_TAG" ]]; then
            echo "⚠️  No tag found matching '$baseVersion-$CUR_BRANCH.*'"
            _MAJOR=$major
            _MINOR=$minor
            _PATCH=$patch
            _PRE=$CUR_BRANCH
            _BN=0
        else
            IFS='.-' read -r _MAJOR _MINOR _PATCH _PRE _BN <<< "${LAST_TAG#v}"
        fi
        LAST_TAG="v$_MAJOR.$_MINOR.$_PATCH-$_PRE.$_BN"
        echo "LAST_TAG = $LAST_TAG"
        lastTagVersion="v$_MAJOR.$_MINOR.$_PATCH"
        echo "lastTagVersion: $lastTagVersion"
        
        if compare_versions "$lastTagVersion" "$baseVersion"; then # in case versions are equal
          echo "input version matches base version; so increasing build number:"
          _BN=$((_BN + 1))
          NEW_TAG="v$_MAJOR.$_MINOR.$_PATCH-$CUR_BRANCH.$_BN"
        elif [[ $? -eq 1 ]]; then # in case baseVersion is lower
          echo "WRONG! base version cannot be lower than previously released version!"
          exit 1
        else # baseVersion is upper
          NEW_TAG="v$major.$minor.$patch-$CUR_BRANCH.1"
        fi
        
        echo "new tag is: $NEW_TAG"
        cd "$(baseProjPath)"
        if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
          echo "Tag $NEW_TAG already exists!"
          echo "##vso[task.setvariable variable=isTagDuplicate]true"
          exit 0
        else
          echo "##vso[task.setvariable variable=FQIN;isOutput=true]$(DOCKER_IMG):$NEW_TAG"
          echo "##vso[task.setvariable variable=DOCKER_TAG;isOutput=true]$NEW_TAG"
          cat <<EOF > $(Build.ArtifactStagingDirectory)/vars.json
            {
              "FQIN": "$(DOCKER_IMG):$NEW_TAG",
              "DOCKER_TAG": "$NEW_TAG",
              "CREATE_RELEASE": ${{ parameters.SHOULD_RELEASE }},
              "BRANCH": "$CUR_BRANCH"
            }
      EOF
        fi
      fi

      # Export the tag as a job output variable for the final tagging job
      echo "##vso[task.setvariable variable=FRONTEND_TAG;isOutput=true]$(DOCKER_TAG)"
      echo "##vso[task.setvariable variable=FRONTEND_FQIN;isOutput=true]$(FQIN)"

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'front-build-vars'
    publishLocation: 'Container'
  condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))


- bash: |
        ls -alh 
        configPropsFile="$(System.DefaultWorkingDirectory)/SadganShared/1_Configs/Directory.Packages.props"
    
        if [ "$(isBranchDevelop)" == "True" -o "$(isBranchDevOps)" = "True" ]; then
          new_assembly_version="0.0.0.0"
        else
          assembly_version=$(awk -F '[<>]' '/<AssemblyVersion>/ {print $3}' $configPropsFile)
          tag_version="$(tagSetting.DOCKER_TAG)"
          tag_version="${tag_version#v}"
          
          # Simple solution: extract all numbers and join with dots
          new_assembly_version=$(echo "$tag_version" | grep -oE '[0-9]+' | head -4 | paste -sd '.' -)
          
          # If we don't have 4 numbers, pad with zeros
          if [ -z "$new_assembly_version" ]; then
            new_assembly_version="0.0.0.0"
          else
            # Count how many numbers we have
            num_count=$(echo "$new_assembly_version" | tr -cd '.' | wc -c)
            num_count=$((num_count + 1))
            
            # Pad to 4 numbers
            while [ $num_count -lt 4 ]; do
              new_assembly_version="${new_assembly_version}.0"
              num_count=$((num_count + 1))
            done
          fi
        fi
    
        echo "current assembly version $assembly_version is changing to $new_assembly_version"
        sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>$new_assembly_version</AssemblyVersion>|" $configPropsFile
  condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false')) 
  displayName: 'Assembly Version Set'


