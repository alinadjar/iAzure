# Create global NuGet.Config
- bash: |
    # Nuget SSL
    echo "##vso[task.setvariable variable=NUGET_SSL_VERIFY]false"    

    sudo mkdir -p /usr/share
    echo '<?xml version="1.0" encoding="utf-8"?>
    <configuration>
      <packageSources>
        <clear />
        <add key="NupkgWeb2" value="http://192.168.10.118/WebApp/_packaging/NupkgWeb2/nuget/v3/index.json" allowInsecureConnections="true" />
      </packageSources>
      <packageSourceCredentials>
        <NupkgWeb2>
          <add key="Username" value="S_Bot_Azure" />
          <add key="ClearTextPassword" value="$(BOT_TOKEN)" />
        </NupkgWeb2>
      </packageSourceCredentials>
    </configuration>' | sudo tee /usr/share/NuGet.Config > /dev/null

    # Remove project-specific NuGet.Config files
    find $(Build.SourcesDirectory) -name "NuGet.Config" -type f -delete

    ls -l /usr/share/NuGet.Config
    cat /usr/share/NuGet.Config
  displayName: 'Create global NuGet.Config (Frontend)'
  condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))
  env:
    BOT_TOKEN: $(BOT_TOKEN)

# .Net Restore
- bash: |
    export PATH="/opt/net_sdk_10:$PATH"
    
    dotnet restore "$(solution)" --configfile /usr/share/NuGet.Config # --verbosity detailed
  displayName: 'Dotnet Restore (Frontend)'
  condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))

# Fetch Release Notes (Frontend only)
- task: Bash@3
  displayName: 'Fetch Release Notes'
  env:
    wikiPat: $(System.AccessToken)
  inputs:
    targetType: 'inline'
    script: |
      encoded_path=$(echo "/Release Notes" | sed 's|^/||' | sed 's/ /%20/g' | sed 's/#/%23/g')
      echo "encoded_path = $encoded_path"
      response=$(curl -s -u ":$wikiPat" "$(orgUrl)/$(project)/_apis/wiki/wikis/$(wikiId)/pages?path=$encoded_path&api-version=7.0&recursionLevel=full")
      echo $response
      
      # Check if response is valid
      if [ $? -ne 0 ] || [ -z "$response" ]; then
        echo "Error: Failed to get response from Azure DevOps API"
        exit 1
      fi

      # Check if Release Notes exists and has subpages
      if ! echo "$response" | jq -e '.subPages' > /dev/null 2>&1; then
        echo "Error: Release Notes page not found or has no subpages"
        echo "Response:"
        echo "$response" | jq .
        exit 1
      fi

      # Extract subpages from Release Notes
      subpages=$(echo "$response" | jq -c '.subPages[]?')
      
      if [ -z "$subpages" ]; then
        echo "No subpages found under Release Notes"
        echo "Response structure:"
        echo "$response" | jq .
        exit 0
      fi

      echo "Subpages found under Release Notes:"
      echo "$subpages" | jq -r '.path'

      TARGET_WWWROOT="$(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Panel/src/Sadgan.Erp.Panel.WebApp/wwwroot/assets/changelogs"
      mkdir -p "$TARGET_WWWROOT"
      
      # Download each subpage
      echo "$subpages" | while read -r subpage; do
        page_path=$(echo "$subpage" | jq -r '.path')
        echo "Processing: $page_path"
        
        # URL encode the path (remove leading slash and encode)
        encoded_path=$(echo "$page_path" | sed 's|^/||' | sed 's/ /%20/g' | sed 's/#/%23/g')
        page_content=$(curl -s -u ":$wikiPat" "$(orgUrl)/$(project)/_apis/wiki/wikis/$(wikiId)/pages?path=$encoded_path&includeContent=true&api-version=7.0")
        filename=$(basename "$page_path" | sed 's/ /_/g' | sed 's/\.md$//')
        echo "$page_content" | jq -r '.content' > "$TARGET_WWWROOT/${filename}.md"
        
        echo "==== Downloaded: ${filename}.md"
      done
      
      ls -la $TARGET_WWWROOT
  condition: and(succeeded(), eq(variables['isTagDuplicate'], 'false'))

