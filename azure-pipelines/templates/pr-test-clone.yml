parameters:
- name: profile
  type: string
  # backend | frontend
- name: branch
  type: string
  default: dev
  # Used for manual runs and non-PR triggers (CI push to dev, etc.)

steps:
- bash: |
    set -euo pipefail

    BUILD_REASON="$(Build.Reason)"
    IS_PR=false
    if [ "$BUILD_REASON" = "PullRequest" ]; then
      IS_PR=true
    fi

    mkdir -p "$GIT_HOME"
    export GIT_CONFIG_GLOBAL="$(GIT_CONFIG_GLOBAL)"

    git config --file "$GIT_CONFIG_GLOBAL" user.email "S_Bot_Azure@sadgan.int"
    git config --file "$GIT_CONFIG_GLOBAL" user.name "S_Bot_Azure"
    git config --file "$GIT_CONFIG_GLOBAL" http.extraHeader "Authorization: Basic $(echo -n "PAT:$(GIT_PAT)" | base64)"
    git config --file "$GIT_CONFIG_GLOBAL" http.sslVerify false
    git config --file "$GIT_CONFIG_GLOBAL" --add safe.directory '*'

    BASE_URL="http://$(GIT_PAT)@azure.sadgan.int/WebApp"
    APP_REPO="$(Build.Repository.Name)"
    WORK_ROOT="$(System.DefaultWorkingDirectory)"
    SHARED_BRANCH="${{ parameters.branch }}"

    if [ "$IS_PR" = true ]; then
      PR_ID="$(System.PullRequest.PullRequestId)"
      SOURCE_BRANCH="${SYSTEM_PULLREQUEST_SOURCEBRANCH#refs/heads/}"
      SOURCE_COMMIT="${SYSTEM_PULLREQUEST_SOURCECOMMITID:-}"
      TARGET_BRANCH="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
      echo "PR #$PR_ID | source: $SOURCE_BRANCH | target: $TARGET_BRANCH | triggering repo: $APP_REPO"
      if [ "$TARGET_BRANCH" != "dev" ] && [[ ! "$TARGET_BRANCH" =~ ^wit/ ]]; then
        echo "Unsupported PR target branch: $TARGET_BRANCH (expected dev or wit/*)"
        exit 1
      fi
      DEPENDENCY_FALLBACK_BRANCH="dev"
    else
      echo "Non-PR run (Build.Reason=$BUILD_REASON): cloning @ branch $SHARED_BRANCH"
    fi

    # On PR: use PR source branch name on each dependency repo when that branch exists; else dev.
    pick_clone_branch() {
      local remote_url="$1"
      local repo_label="$2"
      if [ "$IS_PR" != true ]; then
        echo "$SHARED_BRANCH"
        return 0
      fi
      if git ls-remote --heads "$remote_url" "refs/heads/${SOURCE_BRANCH}" | grep -q .; then
        echo "$SOURCE_BRANCH"
        return 0
      fi
      echo "##vso[task.logissue type=warning]${repo_label}: no branch ${SOURCE_BRANCH} — cloning ${DEPENDENCY_FALLBACK_BRANCH} instead."
      echo "$DEPENDENCY_FALLBACK_BRANCH"
    }

    clone_shared() {
      local repo_path="$1"
      local target_dir="$2"
      local remote="$BASE_URL/SadganShared/_git/$repo_path"
      local branch_name
      branch_name="$(pick_clone_branch "$remote" "SadganShared/$repo_path")"

      echo "Cloning SadganShared/$repo_path @ $branch_name ..."
      rm -rf "$target_dir"
      git clone --branch "$branch_name" "$remote" "$target_dir"
    }

    clone_erp_dependency() {
      local repo_name="$1"
      local target_dir="$2"
      local remote="$BASE_URL/SadganErp/_git/$repo_name"
      local branch_name
      branch_name="$(pick_clone_branch "$remote" "SadganErp/$repo_name")"

      echo "Cloning SadganErp/$repo_name @ $branch_name ..."
      rm -rf "$target_dir"
      git clone --branch "$branch_name" "$remote" "$target_dir"
    }

    clone_app_pr_source() {
      local repo_name="$1"
      local target_dir="$2"

      echo "Cloning SadganErp/$repo_name @ PR source branch ($SOURCE_BRANCH), not target ($TARGET_BRANCH) ..."
      rm -rf "$target_dir"
      git clone "$BASE_URL/SadganErp/_git/$repo_name" "$target_dir"
      cd "$target_dir"
      if [ -n "$SOURCE_COMMIT" ]; then
        echo "Checking out PR source commit: $SOURCE_COMMIT"
        if ! git fetch origin "$SOURCE_COMMIT"; then
          echo "Could not fetch source commit $SOURCE_COMMIT"
          exit 1
        fi
        git checkout FETCH_HEAD
      elif ! git fetch origin "refs/heads/${SOURCE_BRANCH}"; then
        echo "Could not fetch refs/heads/${SOURCE_BRANCH}; trying refs/pull/${PR_ID}/source ..."
        if ! git fetch origin "refs/pull/${PR_ID}/source"; then
          echo "Could not fetch PR source (branch or refs/pull/${PR_ID}/source). Failing PR validation."
          exit 1
        fi
        git checkout FETCH_HEAD
      else
        git checkout FETCH_HEAD
      fi
      echo "App commit under test (PR source): $(git rev-parse --short HEAD) on branch $SOURCE_BRANCH"
      cd "$WORK_ROOT"
    }

    clone_app_branch() {
      local repo_name="$1"
      local branch_name="$2"
      local target_dir="$3"

      echo "Cloning SadganErp/$repo_name @ $branch_name ..."
      rm -rf "$target_dir"
      git clone --branch "$branch_name" "$BASE_URL/SadganErp/_git/$repo_name" "$target_dir"
      echo "App commit under test: $(git -C "$target_dir" rev-parse --short HEAD)"
    }

    clone_shared "1_Configs" "$WORK_ROOT/SadganShared/1_Configs"
    clone_shared "2_SharedLibrary" "$WORK_ROOT/SadganShared/2_SharedLibrary"

    if [ "${{ parameters.profile }}" = "frontend" ]; then
      clone_shared "3_ClientLibrary" "$WORK_ROOT/SadganShared/3_ClientLibrary"
      clone_shared "4_ServerLibrary" "$WORK_ROOT/SadganShared/4_ServerLibrary"
      if [ "$IS_PR" = true ]; then
        if [ "$APP_REPO" != "Sadgan.Erp.Panel" ]; then
          echo "Frontend PR test must run from Sadgan.Erp.Panel repository (got $APP_REPO)."
          exit 1
        fi
        clone_app_pr_source "Sadgan.Erp.Panel" "$WORK_ROOT/SadganErp/Sadgan.Erp.Panel"
      else
        clone_app_branch "Sadgan.Erp.Panel" "$SHARED_BRANCH" "$WORK_ROOT/SadganErp/Sadgan.Erp.Panel"
      fi
      clone_erp_dependency "Sadgan.Erp.Client.Core" "$WORK_ROOT/SadganErp/Sadgan.Erp.Client.Core"
    else
      clone_shared "4_ServerLibrary" "$WORK_ROOT/SadganShared/4_ServerLibrary"
      if [ "$IS_PR" = true ]; then
        if [ "$APP_REPO" != "SadganErpApi" ]; then
          echo "Backend PR test must run from SadganErpApi repository (got $APP_REPO)."
          exit 1
        fi
        clone_app_pr_source "SadganErpApi" "$WORK_ROOT/SadganErp/SadganErpApi"
      else
        clone_app_branch "SadganErpApi" "$SHARED_BRANCH" "$WORK_ROOT/SadganErp/SadganErpApi"
      fi
    fi

    echo "Checkout complete."
  displayName: 'Clone repos (PR source branch or branch tip)'
  env:
    GIT_PAT: $(GIT_PAT)
    GIT_CONFIG_GLOBAL: $(GIT_CONFIG_GLOBAL)
    GIT_HOME: $(GIT_HOME)

- bash: |
    set -euo pipefail
    echo "##vso[task.setvariable variable=NUGET_SSL_VERIFY]false"

    NUGET_CONFIG="$(Agent.TempDirectory)/NuGet.Config"
    mkdir -p "$(Agent.TempDirectory)"
    cat > "$NUGET_CONFIG" <<EOF
    <?xml version="1.0" encoding="utf-8"?>
    <configuration>
      <packageSources>
        <clear />
        <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
        <add key="NupkgWeb2" value="http://192.168.10.118/WebApp/_packaging/NupkgWeb2/nuget/v3/index.json" allowInsecureConnections="true" />
      </packageSources>
      <packageSourceCredentials>
        <NupkgWeb2>
          <add key="Username" value="S_Bot_Azure" />
          <add key="ClearTextPassword" value="$(BOT_TOKEN)" />
        </NupkgWeb2>
      </packageSourceCredentials>
    </configuration>
    EOF

    find "$(System.DefaultWorkingDirectory)" -name "NuGet.Config" -type f -delete
    echo "##vso[task.setvariable variable=NUGET_CONFIG_PATH]$NUGET_CONFIG"
  displayName: 'Create NuGet.Config'
  env:
    BOT_TOKEN: $(BOT_TOKEN)
