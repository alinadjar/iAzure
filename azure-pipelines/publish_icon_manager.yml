
trigger: none
pool:
  name: 'WEB-1'

parameters:
- name: CREATE_PR
  displayName: "Create PR to ERP?"
  type: string
  default: 'NO'
  values:
    - YES
    - NO



variables:
  - name: appName
    value: 'icon-manage'
  - name: orgUrl
    value: 'http://azure.sadgan.int/WebApp'
  - name: project
    value: 'SadganErp'
  - name: solution
    value: "$(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Icon_Manage"
  - name: DOCKER_IMG
    value: "$(DOCKER_REGISTRY)/iconLib"
  - name: GIT_CONFIG_GLOBAL
    value: $(Agent.TempDirectory)/gitconfig_$(Build.BuildId)_ico
  - name: GIT_HOME 
    value: $(Agent.TempDirectory)/home_$(Build.BuildId)_ico


steps:
- checkout: none
- bash: |
    set -e
    # Configure Git
    mkdir -p "$GIT_HOME"
     # Use isolated git config file (not global)
    export GIT_CONFIG_GLOBAL="$(GIT_CONFIG_GLOBAL)"

     # Configure Git with isolated config
    git config --file "$GIT_CONFIG_GLOBAL"  user.email "S_Bot_Azure@sadgan.int"
    git config --file "$GIT_CONFIG_GLOBAL"  user.name "S_Bot_Azure"
    git config --file "$GIT_CONFIG_GLOBAL"  http.extraHeader "Authorization: Basic $(echo -n "PAT:$(GIT_PAT)" | base64)"
    git config --file "$GIT_CONFIG_GLOBAL"  http.sslVerify false
    git config --file "$GIT_CONFIG_GLOBAL"  --add safe.directory '*'
    git config --file "$GIT_CONFIG_GLOBAL" core.compression 0
    git config --file "$GIT_CONFIG_GLOBAL" http.postBuffer 1048576000
    git config --file "$GIT_CONFIG_GLOBAL" pack.threads 1
    git config --file "$GIT_CONFIG_GLOBAL" pull.rebase false
    
    BASE_URL="http://$(GIT_PAT)@azure.sadgan.int/WebApp"
    
    function clone_or_pull {
        branch_name=$1
        repo_url=$2
        target_dir=$3
        
        echo "Cleaning up previous checkout ($target_dir)..."
        if [ -d "$target_dir" ]; then
            echo "Removing directory..."
            rm -rf "$target_dir"
        fi
        
        echo "Cloning $repo_url (branch: $branch_name) into $target_dir..."
        git clone --branch "$branch_name" "$repo_url" "$target_dir"
        
        if [ $? -eq 0 ] && [ -d "$target_dir/.git" ]; then
            cd "$target_dir"
            echo "Current directory: $(pwd)"
            echo "✅ Repository cloned to: $target_dir"
            echo "📁 Directory contents:"
            ls -la
        else
            echo "❌ Clone failed"
            exit 1
        fi
    }
    
    CUR_BRANCH="release"
    # CUR_BRANCH=$(echo "$(Build.SourceBranchName)" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
    clone_or_pull  "$CUR_BRANCH"  "$BASE_URL/SadganErp/_git/Sadgan.Erp.Icon_Manage"  "$(solution)"

    # Get frontend commit hash and export as output variable
    # cd "$(System.DefaultWorkingDirectory)/SadganErp/Sadgan.Erp.Icon_Manage"
    cd "$(solution)"
    FRONTEND_COMMIT=$(git rev-parse HEAD | cut -c1-8)
    echo "##vso[task.setvariable variable=FRONTEND_COMMIT;isOutput=true]$FRONTEND_COMMIT"
    echo "##vso[task.setvariable variable=COMMIT_HASH;isOutput=true]$FRONTEND_COMMIT"
    echo "Frontend commit: $FRONTEND_COMMIT"


    mkdir -p $(Build.ArtifactStagingDirectory)/ico
    TAG_NAME="latest"
    echo "Using tag: $TAG_NAME"
    echo "##vso[task.setvariable variable=FQIN;isOutput=true]$(DOCKER_IMG):$TAG_NAME"
    echo "##vso[task.setvariable variable=DOCKER_TAG;isOutput=true]$TAG_NAME"
    cat <<EOF > $(Build.ArtifactStagingDirectory)/ico/vars.json
          {
            "FQIN": "$(DOCKER_IMG):$TAG_NAME",
            "DOCKER_TAG": "$TAG_NAME",
            "BRANCH": "$CUR_BRANCH"
          }
    EOF
  displayName: "Git Checkout"
  name: gitPull
  env:
    GIT_PAT: $(GIT_PAT)
    GIT_CONFIG_GLOBAL: $(GIT_CONFIG_GLOBAL)
    GIT_HOME: $(GIT_HOME)


- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/ico/vars.json'
    ArtifactName: 'ico-vars'
    publishLocation: 'Container'
  condition: succeeded()


- bash: |
    cd "$(solution)"
  
    echo "$(NEXUS_DOCKER_PASSWORD)" | docker login $(DOCKER_REGISTRY) \
      -u $(NEXUS_DOCKER_USERNAME) \
      --password-stdin
  
    # S.O.S builds on Internet cut-off period in Iran:
    mkdir node_modules/
    cp -r /opt/node_modules_proj_IconLib/*  node_modules/
    docker build \
        -t $(gitPull.FQIN) \
        -f Dockerfile.sos \
        .
    docker push $(gitPull.FQIN)
    rm -rf node_modules/
    
  displayName: 'Build & Push Image'
  condition: succeeded()
  env:
    NEXUS_DOCKER_USERNAME: $(NEXUS_DOCKER_USERNAME)
    NEXUS_DOCKER_PASSWORD: $(NEXUS_DOCKER_PASSWORD)
    

