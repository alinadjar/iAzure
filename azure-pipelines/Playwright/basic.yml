    #     MINIO_BUCKET: $(MINIO_BUCKET)

    - task: PublishBuildArtifacts@1
      condition: always()
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/playwright-results-$(Build.BuildId).zip'
        artifactName: 'playwright-results-zip'
        artifactType: 'container'
      displayName: '📦 Publish ZIP Archive'

