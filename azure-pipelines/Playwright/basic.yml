    - script: |
        echo "================================================"
        echo "🎯 TEST EXECUTION COMPLETE"
        echo "================================================"
        echo "📊 Test Suite: ${{ parameters.Suite }}"
        echo "✅ Exit Code: $(RunTests.testExitCode)"
        
        if [ "$(RunTests.testExitCode)" -eq 0 ]; then
          echo "🏆 STATUS: ALL TESTS PASSED"
        else
