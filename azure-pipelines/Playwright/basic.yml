    #     ./mc alias set myminio $(MINIO_ENDPOINT) $(MINIO_ACCESS_KEY) $(MINIO_SECRET_KEY) --insecure
        
    #     # Test connection
    #     echo "🔌 Testing MinIO connection..."
    #     if ! ./mc ls myminio > /dev/null 2>&1; then
    #       echo "##vso[task.logissue type=warning]MinIO connection test failed, continuing anyway..."
    #     else
    #       echo "✅ MinIO connection successful"
    #     fi
        
    #     FILENAME="playwright-results-$(Build.BuildId).zip"
    #     FILE_PATH="$(Build.ArtifactStagingDirectory)/$FILENAME"
    #     FOLDER_PATH="FX/playwright-results/build-$(Build.BuildId)"
    #     BUCKET_PATH="$FOLDER_PATH/$FILENAME"
        
    #     echo "📤 Uploading: $FILENAME"
    #     echo "📁 MinIO Path: $(MINIO_BUCKET)/$BUCKET_PATH"
        
    #     # Create folder structure
    #     ./mc mb --ignore-existing "myminio/$(MINIO_BUCKET)/$FOLDER_PATH"
        
    #     # Upload with retry
    #     UPLOAD_RETRIES=3
    #     for i in $(seq 1 $UPLOAD_RETRIES); do
    #       echo "Upload attempt $i of $UPLOAD_RETRIES..."
