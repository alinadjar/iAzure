# test-trigger-pipeline.yml
trigger: none
pool:
  name: 'WEB-1'

parameters:
- name: CREATE_PR
  displayName: "Create PR ?"
  type: string
  default: 'NO'
- name: SHOULD_RELEASE
  type: string
  default: 'false'
- name: BRANCH
  type: string
  default: 'dev'

jobs:
- job: Test_All_Approaches
  displayName: '🧪 Test All Trigger Approaches'
  steps:
  - checkout: none
  
  - bash: |
      #!/bin/bash
      
      ORGANIZATION="${SYSTEM_TEAMFOUNDATIONCOLLECTIONURI}"
      PROJECT="${SYSTEM_TEAMPROJECT}"
      PIPELINE_ID="111"  # Test with backend first
      BRANCH="${{ parameters.BRANCH }}"
      CREATE_PR="${{ parameters.CREATE_PR }}"
      SHOULD_RELEASE="${{ parameters.SHOULD_RELEASE }}"
      
      # Repository GUIDs from diagnostic
      BACKEND_REPO_GUID="49a3a49b-79c3-4601-b22e-87e268e22ae7"
      BACKEND_REPO_NAME="SadganErpApi"
      
      FRONTEND_REPO_GUID="e64409f1-4ad5-4022-b859-71b07f18e860"
      FRONTEND_REPO_NAME="Sadgan.Erp.Panel"
      
      # Get project ID
      echo "Getting project ID..."
      PROJECT_URL="${ORGANIZATION}_apis/projects/SadganErp?api-version=5.1"
      PROJECT_RESPONSE=$(curl -s -u ":${GIT_PAT}" "${PROJECT_URL}")
      PROJECT_ID=$(echo "$PROJECT_RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d':' -f2 | tr -d '"')
      echo "Project ID: ${PROJECT_ID}"
      
      URL="${ORGANIZATION}${PROJECT}/_apis/build/builds?api-version=5.1"
      
      # Approach 1: No repository specified
      echo ""
      echo "========================================="
      echo "APPROACH 1: No repository specified"
      echo "========================================="
      
      cat > payload1.json << EOF
      {
        "definition": {
          "id": ${PIPELINE_ID}
        },
        "sourceBranch": "refs/heads/${BRANCH}",
        "parameters": "{\"CREATE_PR\": \"${CREATE_PR}\", \"SHOULD_RELEASE\": \"${SHOULD_RELEASE}\", \"BRANCH\": \"${BRANCH}\"}"
      }
      EOF
      
      echo "Payload:"
      cat payload1.json
      echo ""
      
      RESPONSE1=$(curl -s -X POST \
        -u ":${GIT_PAT}" \
        -H "Content-Type: application/json" \
        -d @payload1.json \
        "${URL}")
      
      echo "Response: ${RESPONSE1}"
      
      # Approach 2: Repository with GUID only
      echo ""
      echo "========================================="
      echo "APPROACH 2: Repository with GUID only"
      echo "========================================="
      
      cat > payload2.json << EOF
      {
        "definition": {
          "id": ${PIPELINE_ID}
        },
        "sourceBranch": "refs/heads/${BRANCH}",
        "repository": {
          "id": "${BACKEND_REPO_GUID}",
          "type": "TfsGit"
        },
        "parameters": "{\"CREATE_PR\": \"${CREATE_PR}\", \"SHOULD_RELEASE\": \"${SHOULD_RELEASE}\", \"BRANCH\": \"${BRANCH}\"}"
      }
      EOF
      
      echo "Payload:"
      cat payload2.json
      echo ""
      
      RESPONSE2=$(curl -s -X POST \
        -u ":${GIT_PAT}" \
        -H "Content-Type: application/json" \
        -d @payload2.json \
        "${URL}")
      
      echo "Response: ${RESPONSE2}"
      
      # Approach 3: Repository with name instead of GUID
      echo ""
      echo "========================================="
      echo "APPROACH 3: Repository with name instead of GUID"
      echo "========================================="
      
      cat > payload3.json << EOF
      {
        "definition": {
          "id": ${PIPELINE_ID}
        },
        "sourceBranch": "refs/heads/${BRANCH}",
        "repository": {
          "id": "${BACKEND_REPO_NAME}",
          "type": "TfsGit"
        },
        "parameters": "{\"CREATE_PR\": \"${CREATE_PR}\", \"SHOULD_RELEASE\": \"${SHOULD_RELEASE}\", \"BRANCH\": \"${BRANCH}\"}"
      }
      EOF
      
      echo "Payload:"
      cat payload3.json
      echo ""
      
      RESPONSE3=$(curl -s -X POST \
        -u ":${GIT_PAT}" \
        -H "Content-Type: application/json" \
        -d @payload3.json \
        "${URL}")
      
      echo "Response: ${RESPONSE3}"
      
      # Approach 4: Full repository with project
      echo ""
      echo "========================================="
      echo "APPROACH 4: Full repository with project"
      echo "========================================="
      
      cat > payload4.json << EOF
      {
        "definition": {
          "id": ${PIPELINE_ID}
        },
        "sourceBranch": "refs/heads/${BRANCH}",
        "repository": {
          "id": "${BACKEND_REPO_GUID}",
          "type": "TfsGit",
          "name": "${BACKEND_REPO_NAME}",
          "project": {
            "id": "${PROJECT_ID}",
            "name": "SadganErp"
          }
        },
        "parameters": "{\"CREATE_PR\": \"${CREATE_PR}\", \"SHOULD_RELEASE\": \"${SHOULD_RELEASE}\", \"BRANCH\": \"${BRANCH}\"}"
      }
      EOF
      
      echo "Payload:"
      cat payload4.json
      echo ""
      
      RESPONSE4=$(curl -s -X POST \
        -u ":${GIT_PAT}" \
        -H "Content-Type: application/json" \
        -d @payload4.json \
        "${URL}")
      
      echo "Response: ${RESPONSE4}"
      
      # Approach 5: Try without refs/heads prefix
      echo ""
      echo "========================================="
      echo "APPROACH 5: Without refs/heads prefix"
      echo "========================================="
      
      cat > payload5.json << EOF
      {
        "definition": {
          "id": ${PIPELINE_ID}
        },
        "sourceBranch": "${BRANCH}",
        "repository": {
          "id": "${BACKEND_REPO_GUID}",
          "type": "TfsGit"
        },
        "parameters": "{\"CREATE_PR\": \"${CREATE_PR}\", \"SHOULD_RELEASE\": \"${SHOULD_RELEASE}\", \"BRANCH\": \"${BRANCH}\"}"
      }
      EOF
      
      echo "Payload:"
      cat payload5.json
      echo ""
      
      RESPONSE5=$(curl -s -X POST \
        -u ":${GIT_PAT}" \
        -H "Content-Type: application/json" \
        -d @payload5.json \
        "${URL}")
      
      echo "Response: ${RESPONSE5}"
      
      # Approach 6: Use sourceVersion
      echo ""
      echo "========================================="
      echo "APPROACH 6: Using sourceVersion"
      echo "========================================="
      
      cat > payload6.json << EOF
      {
        "definition": {
          "id": ${PIPELINE_ID}
        },
        "sourceBranch": "refs/heads/${BRANCH}",
        "repository": {
          "id": "${BACKEND_REPO_GUID}",
          "type": "TfsGit"
        },
        "sourceVersion": {
          "version": "${BRANCH}",
          "versionType": "branch"
        },
        "parameters": "{\"CREATE_PR\": \"${CREATE_PR}\", \"SHOULD_RELEASE\": \"${SHOULD_RELEASE}\", \"BRANCH\": \"${BRANCH}\"}"
      }
      EOF
      
      echo "Payload:"
      cat payload6.json
      echo ""
      
      RESPONSE6=$(curl -s -X POST \
        -u ":${GIT_PAT}" \
        -H "Content-Type: application/json" \
        -d @payload6.json \
        "${URL}")
      
      echo "Response: ${RESPONSE6}"
      
      # Clean up
      rm -f payload*.json
      
    env:
      GIT_PAT: $(GIT_PAT)
    displayName: 'Test all trigger approaches'